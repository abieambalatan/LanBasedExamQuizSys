<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbieksExamSys — Teacher & Admin</title>
<link rel="stylesheet" href="css/style.css?v=live-monitor-20261112">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>window.ARALHUB_SCHOOL_OPTIONS = {};</script>
<script>window.ARALHUB_ROLE = "teacher";</script>
<script>window.ARALHUB_CURRENT_USER = null;</script>
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>
<div id="app"></div>
<script src="js/common.js?v=live-activity-20261112"></script>
<script src="js/learning.js?v=purple-notifications-20261111"></script>
<script src="js/exam-format.js"></script>
<script>
/* ============================= STATE ============================= */
let state = {
  view: "adminLogin",        // adminLogin | adminHome | createExam | adminResults
  currentUser: null,         // {role:'admin'|'teacher', name} once logged in
  exams: [],
  learningMaterials: [],
  currentExamResults: [],
  activityAttempts: [],
  activityMonitorError: "",
  activityDetail: null,
  adminResultsExamId: null,
  adminReviewResult: null,
  resultsDeptFilter: "",
  resultsYearFilter: "",
  resultsSectionFilter: "",
  draft: { title: "", activityType: "exam", duration: 30, targetGroups: [], questions: [] },
  teachers: [],
  archivedTeachers: [],
  students: [],
  archivedStudents: [],
  selectedDepartment: "ALL",
  selectedStudentDepartment: "",
  selectedStudentYear: "",
  selectedStudentSection: "",
  editingExamId: null,       // set when editing an existing exam, null when creating a new one
  errorMsg: "",
  successMsg: "",
  connError: "",
};

const SCHOOL_OPTIONS = window.ARALHUB_SCHOOL_OPTIONS || {};
const PASSING_PERCENT = 50;
const DEPARTMENTS = SCHOOL_OPTIONS.departments?.length ? SCHOOL_OPTIONS.departments : ["BSIT", "BSCRIM", "BEED", "BSHM", "BSN"];
const SECTIONS = SCHOOL_OPTIONS.section?.length ? SCHOOL_OPTIONS.section : ["A", "B", "C", "D", "E", "F"];
const SECTIONS_BY_DEPARTMENT = SCHOOL_OPTIONS.sections_by_department || {};
const SECTIONS_BY_YEAR = SCHOOL_OPTIONS.sections_by_department_and_year || {};
const YEAR_LEVELS = ["1st Year", "2nd Year", "3rd Year", "4th Year"];
function sectionsForDepartment(department, year) {
  if (year && SECTIONS_BY_YEAR[department]) return SECTIONS_BY_YEAR[department][year] || [];
  return SECTIONS_BY_DEPARTMENT[department] || (DEPARTMENTS.includes(department) ? SECTIONS : []);
}
function resultPercent(result) {
  if (result.percent !== undefined && result.percent !== null && Number.isFinite(Number(result.percent))) return Number(result.percent);
  return result.total ? Number(result.score || 0) / Number(result.total) * 100 : 0;
}
function resultGradeLabel(result) {
  return resultPercent(result) < PASSING_PERCENT ? "Failed" : "Passed";
}

function setView(v, extra) { state.errorMsg = ""; state.successMsg = ""; state.view = v; if (extra) Object.assign(state, extra); render(); }
function adminHeaders() {
  return {};
}

/* ============================= TOPBAR ============================= */
async function logout() {
  state.learningMaterials = []; state.learningSubmissions = null;
  try { await apiRequest("POST", "/api/logout"); } catch (err) {}
  state.currentUser = null;
  navigateToPortal("/login");
}

/* ============================= ADMIN LOGIN ============================= */
function renderAdminLogin() { return renderPortalLogin("doAdminLogin", "au", "ap"); }
async function doAdminLogin() { await doPortalLogin("au", "ap"); }

/* ============================= ADMIN HOME ============================= */
async function goAdminHome() {
  state.connError = "";
  state.selectedDepartment = state.selectedDepartment || "ALL";
  try {
    const department = state.currentUser.role === "teacher" ? state.currentUser.department : "";
    state.exams = await apiRequest("GET", `/api/exams${department ? `?department=${encodeURIComponent(department)}` : ""}`, undefined, state.currentUser.role === "teacher" ? adminHeaders() : undefined);
    if (state.currentUser.role === "admin") {
      state.teachers = await apiRequest("GET", "/api/teachers", undefined, adminHeaders());
      state.archivedTeachers = await apiRequest("GET", "/api/teachers/archived", undefined, adminHeaders());
    } else {
      state.teachers = [];
      state.archivedTeachers = [];
    }
    state.students = await apiRequest("GET", "/api/students/managed", undefined, adminHeaders());
    state.archivedStudents = await apiRequest("GET", "/api/students/archived", undefined, adminHeaders());
  }
  catch (err) { state.connError = "Unable to load your workspace. Check your connection, then try again."; }
  setView("adminHome");
}
function renderAdminHome() {
  const teacher = state.currentUser.role === "teacher";
  if (teacher && !["activities", "students"].includes(state.workspaceSection)) state.workspaceSection = "activities";
  const rows = state.exams.map(ex => `<article class="exam-row" data-subject="${esc((ex.subject || "").trim().toLowerCase() || "__general__")}" data-activity="${ex.activityType === "quiz" ? "quiz" : "exam"}" data-search="${esc((ex.title + ' ' + (ex.subject || '')).toLowerCase())}"><div class="activity-card-top"><span class="activity-icon ${ex.activityType === "quiz" ? "mint" : "violet"}">${uiIcon(ex.activityType === "quiz" ? "spark" : "file")}</span><span class="badge open">${ex.activityType === "quiz" ? "Quiz" : "Exam"}</span></div><div class="info"><span class="activity-subject">${esc(ex.subject || "Class assessment")}</span><strong>${esc(ex.title)}</strong><span>${esc((ex.departments || [ex.department || "ALL"]).join(", "))} &middot; ${ex.targetClasses?.length ? `${ex.targetClasses.length} target ${ex.targetClasses.length === 1 ? "class" : "classes"}` : esc(ex.yearLevel || "All years")}</span></div><div class="activity-meta"><span>${uiIcon("file")} ${ex.questionCount} items</span><span>${uiIcon("clock")} ${ex.duration} min</span><span>${uiIcon("people")} ${ex.attempts} attempts</span></div><div class="activity-card-footer"><button class="btn secondary" onclick="openAdminResults('${ex.id}')">View results ${uiIcon("arrow")}</button><div class="card-actions"><button class="linklike" onclick="startEditExam('${ex.id}')">Edit</button><button class="linklike danger-link" onclick="deleteExam('${ex.id}')">Delete</button></div></div></article>`).join("");
  if (teacher && state.workspaceSection === "activities") return renderTeacherDashboard(rows);
  return `<div class="wrap"><div class="wrap-inner wide">${!teacher ? `<section id="overview" class="dashboard-hero"><div><span class="eyebrow">YOUR CAMPUS AT A GLANCE</span><h1>Campus overview</h1><p>Welcome back, ${esc(state.currentUser.name || "Administrator")}. Your teachers, students, and learning community in one place.</p><span class="hero-chip">${uiIcon("shield")} Administrator workspace</span></div><div class="hero-art" aria-hidden="true"><div class="hero-art-ring"></div><div class="hero-art-tile">${uiIcon("people")}</div><span class="hero-art-spark">${uiIcon("spark")}</span><span class="hero-art-check">${uiIcon("check")}</span></div></section>` : ""}
  ${state.connError ? `<div class="conn-banner"><span>${esc(state.connError)}</span><button class="btn secondary" onclick="goAdminHome()">Try again</button></div>` : ""}
  ${!teacher ? `<div class="stat-row"><div class="stat"><span class="stat-icon violet">${uiIcon("people")}</span><div><span class="label">Teachers</span><strong class="value">${state.teachers.length}</strong><small>Your teaching community</small></div></div><div class="stat"><span class="stat-icon mint">${uiIcon("people")}</span><div><span class="label">Students</span><strong class="value">${state.students.length}</strong><small>Across all departments</small></div></div><div class="stat"><span class="stat-icon amber">${uiIcon("book")}</span><div><span class="label">Activities</span><strong class="value">${state.exams.length}</strong><small>Exams and quizzes</small></div></div></div>` : ""}
  ${teacher ? state.workspaceSection === "activities" ? `<section id="activities"><div class="section-title-row"><div><span class="eyebrow">EXAMS &amp; QUIZZES</span><h2>Your assessments</h2></div><button class="btn secondary" onclick="startCreateExam()">${uiIcon("plus")} New activity</button></div>${state.exams.length ? `${renderActivityTools()}<div class="exam-list">${rows}</div><div id="activityNoMatches" class="empty" hidden>No activities match your search. Try another title or subject.</div>` : `<div class="empty">${uiIcon("file")}<h3>Your next great assessment starts here.</h3><p>Create an activity or upload your questions from a TXT file.</p><button class="btn" onclick="startCreateExam()">${uiIcon("plus")} Create your first activity</button></div>`}</section>` : "" : renderTeacherManagement()}
  ${!teacher || state.workspaceSection === "students" ? renderStudentManagement() : ""}</div></div>`;
}
function teacherSubjectGroups() {
  const groups = new Map();
  for (const exam of state.exams) {
    const subject = (exam.subject || "").trim();
    const key = subject.toLowerCase() || "__general__";
    if (!groups.has(key)) groups.set(key, {key, subject, label:subject || "General assessments", activities:[]});
    groups.get(key).activities.push(exam);
  }
  return [...groups.values()].sort((a,b) => a.label.localeCompare(b.label));
}
function openTeacherSubject(index) {
  const subject = teacherSubjectGroups()[index];
  if (!subject) return;
  state.selectedTeacherSubject = subject.key;
  state.activityQuery = "";
  state.activityFilter = "all";
  render();
  document.getElementById("activities")?.scrollIntoView({behavior:"smooth", block:"start"});
}
function closeTeacherSubject() {
  state.selectedTeacherSubject = "";
  state.activityQuery = "";
  state.activityFilter = "all";
  render();
}
function teacherNetworkReady() { return navigator.onLine !== false && !state.connError && !state.dashboardLiveError; }
function updateTeacherNetworkStatus() {
  const ready = teacherNetworkReady();
  document.querySelectorAll("[data-teacher-network]").forEach(element => {
    element.textContent = ready ? "Ready" : "Check connection";
    element.classList.toggle("network-ready", ready);
  });
}
window.addEventListener("online", updateTeacherNetworkStatus);
window.addEventListener("offline", updateTeacherNetworkStatus);
function renderTeacherDashboard(rows) {
  const subjects = teacherSubjectGroups();
  const selected = subjects.find(subject => subject.key === state.selectedTeacherSubject);
  if (!selected) state.selectedTeacherSubject = "";
  const ready = teacherNetworkReady();
  const cards = subjects.map((subject,index) => {
    const dates = subject.activities.map(activity => activity.createdAt || activity.created_at).filter(value => value && !Number.isNaN(new Date(value).getTime())).sort();
    const created = dates.length ? `Created ${new Date(dates[0]).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}` : `${subject.activities.reduce((total,item)=>total+(item.questionCount || 0),0)} questions across activities`;
    return `<article class="teacher-subject-card"><div class="teacher-subject-top"><span class="eyebrow">${subject.subject ? "SUBJECT" : "ACTIVITIES"}</span><span class="teacher-subject-count"><i></i>${subject.activities.length} ${subject.activities.length === 1 ? "activity" : "activities"}</span></div><h3>${esc(subject.label)}</h3><div class="teacher-subject-bottom"><span>${esc(created)}</span><button type="button" onclick="openTeacherSubject(${index})" aria-label="Manage ${esc(subject.label)}">Manage ${uiIcon("arrow")}</button></div></article>`;
  }).join("");
  return `<div class="wrap teacher-dashboard-wrap"><div class="wrap-inner wide">
    <section class="teacher-welcome"><div><span class="eyebrow">INSTRUCTOR WORKSPACE</span><h1>Welcome back, ${esc(state.currentUser.name || "Teacher")}.</h1><p>Create assessments, publish them to your classes, and review student performance from one place.</p></div><button type="button" class="btn teacher-welcome-action" onclick="startCreateExam()">${uiIcon("plus")} New activity</button></section>
    ${state.connError ? `<div class="conn-banner"><span>${esc(state.connError)}</span><button class="btn secondary" onclick="goAdminHome()">Try again</button></div>` : ""}
    <div class="teacher-summary-grid"><div class="teacher-summary-card"><div><span>Subjects</span>${uiIcon("book")}</div><strong>${subjects.filter(subject => subject.subject).length}</strong></div><div class="teacher-summary-card"><div><span>Workspace</span>${uiIcon("grid")}</div><strong>Instructor</strong></div><div class="teacher-summary-card"><div><span>Network</span>${uiIcon("check")}</div><strong data-teacher-network class="${ready ? "network-ready" : ""}">${ready ? "Ready" : "Check connection"}</strong></div></div>
    ${!selected ? `<section class="teacher-subjects"><div class="teacher-section-heading"><div><span class="eyebrow">COURSE MANAGEMENT</span><h2>My subjects</h2><p>Open a subject to manage its activities, questions, and student results.</p></div><button type="button" class="btn secondary" onclick="startCreateExam()">${uiIcon("plus")} Add activity</button></div>${cards ? `<div class="teacher-subject-grid">${cards}</div>` : `<div class="teacher-subject-empty">${uiIcon("book")}<h3>Your subjects start here.</h3><p>Create your first activity and enter its subject to organize your assessments.</p><button type="button" class="btn" onclick="startCreateExam()">${uiIcon("plus")} Create activity</button></div>`}</section>` : ""}
    ${selected ? `<section id="activities" class="teacher-activities-panel"><div class="teacher-section-heading"><div><button type="button" class="back-link teacher-all-subjects" onclick="closeTeacherSubject()">&larr; All subjects</button><span class="eyebrow">YOUR ASSESSMENTS</span><h2>${esc(selected.label)}</h2><p>Create an activity, edit your questions, or open live results for this subject.</p></div><button type="button" class="btn" onclick="startCreateExam()">${uiIcon("plus")} New activity</button></div>${state.exams.length ? `${renderActivityTools()}<div class="exam-list">${rows}</div><div id="activityNoMatches" class="empty" hidden>No activities match your search. Try another title or subject.</div>` : `<div class="empty"><h3>No activities yet.</h3><p>Your published exams and quizzes will appear here.</p></div>`}</section>` : ""}
  </div></div>`;
}
let dashboardLiveTimer = null;
let dashboardLiveRequest = null;
function dashboardLiveActive() {
  return !!document.querySelector(".teacher-dashboard-wrap") && state.currentUser?.role === "teacher" && state.view === "adminHome" && state.workspaceSection === "activities" && !document.hidden && !document.querySelector('[role="dialog"]');
}
function syncDashboardLiveUpdates() {
  clearTimeout(dashboardLiveTimer);
  if (!dashboardLiveActive()) { dashboardLiveRequest = null; return; }
  if (!dashboardLiveRequest) dashboardLiveTimer = setTimeout(refreshTeacherDashboard, state.dashboardLiveError ? 6000 : 3000);
}
async function refreshTeacherDashboard() {
  if (!dashboardLiveActive() || dashboardLiveRequest) return;
  const request = {user:state.currentUser}; dashboardLiveRequest = request;
  try {
    const exams = await apiRequest("GET", "/api/exams", undefined, adminHeaders());
    if (dashboardLiveRequest !== request || state.currentUser !== request.user || !dashboardLiveActive()) return;
    if (!Array.isArray(exams)) throw new Error("Invalid dashboard response");
    const changed = JSON.stringify(exams) !== JSON.stringify(state.exams) || !!state.dashboardLiveError;
    state.exams = exams; state.dashboardLiveError = "";
    if (changed) { const position = window.scrollY; render(); window.scrollTo({top:position, behavior:"auto"}); }
  } catch (error) {
    if (dashboardLiveRequest === request && dashboardLiveActive()) {
      state.dashboardLiveError = error.message || "Connection interrupted";
      updateTeacherNetworkStatus();
    }
  } finally {
    if (dashboardLiveRequest === request) dashboardLiveRequest = null;
    syncDashboardLiveUpdates();
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && dashboardLiveActive()) refreshTeacherDashboard(); else syncDashboardLiveUpdates(); });
window.addEventListener("online", () => { if (dashboardLiveActive()) refreshTeacherDashboard(); });
window.addEventListener("pagehide", () => { clearTimeout(dashboardLiveTimer); dashboardLiveRequest = null; });
function renderStudentManagement() {
  const teacher = state.currentUser.role === "teacher";
  const assignedDepartments = state.currentUser.departments || [state.currentUser.department];
  const departments = [...(teacher ? [] : ["ALL"]), ...DEPARTMENTS.filter(department => !teacher || assignedDepartments.includes(department))];
  const selected = departments.includes(state.selectedStudentDepartment) ? state.selectedStudentDepartment : teacher ? "" : "ALL";
  const year = selected && YEAR_LEVELS.includes(state.selectedStudentYear) ? state.selectedStudentYear : "";
  const availableSections = year ? sectionsForDepartment(selected, year) : [];
  const section = availableSections.includes(state.selectedStudentSection) ? state.selectedStudentSection : "";
  const ready = !teacher || Boolean(selected && year && section);
  const visibleStudents = ready ? state.students.filter(student => (selected === "ALL" || student.department === selected) && (!teacher || (student.year_level === year && student.section === section))) : [];
  const selectionPrompt = !selected ? "Choose a department, year level, and section to display students." : !year ? "Choose a year level, then a section to display students." : "Choose a section to display students.";
  const directoryTitle = teacher ? !selected ? "Choose a department, year level, and section" : `${selected} · ${!year ? "Choose a year level" : `${year}${section ? ` · Section ${section}` : " · Choose a section"}`}` : selected === "ALL" ? "All departments" : selected;
  const cards = departments.map(department => {
    const count = department === "ALL" ? state.students.length : state.students.filter(student => student.department === department).length;
    return `<button type="button" class="department-card department-${department.toLowerCase()}${selected === department ? " active" : ""}" data-student-department="${department}" aria-pressed="${selected === department}" aria-controls="student-directory-panel" onclick="selectStudentDepartment('${department}')"><span class="department-code">${department === "ALL" ? "All departments" : department}</span><strong>${count}</strong><span>${count === 1 ? "student" : "students"}</span></button>`;
  }).join("");
  const rows = visibleStudents.map(student => `
    <tr>
      <td><strong>${esc(student.name)}</strong></td>
      <td class="mono">${esc(student.roll_no)}</td>
      <td>${esc(student.department)}${student.section ? `-${esc(student.section)}` : ""}</td>
      <td>${esc(student.year_level || "—")}</td>
      <td><button class="btn secondary" onclick="resetStudentPassword('${esc(student.id)}')">Reset password</button> <button class="btn danger" onclick="archiveStudent('${esc(student.id)}')">DELETE</button></td>
    </tr>`).join("");
  return `<section id="students" class="teacher-dashboard">
    <div class="dashboard-heading"><div><span class="eyebrow">${teacher ? "Teacher workspace" : "Super Admin"}</span><h2>Your students</h2><p>${teacher ? "Choose a department, year level, and section to display its students." : "Choose a department to view students."} Verify a student's identity before resetting their password.</p></div><div class="teacher-total"><span>Students</span><strong>${state.students.length}</strong></div></div>
    <div class="department-grid" role="group" aria-label="Student departments">${cards}</div>
    ${teacher ? `<div class="field-row"><div class="field student-section-filter"><label for="studentYearFilter">Year level</label><select id="studentYearFilter" onchange="selectStudentYear(this.value)" aria-controls="student-directory-panel" ${selected ? "" : "disabled"}><option value="">${selected ? "Choose a year level" : "Choose a department first"}</option>${YEAR_LEVELS.map(value => `<option value="${esc(value)}" ${year === value ? "selected" : ""}>${esc(value)}</option>`).join("")}</select></div><div class="field student-section-filter"><label for="studentSectionFilter">Section</label><select id="studentSectionFilter" onchange="selectStudentSection(this.value)" aria-controls="student-directory-panel" ${year ? "" : "disabled"}><option value="">${year ? "Choose a section" : "Choose a year level first"}</option>${availableSections.map(value => `<option value="${esc(value)}" ${section === value ? "selected" : ""}>Section ${esc(value)}</option>`).join("")}</select></div></div>` : ""}
    <details id="student-directory-panel" class="teacher-panel student-password-panel" ${state.workspaceSection === "students" ? "open" : ""}>
      <summary class="panel-heading"><div><span class="eyebrow">Student directory</span><h3>${esc(directoryTitle)}</h3></div><span class="count-label" role="status">${ready ? `${visibleStudents.length} ${visibleStudents.length === 1 ? "student" : "students"}` : "Select department, year, and section"}</span></summary>
      ${!ready ? `<div class="empty department-empty">${selectionPrompt}</div>` : visibleStudents.length ? `${renderDirectoryTools("student-directory", "Search name, ID, or department")}<div id="student-directory" class="teacher-table-wrap"><table class="teacher-record-table"><thead><tr><th>Student</th><th>ID Number</th><th>Department / section</th><th>Year level</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty department-empty">${selected !== "ALL" ? `No students are registered in ${esc(selected)}${teacher ? `, ${esc(year)}, Section ${esc(section)}` : ""} yet.` : "No students are registered yet."}</div>`}
    </details>
    <details class="teacher-panel student-archive-panel" style="margin-top:20px;">
      <summary class="panel-heading"><div><span class="eyebrow">Staff-only recovery</span><h3>Deleted student accounts</h3></div><span class="count-label">${state.archivedStudents.length}</span></summary>
      ${state.archivedStudents.length ? `<div class="teacher-table-wrap"><table class="teacher-record-table"><thead><tr><th>Student</th><th>ID Number</th><th>Department / section</th><th>Year level</th><th>Archived</th><th>Actions</th></tr></thead><tbody>${state.archivedStudents.map(student => `<tr><td><strong>${esc(student.name)}</strong></td><td class="mono">${esc(student.roll_no)}</td><td>${esc(student.department)}${student.section ? `-${esc(student.section)}` : ""}</td><td>${esc(student.year_level || "—")}</td><td>${esc(student.deleted_at || "")}</td><td>${state.currentUser?.role === "admin" ? `<button class="btn secondary" onclick="restoreStudent('${esc(student.id)}')">Retrieve account</button> <button class="btn danger" onclick="archiveStudent('${esc(student.id)}')">DELETE permanently</button>` : '<span class="help-text">Super admin can retrieve this account</span>'}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty department-empty">No deleted student accounts.</div>`}
    </details>
  </section>`;
}
function selectStudentDepartment(department) {
  if (state.selectedStudentDepartment !== department) {
    state.selectedStudentYear = "";
    state.selectedStudentSection = "";
  }
  state.selectedStudentDepartment = department;
  state.workspaceSection = "students";
  render();
  document.querySelector(`[data-student-department="${department}"]`)?.focus({ preventScroll: true });
}
function selectStudentYear(year) {
  const selected = YEAR_LEVELS.includes(year) ? year : "";
  if (state.selectedStudentYear !== selected) state.selectedStudentSection = "";
  state.selectedStudentYear = selected;
  state.workspaceSection = "students";
  render();
  document.getElementById("studentYearFilter")?.focus({ preventScroll: true });
}
function selectStudentSection(section) {
  state.selectedStudentSection = sectionsForDepartment(state.selectedStudentDepartment, state.selectedStudentYear).includes(section) ? section : "";
  state.workspaceSection = "students";
  render();
  document.getElementById("studentSectionFilter")?.focus({ preventScroll: true });
}
function renderTeacherManagement() {
  const departments = ["ALL", ...DEPARTMENTS];
  const selected = state.selectedDepartment || "ALL";
  const visibleTeachers = selected === "ALL" ? state.teachers : state.teachers.filter(teacher => teacher.department === selected);
  const cards = departments.map(department => {
    const count = department === "ALL" ? state.teachers.length : state.teachers.filter(teacher => teacher.department === department).length;
    const active = selected === department ? " active" : "";
    return `<button class="department-card department-${department.toLowerCase()}${active}" onclick="selectDepartment('${department}')"><span class="department-code">${department}</span><strong>${count}</strong><span>${count === 1 ? "teacher" : "teachers"}</span></button>`;
  }).join("");
  const rows = visibleTeachers.map(teacher => `<tr><td><strong>${esc(teacher.name)}</strong><small class="table-sub">Password protected</small></td><td class="mono">${esc(teacher.username)}</td><td><span class="department-pill department-${String(teacher.department).toLowerCase()}">${esc(teacher.department)}</span></td><td><strong>${teacher.exam_count || 0} activities</strong><small class="table-sub">${teacher.attempt_count || 0} student attempts</small></td><td><button class="btn secondary" onclick="resetTeacherPassword('${teacher.id}','${esc(teacher.name)}')">Reset password</button> <button class="btn danger" onclick="removeTeacher('${teacher.id}','${esc(teacher.name)}')">DELETE</button></td></tr>`).join("");

let resultsLiveTimer = null;
let resultsRefreshRequest = null;
function resultsLiveActive() {
  return !!state.currentUser && state.view === "adminResults" && !!document.querySelector(".admin-results-page") && !document.hidden && !document.querySelector('[role="dialog"]');
}
function stopResultsLiveUpdates() {

  resultsLiveTimer = null;

function syncResultsLiveUpdates() {
  clearTimeout(resultsLiveTimer);
  resultsLiveTimer = null;

  if (!resultsRefreshRequest) resultsLiveTimer = setTimeout(() => refreshAdminResults({background:true}), state.resultsLiveError ? 6000 : 3000);

function updateResultsLiveStatus() {
  const label = document.getElementById("resultsLiveStatus");
  if (label) {

      ? state.resultsLiveError.startsWith("Results updated") ? "Results updated · roster retrying" : "Refresh failed · retrying automatically"

function renderLiveResultsChange() {
  const position = {x:window.scrollX, y:window.scrollY};
  const panels = [...document.querySelectorAll('.admin-results-page details[id]')].map(panel => ({id:panel.id, open:panel.open}));
  const tables = [...document.querySelectorAll('.admin-results-page .teacher-table-wrap, .admin-results-page .table-scroll')].map(table => table.scrollLeft);
  render();

  document.querySelectorAll('.admin-results-page .teacher-table-wrap, .admin-results-page .table-scroll').forEach((table, index) => { table.scrollLeft = tables[index] || 0; });
  window.scrollTo({left:position.x, top:position.y, behavior:"auto"});

async function refreshAdminResults({background = false} = {}) {
  if (!resultsLiveActive()) return;
  const examId = state.adminResultsExamId;
  if (!examId || resultsRefreshRequest?.examId === examId) return;
  const request = {examId};
  resultsRefreshRequest = request;
  clearTimeout(resultsLiveTimer);
  updateResultsLiveStatus();
  try {
    const [resultResponse, activityResponse] = await Promise.allSettled([
      apiRequest("GET", `/api/results?examId=${encodeURIComponent(examId)}`, undefined, adminHeaders()),
      apiRequest("GET", `/api/exams/${encodeURIComponent(examId)}/activity`, undefined, adminHeaders()),
    ]);
    if (resultsRefreshRequest !== request || state.adminResultsExamId !== examId || !resultsLiveActive()) return;
    if (resultResponse.status === "rejected") throw resultResponse.reason;
    const rows = resultResponse.value;
    if (!Array.isArray(rows)) throw new Error("The results service returned an invalid response.");
    const monitorValid = activityResponse.status === "fulfilled" && Array.isArray(activityResponse.value) && activityResponse.value.every(item => item.activitySummary && item.status);
    const monitorError = monitorValid ? "" : `Activity monitoring unavailable: ${activityResponse.status === "rejected" ? activityResponse.reason.message : 'Invalid monitoring response.'}`;
    let changed = JSON.stringify(rows) !== JSON.stringify(state.currentExamResults) || monitorError !== state.activityMonitorError;
    if (monitorValid) {
      changed ||= JSON.stringify(activityResponse.value) !== JSON.stringify(state.activityAttempts);
      state.activityAttempts = activityResponse.value;
    }
    state.activityMonitorError = monitorError;
    if (state.activityDetail && monitorValid) {
      try {
        const detail = await apiRequest("GET", `/api/exams/${encodeURIComponent(examId)}/activity/${encodeURIComponent(state.activityDetail.id)}`, undefined, adminHeaders());
        if (resultsRefreshRequest !== request || state.adminResultsExamId !== examId || !resultsLiveActive()) return;
        changed ||= JSON.stringify(detail) !== JSON.stringify(state.activityDetail);
        state.activityDetail = detail;
      } catch (error) { state.activityMonitorError = `Activity timeline unavailable: ${error.message}`; changed = true; }
    }
    state.currentExamResults = rows;
    state.resultsLastUpdated = Date.now();
    state.resultsLiveError = "";
    if (changed) renderLiveResultsChange();
  } catch (err) {
    if (resultsRefreshRequest === request && state.adminResultsExamId === examId && resultsLiveActive()) {
      const message = err instanceof Error && err.message ? err.message : "Unknown error.";
      state.resultsLiveError = `Could not refresh results: ${message}`;
    }
  } finally {
    if (resultsRefreshRequest === request) {
      resultsRefreshRequest = null;
      if (state.view === "adminResults") updateResultsLiveStatus();
      syncResultsLiveUpdates();
    }
  }
}

function groupTargetClasses(targetClasses) {
  const groups = new Map();
  for (const target of targetClasses) {
    if (!groups.has(target.department)) groups.set(target.department, {department: target.department, yearLevels: [], sections: [], sectionsByYear: {}});
    const group = groups.get(target.department);
    if (!group.sectionsByYear[target.yearLevel]) {
      group.yearLevels.push(target.yearLevel);
      group.sectionsByYear[target.yearLevel] = [];
    }
    if (!group.sectionsByYear[target.yearLevel].includes(target.section)) group.sectionsByYear[target.yearLevel].push(target.section);
  }
  return [...groups.values()].map(group => {
    group.yearLevels.sort((a, b) => YEAR_LEVELS.indexOf(a) - YEAR_LEVELS.indexOf(b));
    Object.values(group.sectionsByYear).forEach(sections => sections.sort());
    return group;
  });
}

      <div class="target-year-list">${group.department && group.yearLevels.length ? group.yearLevels.map(year => `<fieldset class="target-choice-group target-year-sections" data-target-year="${esc(year)}"><legend><strong>${esc(group.department)} · ${esc(year)}</strong><span>${sectionsForDepartment(group.department, year).length} sections available</span></legend><div class="target-choice-options">${sectionsForDepartment(group.department, year).map((value, optionIndex) => `<label><input type="checkbox" id="target-${index}-year-${YEAR_LEVELS.indexOf(year)}-section-${optionIndex}" ${targetGroupSections(group, year).includes(value) ? "checked" : ""} onchange="setTargetYearSection(${index}, '${esc(year)}', '${esc(value)}', this.checked)"><span>${esc(group.department)} ${YEAR_LEVELS.indexOf(year) + 1}-${esc(value)}</span></label>`).join("")}</div></fieldset>`).join("") : `<p class="help-text">Choose a department and year level to see its sections.</p>`}</div>

function targetGroupSections(group, year) {

  const group = state.draft.targetGroups[index];

      ${state.errorMsg ? `<div class="banner">${esc(state.errorMsg)}</div>` : ""}

    <div class="builder-layout"><div class="builder-main">

        <fieldset class="activity-kind-picker"><legend>Activity type</legend>${[["exam", "file", "Exam", "One submission per student"], ["quiz", "spark", "Quiz", "Retries after you return a submission"]].map(([value, icon, label, description]) => `<label class="activity-kind"><input type="radio" name="builderActivityType" value="${value}" ${state.draft.activityType === value ? "checked" : ""} onchange="state.draft.activityType=this.value;render()"><span class="kind-icon">${uiIcon(icon)}</span><span><strong>${label}</strong><small>${description}</small></span></label>`).join("")}</fieldset>
        <div class="field"><label for="activityTitle">Activity title <span class="required-mark">*</span></label><input id="activityTitle" type="text" placeholder="e.g. Midterm Examination — Fundamentals of Computing" value="${esc(state.draft.title)}" oninput="state.draft.title=this.value" /></div>

      </section>

      <section id="builder-questions" class="builder-card builder-question-card" aria-labelledby="builderQuestionsTitle"><div class="builder-card-heading"><span class="builder-section-icon amber">${uiIcon("book")}</span><div><span class="eyebrow">03 / The assessment</span><h2 id="builderQuestionsTitle">Questions</h2><p>Write your own questions or import a prepared file.</p></div></div>
      <details class="bulk-import">

        <div class="field"><label for="bulkQuestionsFile">Question file (.txt)</label><input id="bulkQuestionsFile" type="file" accept=".txt,text/plain" onchange="importQuestions(this.files[0])" /></div>
        <div class="help-text">Uploading replaces the questions in this draft. Item counts come from the file; no fixed number is required. Use Part headings, Question: and Answer: lines. Matching prompts can share a Choices: list.</div>
        <a class="btn secondary" href="exam_template.txt" download="AbieksExamSys_exam_template.txt">Download TXT template</a>
        ${state.draft.importFileName ? `<div class="help-text">Loaded file: ${esc(state.draft.importFileName)}</div>` : ""}
      </details>
      <div class="builder-question-tools"><div class="builder-part-filters" role="group" aria-label="Filter questions by part"><button type="button" data-part-filter="all" class="${questionFilter === "all" ? "active" : ""}" aria-pressed="${questionFilter === "all"}" onclick="filterBuilderQuestions('all')">All <span data-part-count="all">${state.draft.questions.length}</span></button>${EXAM_PARTS.map(item => `<button type="button" data-part-filter="${item.type}" class="${questionFilter === item.type ? "active" : ""}" aria-pressed="${questionFilter === item.type}" onclick="filterBuilderQuestions('${item.type}')" title="${esc(item.label)}">Part ${item.part} <span data-part-count="${item.type}">${state.draft.questions.filter(q => q.type === item.type).length}</span></button>`).join("")}</div><p>${uiIcon("shield")} Questions shuffle within each part for every student.</p></div>

function setQuestionExpanded(qid, expanded) {
  if (expanded) {
    state.draft.expandedQuestionId = qid;
    document.querySelectorAll(".qcard[open]").forEach(card => {
      if (card.dataset.questionId !== qid) card.open = false;
    });
  } else if (state.draft.expandedQuestionId === qid) {
    state.draft.expandedQuestionId = null;
  }
}
function setQText(qid, val) {
  const q = state.draft.questions.find(question => question.id === qid);
  if (q) q.text = val;
  const summary = document.querySelector(`[data-question-summary="${qid}"]`);
  if (summary) summary.textContent = val || "New question";
  updateBuilderQuestionIndicators();
}
function setOption(qid, idx, val) { const q = state.draft.questions.find(q => q.id === qid); if (q) q.options[idx] = val; updateBuilderQuestionIndicators(); }
function setCorrect(qid, idx) { const q = state.draft.questions.find(q => q.id === qid); if (q) q.correct = idx; updateBuilderQuestionIndicators(); }
function setPart(qid, val) { setQuestionType(qid, EXAM_PARTS.find(item => item.part === Number(val))?.type); }
function setQuestionType(qid, val) {
  const q = state.draft.questions.find(q => q.id === qid);
  const definition = EXAM_PARTS.find(item => item.type === val);
  if (!q || !definition) return;
  q.type = val; q.part = definition.part; q.correct = 0;
  q.options = val === "true_false" ? ["True", "False"] : val === "identification" ? [] : ["", "", "", ""];
  q.answerText = ""; q.alternatives = [];
  render();
}
function addMatchingChoice(qid) {
  const q = state.draft.questions.find(q => q.id === qid);
  if (q?.type === "matching" && q.options.length < 26) q.options.push("");
  render();
}
function removeMatchingChoice(qid, index) {
  const q = state.draft.questions.find(q => q.id === qid);
  if (q?.type !== "matching" || q.options.length <= 2) return;
  q.options.splice(index, 1);
  if (q.correct === index) q.correct = 0;
  else if (q.correct > index) q.correct--;
  render();
}
function setAnswerText(qid, val) { const q = state.draft.questions.find(q => q.id === qid); if (q) q.answerText = val.toUpperCase(); updateBuilderQuestionIndicators(); }
function setAlternatives(qid, val) { const q = state.draft.questions.find(q => q.id === qid); if (q) q.alternatives = val.toUpperCase().split(",").map(answer => answer.trim()).filter(Boolean); updateBuilderQuestionIndicators(); }
function addQuestion() {
  const question = blankQuestion(state.draft.questionFilter);
  state.draft.questions.push(question);
  state.draft.expandedQuestionId = question.id;
  render();
  document.querySelector(`[data-question-id="${question.id}"] textarea`)?.focus();
}
function removeQuestion(qid) {
  state.draft.questions = state.draft.questions.filter(question => question.id !== qid);
  if (state.draft.expandedQuestionId === qid) {
    state.draft.expandedQuestionId = state.draft.questions.length ? state.draft.questions[state.draft.questions.length - 1].id : null;
  }
  render();
}
function cancelCreateExam() { state.editingExamId = null; goAdminHome(); }

async function importQuestions(file) {
  if (!file) return;
  state.errorMsg = ""; state.successMsg = "";
  const draft = state.draft;
  try {
    if (!/\.txt$/i.test(file.name)) throw new Error("Choose a .txt question file.");
    if (file.size > 1024 * 1024) throw new Error("The TXT file must be 1 MB or smaller.");
    const bytes = new Uint8Array(await file.arrayBuffer());
    const encoding = bytes[0] === 255 && bytes[1] === 254 ? "utf-16le" : bytes[0] === 254 && bytes[1] === 255 ? "utf-16be" : "utf-8";
    let content;
    try { content = new TextDecoder(encoding, { fatal: true }).decode(bytes); }
    catch (error) { throw new Error("Save the question file as UTF-8 text and upload it again."); }
    const imported = parseExamText(content).map(q => ({...q, id: "tmp_" + crypto.getRandomValues(new Uint32Array(4)).join("_")}));
    if (state.draft !== draft || state.view !== "createExam") return;
    draft.questions = imported;
    draft.expandedQuestionId = imported[0].id;
    draft.importFileName = file.name;
    state.successMsg = `${imported.length} items loaded from ${file.name}. Review the questions before publishing.`;
  } catch (error) {
    if (state.draft !== draft || state.view !== "createExam") return;
    state.errorMsg = error.message;
  }
  render();
}

function renderPublishSignIn() {
  if (!state.publishAuthRequired) return "";
  return `<section class="builder-card publish-signin" aria-labelledby="publishSignInHeading"><h2 id="publishSignInHeading">Sign in to publish</h2><p>Your browser session expired or switched accounts. Your ${state.draft.questions.length} questions and assessment details are still here. Sign in with your teacher account, then select Publish again.</p><form onsubmit="event.preventDefault(); submitAuthForm(this, signInForPublishing)"><div class="field-row"><div class="field"><label for="publishTeacherUsername">Teacher username</label><input id="publishTeacherUsername" name="username" autocomplete="username" value="${esc(state.currentUser?.username || "")}" required></div><div class="field"><label for="publishTeacherPassword">Password</label><input id="publishTeacherPassword" name="password" type="password" autocomplete="current-password" required></div></div><button type="submit" class="btn">Sign in and keep questions</button></form></section>`;
}
async function signInForPublishing() {
  if (state.publishSigningIn) return;
  const username = (document.getElementById("publishTeacherUsername")?.value || "").trim();
  const password = document.getElementById("publishTeacherPassword")?.value || "";
  if (!username || !password) return;
  const owner = state.currentUser?.username;
  state.publishSigningIn = true;
  try {
    const account = await apiRequest("POST", "/api/admin/login", {username, password});
    if (account.role !== "teacher") throw new Error("Use your teacher account here. Your questions are still saved in this page.");
    if (owner && account.username !== owner) throw new Error(`Sign in as ${owner} to publish this assessment. Your questions are still here.`);
    state.currentUser = {role:account.role, username:account.username, name:account.name, department:account.department || "ALL", departments:account.departments || []};
    state.publishAuthRequired = false;
    state.errorMsg = "";
    state.successMsg = `Teacher sign-in restored. Your ${state.draft.questions.length} questions are ready. Review them, then select Publish.`;
    render();
    document.querySelector("[data-publish-activity]")?.focus();
  } catch (error) {
    state.errorMsg = error.message || "Teacher sign-in failed. Your questions are still here.";
    render();
  } finally { state.publishSigningIn = false; }
}
async function saveExam() {
  if (state.savingActivity) return;
  const d = state.draft;
  if (!d.title.trim()) { state.errorMsg = "Please enter an exam title."; render(); return; }
  if (!d.duration || d.duration < 1) { state.errorMsg = "Duration must be at least 1 minute."; render(); return; }
  if (!d.subject.trim()) { state.errorMsg = "Please enter the subject."; render(); return; }
  if (!Array.isArray(d.targetGroups) || !d.targetGroups.length) { state.errorMsg = "Add at least one department."; render(); return; }
  const targetClasses = [];
  const targetKeys = new Set();
  for (const group of d.targetGroups) {
    if (!DEPARTMENTS.includes(group.department) || !group.yearLevels.length || group.yearLevels.some(year => !targetGroupSections(group, year).length)) { state.errorMsg = "Choose a department and at least one year level and section for every department."; render(); return; }
    if (group.yearLevels.some(year => !YEAR_LEVELS.includes(year) || targetGroupSections(group, year).some(section => !sectionsForDepartment(group.department, year).includes(section)))) { state.errorMsg = "Choose sections available in the selected department and year level."; render(); return; }
    for (const yearLevel of group.yearLevels) {
      for (const section of targetGroupSections(group, yearLevel)) {
        const key = `${group.department}|${yearLevel}|${section}`;
        if (targetKeys.has(key)) { state.errorMsg = "The same department, year, and section is selected more than once."; render(); return; }
        targetKeys.add(key);
        targetClasses.push({department: group.department, yearLevel, section});
      }
    }
  }
  if (targetClasses.length > 120) { state.errorMsg = "This activity has more than 120 target classes. Remove some year or section selections."; render(); return; }
  if (d.questions.length === 0) { state.errorMsg = "Add at least one question."; render(); return; }
  for (let i = 0; i < d.questions.length; i++) {
    const q = d.questions[i];
    if (!q.text.trim()) { state.errorMsg = `Question ${i + 1} needs question text.`; render(); return; }
    if (q.type === "identification" && !(q.answerText || "").trim()) { state.errorMsg = `Question ${i + 1} needs a correct answer.`; render(); return; }
    if (["multiple_choice", "matching"].includes(q.type) && q.options.some(o => !o.trim())) { state.errorMsg = `Question ${i + 1} needs all choices filled in.`; render(); return; }
    if (q.type !== "identification" && (!Number.isInteger(q.correct) || q.correct < 0 || q.correct >= q.options.length)) { state.errorMsg = `Question ${i + 1} needs a correct option.`; render(); return; }
  }
  const payload = {
    title: d.title.trim(), activityType: d.activityType || "exam", duration: d.duration,
    expectedTeacherUsername: state.currentUser?.username,
    targetClasses,
    subject: d.subject.trim(),
    questions: d.questions.map(q => ({ part: q.part, type: q.type, text: q.text.trim(), options: q.options.map(o => o.trim()), correct: q.correct, answerText: q.answerText.trim(), alternatives: q.alternatives }))
  };
  state.savingActivity = true;
  document.querySelectorAll("[data-publish-activity]").forEach(button => { button.disabled = true; button.setAttribute("aria-busy", "true"); });
  try {
    if (state.editingExamId) {
      await apiRequest("PUT", `/api/exams/${state.editingExamId}`, payload, adminHeaders());
    } else {
      await apiRequest("POST", "/api/exams", payload, adminHeaders());
    }
    state.editingExamId = null;
    state.publishAuthRequired = false;
    await goAdminHome();
  } catch (err) {
    state.errorMsg = err.message;
    if (err.status === 401 || ["staff_session_expired", "teacher_required", "teacher_account_changed"].includes(err.code)) state.publishAuthRequired = true;
    render();
    if (state.publishAuthRequired) document.getElementById("publishTeacherUsername")?.focus();
  }
  finally {
    state.savingActivity = false;
    document.querySelectorAll("[data-publish-activity]").forEach(button => { button.disabled = false; button.removeAttribute("aria-busy"); });
  }
}

function compareStudentNames(first, second) {
  const splitName = value => {
    const parts = String(value || "").split(",");
    return {
      lastName: (parts[0] || "").trim(),
      givenName: parts.slice(1).join(",").trim()
    };
  };
  const firstName = splitName(first);
  const secondName = splitName(second);
  return firstName.lastName.localeCompare(secondName.lastName, undefined, { sensitivity: "base" }) ||
    firstName.givenName.localeCompare(secondName.givenName, undefined, { sensitivity: "base" });
}

      <div class="field" style="max-width:180px;">
        <label>Filter by year level</label>
        <select onchange="setResultsYearFilter(this.value)"><option value="">All years</option>${YEAR_LEVELS.map(year => `<option value="${esc(year)}" ${state.resultsYearFilter === year ? "selected" : ""}>${esc(year)}</option>`).join("")}</select>
      </div>
      <div class="field" style="max-width:180px;">
        <label>Filter by section</label>
        <select onchange="setResultsSectionFilter(this.value)">
          <option value="">All sections</option>
          ${SECTIONS.map(section => `<option value="${esc(section)}" ${state.resultsSectionFilter === section ? "selected" : ""}>Section ${esc(section)}</option>`).join("")}
        </select>
      </div>
    </div>` : ``}
    ${allResults.length > 0 ? `<section class="results-download-panel" aria-labelledby="resultsDownloadHeading">
      <div><h3 id="resultsDownloadHeading">Download report</h3><p>Choose a format and whether to use your selected class filters or include all results.</p></div>
      <div class="field-row results-export-options">
        <div class="field"><label for="resultsExportFormat">File format</label><select id="resultsExportFormat"><option value="pdf">PDF</option><option value="excel">Excel</option></select></div>
        <div class="field"><label for="resultsExportScope">Report scope</label><select id="resultsExportScope"><option value="selected">Selected filters · ${esc(resultsExportScope(false))}</option><option value="all">All departments, years, and sections</option></select></div>
        <button type="button" class="btn" onclick="downloadSelectedResults()">Download report</button>
      </div>
      <p id="resultsExportStatus" class="search-count" role="status" aria-live="polite"></p>
    </section>` : ``}
    <div class="stat-row">
      <div class="stat"><div class="label">Attempts</div><div class="value">${results.length}</div></div>
      <div class="stat"><div class="label">Average score (points)</div><div class="value">${avg}${results.length ? `<span class="score-denominator"> / ${totalPoints}</span>` : ""}</div></div>
      <div class="stat"><div class="label">Top score (points)</div><div class="value">${top}${results.length ? `<span class="score-denominator"> / ${totalPoints}</span>` : ""}</div></div>
    </div>
    ${results.length === 0 ? `<div class="empty">${allResults.length ? "No submissions match these filters. Choose another department, year level, or section." : "No submissions yet. Student scores will appear here after they submit."}</div>` : `
    <p class="table-scroll-hint">Scroll sideways to see scores, submission details, and actions.</p><div class="sheet table-scroll" style="padding:0;overflow-x:auto;">
      <table class="results-table"><thead><tr><th>Student</th><th>ID Number</th><th>Department</th><th>Year level</th><th>Section</th><th>Score (points)</th><th>Percentage</th><th>Grade status</th><th>Time taken</th><th>Submitted</th><th>Browser activity</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`}
  </div></div>`;
}
function renderActivityMonitor() {
  const attempts = (state.activityAttempts || []).filter(item =>
    (!state.resultsDeptFilter || item.department === state.resultsDeptFilter) &&
    (!state.resultsYearFilter || item.yearLevel === state.resultsYearFilter) &&
    (!state.resultsSectionFilter || item.section === state.resultsSectionFilter));
  const statusLabels = {on_exam: "On exam page", unfocused: "Window not focused", hidden: "Exam page hidden", not_reporting: "No recent update", submitted: "Submitted"};
  const rows = attempts.map(item => `<tr><td>${esc(item.name)}<small class="table-sub">${esc(item.rollNo)}</small></td><td>${esc(item.section ? `${item.department}-${item.section}` : item.department)}<small class="table-sub">${esc(item.yearLevel)}</small></td><td>${item.activitySummary.focusLossCount}</td><td>${item.activitySummary.hiddenCount}</td><td>${item.activitySummary.warningCount}</td><td>${esc(statusLabels[item.status] || "Unknown")}</td><td>${esc(new Date(item.receivedAt).toLocaleTimeString())}</td><td><button type="button" class="btn secondary" onclick="openActivityLog('${item.id}')">Activity log</button></td></tr>`).join("");
  const detail = state.activityDetail;
  return `<details id="activityMonitorPanel" class="teacher-panel class-progress" open><summary class="panel-heading"><h3>Live exam monitoring</h3><span class="count-label">${attempts.length} attempts</span></summary><div class="table-tools"><p class="help-text">Updates every 3 seconds while this page is visible. Focus losses and page hides are separate browser observations; Alt+Tab and minimize cannot be identified exactly.</p>${state.activityMonitorError ? `<p class="conn-banner" role="alert">${esc(state.activityMonitorError)}</p>` : ""}</div>${rows ? `<div class="teacher-table-wrap"><table class="teacher-record-table activity-monitor-table"><thead><tr><th>Student / ID</th><th>Class</th><th>Focus losses</th><th>Page hides</th><th>Warnings</th><th>Last reported state</th><th>Server received</th><th>Details</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="help-text" style="padding:0 22px 16px;">No attempt has reported yet. Students appear here after they start an assessment using the updated student page.</p>'}</details>
    ${detail ? `<details id="activityDetailPanel" class="teacher-panel class-progress" open><summary class="panel-heading"><h3>Activity log: ${esc(detail.name)}</h3><span class="count-label">Received ${esc(new Date(detail.receivedAt).toLocaleTimeString())}</span></summary>${renderAssessmentActivity(detail)}</details>` : ""}`;
}
function renderAssessmentActivity(result) {
  const summary = result.activitySummary;
  const log = result.activityLog;
  if (!summary || !log) return '<section class="sheet"><h3>Browser activity</h3><p>Activity was not recorded for this attempt. This does not mean the student stayed on the exam page.</p></section>';
  const labels = {
    attempt_started: 'Assessment started', attempt_resumed: 'Saved attempt resumed',
    focus_lost: 'Exam window lost focus', focus_returned: 'Exam window regained focus',
    page_hidden: 'Exam page became hidden', page_visible: 'Exam page became visible',
    warning_started: '10-second focus warning started', warning_acknowledged: 'Student selected Continue assessment',
    submit_manual: 'Student requested submission', submit_time_limit: 'Automatic submission: exam time expired',
    submit_tab_switch: 'Automatic submission: focus warning expired',
  };
  const rows = log.events.map(event => `<tr><td>${esc(new Date(event.at).toLocaleString())}</td><td>${esc(labels[event.type] || event.type)}</td><td>${event.hidden ? 'Hidden' : 'Visible'}</td><td>${event.focused ? 'Focused' : 'Not focused'}</td></tr>`).join('');
  return `<section class="sheet" aria-labelledby="assessmentActivityHeading"><h3 id="assessmentActivityHeading">Browser activity</h3>
    <p>These browser observations can happen during Alt+Tab, minimizing, tab switching, or browser controls. They cannot identify which action occurred or prove cheating. One departure can produce both a focus loss and a page hide; do not add these counts together.</p>
    <div class="stat-row"><div class="stat"><div class="label">Window focus losses</div><div class="value">${summary.focusLossCount}</div></div><div class="stat"><div class="label">Exam page hides</div><div class="value">${summary.hiddenCount}</div></div><div class="stat"><div class="label">Focus warnings</div><div class="value">${summary.warningCount}</div></div></div>
    ${!summary.complete ? '<p role="status">Partial log: this saved attempt started before activity recording was enabled.</p>' : ''}
    ${summary.truncated ? '<p role="status">Log limit reached. Counts and timeline include only the first 2,000 recorded events.</p>' : ''}
    <p class="help-text">Event times are reported by the student device. Activity is sent to the server during the attempt and retained with the submission. Gaps while the browser is closed are not monitored.</p>
    ${rows ? `<div class="table-scroll" style="overflow:auto;max-height:360px;"><table><thead><tr><th>Student device time</th><th>Observation</th><th>Page visibility</th><th>Window focus</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p>No browser events were recorded.</p>'}
  </section>`;
}
function renderAdminResultReview() {
  const r = state.adminReviewResult;
  if (!r) return `<div class="wrap"><div class="wrap-inner"><div class="empty">Result not found.</div></div></div>`;
  const submitNote = r.submitReason === "tab_switch"
    ? " · auto-submitted after the focus warning expired"
    : r.submitReason === "time_limit" ? " · auto-submitted at time limit" : "";
  const review = (r.review || []).map((q, i) => {
    const isIdentification = q.type === "identification";
    const options = Array.isArray(q.options) ? q.options : [];
    const myAnswer = q.chosen !== null && q.chosen !== undefined && q.chosen !== ""
      ? (isIdentification ? q.chosen : (options[q.chosen] || `Option ${Number(q.chosen) + 1}`))
      : "Not answered";
    const correctAnswer = isIdentification ? (q.answer || "Not available") : (options[q.correct] || `Option ${Number(q.correct) + 1}`);
    return `<div class="review-item">
      <div class="rhead"><div class="rqtext">${i + 1}. ${esc(q.text)}</div><span class="tag ${q.isCorrect ? "correct" : "wrong"}">${q.isCorrect ? "Correct" : "Incorrect"} · ${q.pointsAwarded ?? (q.isCorrect ? assessmentPoints(r, q) : 0)} / ${q.pointsPossible ?? assessmentPoints(r, q)} points</span></div>
      <div class="aline">Student answer: <b>${esc(myAnswer)}</b></div>
      ${!q.isCorrect ? `<div class="aline">Correct answer: <b>${esc(correctAnswer)}</b></div>` : ""}
    </div>`;
  }).join("");
  return `<div class="wrap"><div class="wrap-inner">
    <button class="back-link" onclick="setView('adminResults')">&larr; Back to results</button>
    <div class="btn-row" style="justify-content:flex-end;margin-bottom:16px;">
      <button class="btn secondary" onclick="reopenAdminResult('${r.id}')">${r.activityType === "quiz" ? "Return quiz" : "Return exam"}</button>
    </div>
    <div class="sheet-header"><div><span class="eyebrow">${r.activityType === "quiz" ? "Quiz" : "Exam"} record</span><h2>${esc(r.name)}</h2><div class="meta">ID ${esc(r.rollNo)}${r.department ? ` · ${esc(r.department)}` : ""} · ${esc(r.examTitle)}</div></div></div>
    <div class="score-hero">
      <div class="big">${r.score}<span style="font-size:26px;color:var(--ink-faint);"> / ${r.total}</span></div>
      <div class="pct">${resultPercent(r).toFixed(1)}% · ${resultGradeLabel(r)} · ${assessmentScoringLabel(r)} · Time taken ${fmtTime(r.timeTakenSec)}${submitNote}</div>
    </div>
    ${renderAssessmentActivity(r)}
    <h3 style="font-size:16px;margin-bottom:14px;">Answer review</h3>
    ${review}
  </div></div>`;
}
function setResultsDeptFilter(val) { state.resultsDeptFilter = val; render(); }
function setResultsYearFilter(val) { state.resultsYearFilter = val; render(); }
function setResultsSectionFilter(val) { state.resultsSectionFilter = val; render(); }
function filteredExamResults() {
  return state.currentExamResults.filter(result =>
    (!state.resultsDeptFilter || result.department === state.resultsDeptFilter) &&
    (!state.resultsYearFilter || result.yearLevel === state.resultsYearFilter) &&
    (!state.resultsSectionFilter || result.section === state.resultsSectionFilter));
}
function examResultClasses() {
  const exam = state.exams.find(item => item.id === state.adminResultsExamId);
  const classes = new Map();
  for (const target of [...(exam?.targetClasses || []), ...state.currentExamResults]) {
    const key = JSON.stringify([target.department, target.yearLevel, target.section]);
    if (!classes.has(key)) classes.set(key, {department: target.department, yearLevel: target.yearLevel, section: target.section});
  }
  return [...classes.values()];
}
function renderClassProgress() {
  const classes = examResultClasses();
  if (!classes.length) return "";
  const rows = classes.map(target => {
    const matches = item => item.department === target.department && (item.yearLevel || item.year_level || "") === target.yearLevel && item.section === target.section;
    const submitted = new Set(state.currentExamResults.filter(matches).map(item => item.rollNo));
    const roster = new Set(state.students.filter(matches).map(item => item.roll_no));
    const pending = [...roster].filter(id => !submitted.has(id)).length;
    const total = new Set([...roster, ...submitted]).size;
    return `<tr><td>${esc(target.department)} · ${esc(target.yearLevel || "Unknown year")} · Section ${esc(target.section)}</td><td>${total}</td><td>${submitted.size}</td><td>${pending}</td></tr>`;
  }).join("");
  return `<details id="classProgressPanel" class="teacher-panel class-progress" open><summary class="panel-heading"><h3>Class submissions</h3><span class="count-label">${classes.length} ${classes.length === 1 ? "class" : "classes"}</span></summary><div class="teacher-table-wrap"><table class="teacher-record-table"><thead><tr><th>Class</th><th>Students</th><th>Submitted</th><th>Awaiting submission</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}
function groupResultsBySection(results) {
  const grouped = new Map();
  results.forEach(result => {
    const department = result.department || "Unassigned department";
    const yearLevel = result.yearLevel || "All years";
    const section = result.section || "Unassigned";
    const key = JSON.stringify([department, yearLevel, section]);
    if (!grouped.has(key)) grouped.set(key, { department, yearLevel, section, results: [] });
    grouped.get(key).results.push(result);
  });
  const sectionOrder = new Map(SECTIONS.map((section, index) => [section, index]));
  return [...grouped.values()]
    .sort((first, second) =>
      first.department.localeCompare(second.department) ||
      first.yearLevel.localeCompare(second.yearLevel) ||
      (sectionOrder.get(first.section) ?? SECTIONS.length) - (sectionOrder.get(second.section) ?? SECTIONS.length) ||
      first.section.localeCompare(second.section)
    )
    .map(group => ({
      ...group,
      label: `${group.department} · ${group.yearLevel} · ${group.section === "Unassigned" ? "Unassigned section" : `Section ${group.section}`}`,
      results: group.results.sort((first, second) =>
        compareStudentNames(first.name, second.name) || String(first.rollNo).localeCompare(String(second.rollNo))
      )
    }));
}
function resultsExportScope(includeAll) {
  if (includeAll) return "All departments · All years · All sections";
  return `${state.resultsDeptFilter || "All departments"} · ${state.resultsYearFilter || "All years"} · ${state.resultsSectionFilter ? `Section ${state.resultsSectionFilter}` : "All sections"}`;
}
function downloadSelectedResults() {
  const format = document.getElementById("resultsExportFormat")?.value;
  const includeAll = document.getElementById("resultsExportScope")?.value === "all";
  const results = includeAll ? state.currentExamResults : filteredExamResults();
  const status = document.getElementById("resultsExportStatus");
  if (!results.length) {
    if (status) status.textContent = "No submitted results match the selected filters.";
    return;
  }
  try {
    const downloaded = format === "excel" ? downloadResultsExcel(includeAll) : downloadResultsPdf(includeAll);
    if (status) status.textContent = downloaded
      ? `Report downloaded: ${resultsExportScope(includeAll)} · ${format === "excel" ? "Excel" : "PDF"}.`
      : `Could not create the ${format === "excel" ? "Excel" : "PDF"} report. Check that the report library is available and try again.`;
  } catch (err) {
    if (status) status.textContent = `Report download failed: ${err instanceof Error ? err.message : "Unexpected error."}`;
  }
}
function resultsExportFilename(title, scope, extension) {
  const safePart = value => value.replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, "").slice(0, 40);
  return `${safePart(title) || "exam"}_${safePart(scope) || "all_results"}_results.${extension}`;
}
function downloadResultsExcel(includeAll = false) {
  const results = includeAll ? state.currentExamResults : filteredExamResults();
  if (!results.length || !window.XLSX?.utils || !window.XLSX.writeFile) return false;
  const title = results[0].examTitle || "exam";
  const workbook = XLSX.utils.book_new();
  const columnWidths = [{ wch: 6 }, { wch: 24 }, { wch: 20 }, { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 18 }, { wch: 8 }, { wch: 20 }, { wch: 14 }, { wch: 18 }, { wch: 14 }];
  const usedSheetNames = new Set();
  groupResultsBySection(results).forEach(group => {
    const rows = group.results.map((result, index) => ({
      "Rank": index + 1,
      "Student Name": result.name,
      "ID Number": result.rollNo,
      "Department": result.department || "",
      "Year Level": result.yearLevel || "",
      "Section": result.section ? `${result.department}-${result.section}` : "",
      "Score (points)": result.score,
      "Total points": result.total,
      "Percentage": `${resultPercent(result).toFixed(1)}%`,
      "Grade status": resultGradeLabel(result),
      "Scoring": assessmentScoringLabel(result),
      "Time Taken (mm:ss)": fmtTime(result.timeTakenSec),
      "Submitted At": new Date(result.submittedAt).toLocaleString(),
      "Auto-submitted": result.autoSubmitted ? "Yes" : "No"
    }));
    const worksheet = XLSX.utils.json_to_sheet(rows);
    worksheet["!cols"] = columnWidths;
    const range = { s: { r: 0, c: 0 }, e: { r: rows.length, c: columnWidths.length - 1 } };
    const border = {
      top: { style: "thin", color: { rgb: "D9E2EC" } },
      bottom: { style: "thin", color: { rgb: "D9E2EC" } },
      left: { style: "thin", color: { rgb: "D9E2EC" } },
      right: { style: "thin", color: { rgb: "D9E2EC" } }
    };
    for (let row = range.s.r; row <= range.e.r; row++) {
      for (let column = range.s.c; column <= range.e.c; column++) {
        const address = XLSX.utils.encode_cell({ r: row, c: column });
        const cell = worksheet[address];
        if (!cell) continue;
        cell.s = row === 0
          ? {
            fill: { fgColor: { rgb: "182B45" } },
            font: { bold: true, color: { rgb: "FFFFFF" } },
            alignment: { vertical: "center", horizontal: "center" },
            border: { ...border, bottom: { style: "medium", color: { rgb: "1F857E" } } }
          }
          : {
            fill: { fgColor: { rgb: row % 2 === 0 ? "EAF5F4" : "FFFFFF" } },
            alignment: { vertical: "center" },
            border
          };
      }
    }
    worksheet["!autofilter"] = { ref: XLSX.utils.encode_range(range) };
    worksheet["!rows"] = [{ hpt: 28 }];
    const baseSheetName = `${group.department}-${group.yearLevel}-${group.section}`
      .replace(/[\\/*?:\[\]]/g, "_")
      .replace(/[\u0000-\u001f]/g, "_")
      .replace(/^'+|'+$/g, "")
      .slice(0, 31) || "Results";
    let sheetName = baseSheetName;
    let suffix = 2;
    while (usedSheetNames.has(sheetName.toLowerCase())) {
      const suffixText = `_${suffix++}`;
      sheetName = `${baseSheetName.slice(0, 31 - suffixText.length)}${suffixText}`;
    }
    usedSheetNames.add(sheetName.toLowerCase());
    XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
  });
  XLSX.writeFile(workbook, resultsExportFilename(title, resultsExportScope(includeAll), "xlsx"));
  return true;
}
function downloadResultsPdf(includeAll = false) {
  const selectedResults = includeAll ? state.currentExamResults : filteredExamResults();
  if (!selectedResults.length || !window.jspdf || !window.jspdf.jsPDF) return false;
  const groups = groupResultsBySection(selectedResults);
  const sorted = groups.flatMap(group => group.results);
  const title = sorted[0].examTitle || "Exam Results";
  const scope = resultsExportScope(includeAll);
  const average = sorted.reduce((sum, result) => sum + Number(result.score || 0), 0) / sorted.length;
  const topScore = Math.max(...sorted.map(result => Number(result.score || 0)));
  const totalPoints = sorted[0].total || 0;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const pageWidth = doc.internal.pageSize.getWidth();
  const navy = [24, 43, 69];
  const teal = [31, 133, 126];
  doc.setFillColor(...navy);
  doc.rect(0, 0, pageWidth, 30, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.text("EXAM RESULTS", 16, 11);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(12);
  doc.text(title, 16, 23, { maxWidth: pageWidth - 32 });
  doc.setTextColor(92, 109, 125);
  doc.setFontSize(12);
  doc.text(`Generated ${new Date().toLocaleString()}  |  ${scope}`, pageWidth - 16, 23, { align: "right", maxWidth: pageWidth - 100 });
  const statY = 41;
  const statWidth = (pageWidth - 32 - 8) / 3;
  [["ATTEMPTS", String(sorted.length)], ["AVERAGE SCORE", `${average.toFixed(1)} / ${totalPoints}`], ["TOP SCORE", `${topScore} / ${totalPoints}`]].forEach((stat, index) => {
    const x = 16 + index * (statWidth + 4);
    doc.setFillColor(244, 247, 249);
    doc.roundedRect(x, statY, statWidth, 15, 2, 2, "F");
    doc.setTextColor(...teal);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text(stat[0], x + 5, statY + 6);
    doc.setTextColor(...navy);
    doc.setFontSize(12);
    doc.text(stat[1], x + 5, statY + 12);
  });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(8);
  doc.text(assessmentScoringLabel(sorted[0]), 16, 62, { maxWidth: pageWidth - 32 });
  let cursorY = 70;
  groups.forEach(group => {
    if (cursorY > 160) {
      doc.addPage();
      cursorY = 18;
    }
    doc.setTextColor(...navy);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.text(group.label.toUpperCase(), 16, cursorY);
    doc.autoTable({
      startY: cursorY + 3,
      pageBreak: "avoid",
      margin: { left: 16, right: 16 },
      head: [["#", "Student", "ID Number", "Department", "Section", "Score (points)", "Percentage", "Grade status", "Time taken", "Submitted"]],
      body: group.results.map((result, index) => [
        index + 1, result.name, result.rollNo, result.department || "-", result.section ? `${result.department}-${result.section}` : "-", `${result.score} / ${result.total}`,
        `${resultPercent(result).toFixed(1)}%`, resultGradeLabel(result), fmtTime(result.timeTakenSec), new Date(result.submittedAt).toLocaleString()
      ]),
      theme: "grid",
      styles: { font: "helvetica", fontSize: 7.5, cellPadding: 2.2, textColor: [45, 58, 70], lineColor: [220, 226, 231], lineWidth: 0.15, valign: "middle" },
      headStyles: { fillColor: navy, textColor: [255, 255, 255], fontStyle: "bold", fontSize: 7.5, cellPadding: 2.5, halign: "left" },
      alternateRowStyles: { fillColor: [247, 250, 251] },
      columnStyles: { 0: { cellWidth: 10, halign: "center" }, 5: { halign: "center" }, 6: { halign: "center" }, 7: { halign: "center" }, 8: { halign: "center" } },
      didDrawPage: data => {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(130, 141, 151);
        doc.text("AbieksExamSys", 16, doc.internal.pageSize.getHeight() - 9);
        doc.text(`Page ${data.pageNumber}`, pageWidth - 16, doc.internal.pageSize.getHeight() - 9, { align: "right" });
      }
    });
    cursorY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : cursorY + 12) + 8;
  });
  doc.save(resultsExportFilename(title, scope, "pdf"));
  return true;
}

/* ============================= ROUTER / RENDER ============================= */
function render() {
  const previous = captureInterfaceState();
  let body = "";
  switch (state.view) {
    case "learningHome": body = renderLearningWorkspace(); break;
    case "adminLogin": body = renderAdminLogin(); break;
    case "adminHome": body = renderAdminHome(); break;
    case "createExam": body = renderCreateExam(); break;
    case "adminResults": body = renderAdminResults(); break;
    case "adminResultReview": body = renderAdminResultReview(); break;
    default: body = renderAdminLogin();
  }
  document.body.className = state.currentUser ? "app-page admin-page" : "auth-page";
  document.getElementById("app").innerHTML = (state.currentUser ? renderWorkspace(body, state.currentUser.role) : renderAuthLayout(body, true)) + renderModalHtml();
  enhanceInterface(previous);
  syncResultsLiveUpdates();
  syncDashboardLiveUpdates();
}
if (window.ARALHUB_CURRENT_USER?.role === "teacher") {
  state.currentUser = window.ARALHUB_CURRENT_USER;
  goAdminHome();
} else render();
</script>
