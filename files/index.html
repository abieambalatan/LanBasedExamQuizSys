<script>
/* ============================= STATE ============================= */
let state = {
  view: new URLSearchParams(window.location.search).has("signup") ? "studentSignup" : "landing",
  currentUser: null,         // {name, rollNo, department, section, yearLevel}
  exams: [],
  learningMaterials: [],
  myResults: [],
  runtime: null,
  savedAttempt: null,
  draftSaveError: "",
  draftRecoveryMessage: "",
  lastResult: null,
  studentReview: null,
  studentReviewError: "",
  studentReviewLoading: false,
  errorMsg: "",
  successMsg: "",
  connError: "",
  submitting: false,
};

const SCHOOL_OPTIONS = window.ARALHUB_SCHOOL_OPTIONS || {};
const PASSING_PERCENT = 50;
const DEPARTMENTS = SCHOOL_OPTIONS.departments?.length ? SCHOOL_OPTIONS.departments : ["BSIT", "BSCRIM", "BEED", "BSHM", "BSN"];
const YEAR_LEVELS = ["1st Year", "2nd Year", "3rd Year", "4th Year"];
const SECTIONS_BY_DEPARTMENT = SCHOOL_OPTIONS.sections_by_department || {};
const SECTIONS_BY_YEAR = SCHOOL_OPTIONS.sections_by_department_and_year || {};
const SECTIONS = SCHOOL_OPTIONS.section?.length ? SCHOOL_OPTIONS.section : ["A", "B", "C", "D", "E", "F"];
function sectionsForDepartment(department, year) {
  if (year && SECTIONS_BY_YEAR[department]) return SECTIONS_BY_YEAR[department][year] || [];
  return SECTIONS_BY_DEPARTMENT[department] || (DEPARTMENTS.includes(department) ? SECTIONS : []);
}
function resultPercent(result) {
  if (result.percent !== undefined && result.percent !== null && Number.isFinite(Number(result.percent))) return Number(result.percent);
  return result.total ? Number(result.score || 0) / Number(result.total) * 100 : 0;
}
function resultGradeLabel(result) {
  return resultPercent(result) < PASSING_PERCENT ? "Failed" : "Passed";
}

function setView(v, extra) { state.errorMsg = ""; state.successMsg = ""; state.view = v; if (extra) Object.assign(state, extra); render(); }

/* ============================= TOPBAR ============================= */
async function logout() {
  if (state.runtime && state.runtime.timerId) clearInterval(state.runtime.timerId);
  try { await apiRequest("POST", "/api/logout"); } catch (err) {}
  state.runtime = null; state.currentUser = null;
  state.learningMaterials = []; state.learningSubmissions = null;
  navigateToPortal("/login");
}

/* ============================= LANDING ============================= */
function renderLanding() {
  return `<div class="landing-page-shell">
    <nav class="landing-nav" aria-label="Main navigation"><a class="landing-logo" href="index.html"><span class="brand-logo-frame"><img src="images/wallpapercdk.png" alt="AbieksExamSys logo"></span><strong>AbieksExamSys</strong></a></nav>
    <main id="mainContent" class="landing-main"><div class="landing-copy"><span class="landing-eyebrow"><span></span> A BETTER SPACE TO LEARN</span><h1>Your classroom.<br><em>One clear workspace.</em></h1><p class="lead">Find your assigned exams and quizzes, complete your assessments, and keep track of your scores.</p><div class="landing-cta"><button class="btn" onclick="navigateToPortal('/login')">Sign in ${uiIcon("arrow")}</button><button class="btn secondary" onclick="setView('studentSignup')">Create an account</button></div><div class="landing-proof"><span class="proof-icon">${uiIcon("shield")}</span><div><strong>Built around your classroom.</strong><span>A focused experience, from the first question to your final result.</span></div></div></div>
    <div class="learning-visual" aria-label="AbieksExamSys assessment features"><div class="visual-orbit orbit-one"></div><div class="visual-orbit orbit-two"></div><div class="visual-note">${uiIcon("spark")} A little focus goes a long way.</div><div class="visual-card"><div class="visual-card-top"><span class="visual-book">${uiIcon("book")}</span><span class="badge open">YOUR LEARNING SPACE</span></div><h2>Ready when<br>you are.</h2><p>One workspace. Every possibility.</p><div class="visual-feature">${uiIcon("check")} Exams & quizzes <span>01</span></div><div class="visual-feature">${uiIcon("check")} Four ways to show what you know <span>02</span></div><div class="visual-feature">${uiIcon("check")} Submissions & progress <span>03</span></div></div><div class="visual-float">${uiIcon("check")}<div><strong>Small steps. Real progress.</strong><span>Your next achievement is ahead.</span></div></div></div></main>
    <footer class="landing-footer"><span>AbieksExamSys &middot; Colegio de Kidapawan</span><div><span>Learn with focus.</span><span>Grow with confidence.</span></div></footer></div>`;
}

/* ============================= STUDENT SIGN UP ============================= */
function renderStudentSignup() {
  const options = DEPARTMENTS.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("");
  return `
  <div class="wrap auth-wrap"><div class="wrap-inner auth-inner">

    <form class="sheet auth-card" onsubmit="event.preventDefault(); submitAuthForm(this, doStudentSignup)">
      <div class="auth-brand"><span class="brand-logo-frame"><img src="images/wallpapercdk.png" alt="AbieksExamSys logo"></span><span>AbieksExamSys</span></div>
      <div class="auth-heading"><span class="eyebrow">Student registration</span><h2>Create your account</h2><div class="meta">Enter your name, program, year level, and section to find your class assessments.</div></div>
      ${state.errorMsg ? `<div class="banner">${esc(state.errorMsg)}</div>` : ""}
      <div class="field"><label for="up_first_name">First name</label><input id="up_first_name" type="text" placeholder="e.g. Juan" autocomplete="given-name" maxlength="255" /></div>
      <div class="field"><label for="up_last_name">Last name</label><input id="up_last_name" type="text" placeholder="e.g. Dela Cruz" autocomplete="family-name" maxlength="255" /></div>
      <div class="field"><label for="up_middle_initial">Middle initial <span class="help-text">(optional)</span></label><input id="up_middle_initial" type="text" placeholder="e.g. P" maxlength="2" /><small class="help-text">Enter one letter, or leave blank if you have no middle initial.</small></div>
      <div class="field"><label>ID Number</label><input id="up_roll" type="text" placeholder="e.g. 21CS045" /></div>
      <div class="field"><label>Program / Department</label>
        <select id="up_dept" onchange="updateSignupSections('')">
          <option value="">Select program / department</option>
          ${options}
        </select>
      </div>
      <div class="field"><label>Year level</label>
        <select id="up_year" onchange="updateSignupSections('')">
          <option value="">Select year level</option>
          ${YEAR_LEVELS.map(year => `<option value="${esc(year)}">${esc(year)}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label id="signupSectionLabel">Section</label>
        <select id="up_section" disabled>
          <option value="">Select section</option>
        </select>
      </div>
      <div class="field"><label>Password</label><input id="up_password" type="password" placeholder="At least 4 characters" autocomplete="new-password" /></div>
      <div class="field"><label>Confirm password</label><input id="up_password2" type="password" placeholder="Re-enter your password" autocomplete="new-password" /></div>
      <button type="submit" class="btn block auth-submit">Create student account</button>
    </form>
    <button class="back-link" onclick="navigateToPortal('/login')">Already have an account? Sign in</button>
    <button class="back-link" onclick="setView('landing')">&larr; Back</button>
  </div></div>`;
}
function updateSignupSections(savedSection) {
  const department = document.getElementById("up_dept").value;
  const year = document.getElementById("up_year").value;
  const sectionSelect = document.getElementById("up_section");
  const selected = typeof savedSection === "string" ? savedSection : sectionSelect.value;
  const sections = department && year ? sectionsForDepartment(department, year) : [];
  sectionSelect.innerHTML = `<option value="">${sections.length ? "Select section" : !department ? "Select department first" : "Select year level first"}</option>${sections.map(section => `<option value="${esc(section)}">${esc(department)} ${YEAR_LEVELS.indexOf(year) + 1}-${esc(section)}</option>`).join("")}`;
  sectionSelect.value = sections.includes(selected) ? selected : "";
  sectionSelect.disabled = sections.length === 0;
  document.getElementById("signupSectionLabel").textContent = department && year ? `Section · ${department} · ${year}` : "Section";
}
async function doStudentSignup() {
  const firstName = document.getElementById("up_first_name").value.trim();
  const lastName = document.getElementById("up_last_name").value.trim();
  const middleInitial = document.getElementById("up_middle_initial").value.trim();
  const roll = document.getElementById("up_roll").value.trim();
  const department = document.getElementById("up_dept").value;
  const section = document.getElementById("up_section").value;
  const yearLevel = document.getElementById("up_year").value;
  const password = document.getElementById("up_password").value;
  const password2 = document.getElementById("up_password2").value;
  if (!firstName || !lastName || !roll) { state.errorMsg = "Please enter your first name, last name, and ID number."; render(); return; }
  if (middleInitial && !/^\p{L}\.?$/u.test(middleInitial)) {
    state.errorMsg = "Middle initial must be one letter, optionally followed by a period.";
    render(); return;
  }
  if (!DEPARTMENTS.includes(department)) { state.errorMsg = "Please select your department."; render(); return; }
  if (!YEAR_LEVELS.includes(yearLevel)) { state.errorMsg = "Please select your year level."; render(); return; }
  if (!sectionsForDepartment(department, yearLevel).includes(section)) { state.errorMsg = "Please select a valid section for your department and year level."; render(); return; }
  if (password.length < 4) { state.errorMsg = "Password must be at least 4 characters."; render(); return; }
  if (password !== password2) { state.errorMsg = "Passwords do not match."; render(); return; }
  try {
    await apiRequest("POST", "/api/students/signup", { firstName, lastName, middleInitial, rollNo: roll, department, section, yearLevel, password });
    navigateToPortal("/login?registered=1");
  } catch (err) {
    state.errorMsg = err.message || "Could not sign up. Please try again.";
    render();
  }
}

/* ============================= STUDENT SIGN IN ============================= */
function renderStudentLogin() { return renderPortalLogin("doStudentLogin"); }
async function doStudentLogin() { await doPortalLogin(); }

/* ============================= STUDENT HOME ============================= */
async function goStudentHome() {
  state.connError = "";
  state.studentLiveBlocked = false;
  state.draftRecoveryMessage = "";
  state.draftSaveError = "";
  state.savedAttempt = readSavedAttempt();
  try {
    state.exams = await apiRequest("GET", "/api/exams?studentView=1");
    state.myResults = await apiRequest("GET", `/api/results?rollNo=${encodeURIComponent(state.currentUser.rollNo)}`);
    if (state.savedAttempt && state.myResults.some(result => result.examId === state.savedAttempt.examId)) {
      clearSavedAttempt();
      state.savedAttempt = null;
      state.draftRecoveryMessage = "A saved attempt was already submitted, so its local copy was cleared.";
    } else if (state.savedAttempt && !state.exams.some(exam => exam.id === state.savedAttempt.examId)) {
      clearSavedAttempt();
      state.savedAttempt = null;
      state.draftRecoveryMessage = "A saved attempt is no longer available because this assessment is not assigned to your account.";
    }
  } catch (err) {
    if (handleStudentSessionFailure(err)) return;
    state.studentLiveBlocked = !!err.status && err.status < 500;
    state.connError = err.status ? (err.message || "The server could not load your workspace. Try again.") : "Could not reach the server. Reconnecting automatically; your saved answers are kept.";
  }
  setView("studentHome");
}
function renderStudentHome() {
  const rows = state.exams.map(ex => {
    const isQuiz = ex.activityType === "quiz";
    const attempts = state.myResults.filter(result => result.examId === ex.id).sort((a, b) => (b.percent || 0) - (a.percent || 0));
    const result = attempts[0];
    const hasSavedAttempt = state.savedAttempt?.examId === ex.id;
    return `<article class="exam-row" data-activity="${isQuiz ? "quiz" : "exam"}" data-search="${esc((ex.title + ' ' + (ex.subject || '')).toLowerCase())}"><div class="activity-card-top"><span class="activity-icon ${isQuiz ? "mint" : "violet"}">${uiIcon(isQuiz ? "spark" : "file")}</span><span class="badge ${result ? "done" : "open"}">${result ? "Submitted" : ex.returned ? "Returned by teacher" : isQuiz ? "Quiz" : "Exam"}</span></div><div class="info"><span class="activity-subject">${esc(ex.subject || "Class assessment")}</span><strong>${esc(ex.title)}</strong><span>${esc(ex.yearLevel || "All years")} &middot; ${ex.sectionScope === "ALL" ? "All sections" : `Section ${esc(ex.sectionScope || "")}`}</span></div><div class="activity-meta"><span>${uiIcon("file")} ${ex.questionCount} items</span><span>${uiIcon("clock")} ${ex.duration} min</span></div><div class="activity-card-footer">${result ? `<span class="score-label">${result.score}<small> / ${result.total} points</small><small> · ${resultPercent(result).toFixed(1)}%</small></span><span class="grade-status ${resultGradeLabel(result) === "Passed" ? "passed" : "failed"}">${resultGradeLabel(result)}</span>` : `<span class="ready-label"><i></i> ${hasSavedAttempt ? "Saved on this device" : ex.returned ? "Your answers are preserved" : "Ready to start"}</span><button class="btn" onclick="${hasSavedAttempt ? `resumeSavedAttempt('${ex.id}')` : `beginExam('${ex.id}')`}">${hasSavedAttempt ? "Resume saved attempt" : `${ex.returned ? "Continue" : "Start"} ${isQuiz ? "quiz" : "exam"}`} ${uiIcon("arrow")}</button>`}</div>${result ? '<div class="card-note">Ask your teacher to return this assessment if you submitted by accident.</div>' : ""}</article>`;
  }).join("");
  return `<div class="wrap student-assessments-wrap"><div class="wrap-inner wide"><section id="activities" class="student-assessments"><div class="section-title-row"><div><span class="eyebrow">YOUR LEARNING SPACE</span><h1>My assessments</h1><p>Welcome back, ${esc(state.currentUser.name)}. Your assigned exams and quizzes are here.</p></div><div class="learning-card-actions"><span class="count-label">${state.exams.length} activities</span><button class="btn secondary" onclick="openLearningWorkspace()">${uiIcon("file")} Lecture materials</button></div></div>
  ${state.draftRecoveryMessage ? `<div class="conn-banner" role="status">${esc(state.draftRecoveryMessage)}</div>` : ""}
  ${state.draftSaveError ? `<div class="conn-banner" role="alert">${esc(state.draftSaveError)}</div>` : ""}
  ${state.connError ? `<div class="conn-banner"><span>${esc(state.connError)}</span><button class="btn secondary" onclick="goStudentHome()">Try again</button></div>` : ""}
  ${state.exams.length ? `${renderActivityTools()}<div class="exam-list">${rows}</div><div id="activityNoMatches" class="empty" hidden>No activities match your search. Try another title or subject.</div>` : `<div class="empty student-assessments-empty">${uiIcon("book")}<h2>No assessments yet</h2><p>Your teacher's assigned exams and quizzes will appear here.</p></div>`}</section></div></div>`;
}

/* ============================= TAKE EXAM ============================= */
function savedAttemptStorageKey() {
  return `aralhub:student-attempt:${encodeURIComponent(state.currentUser.rollNo)}`;
}
function readSavedAttempt() {
  if (!state.currentUser?.rollNo) return null;
  try {
    const raw = localStorage.getItem(savedAttemptStorageKey());
    if (!raw) return null;
    const attempt = JSON.parse(raw);
    if (!attempt || attempt.version !== 1 || typeof attempt.examId !== "string" || !attempt.answers || typeof attempt.answers !== "object" || Array.isArray(attempt.answers) || !Number.isFinite(attempt.deadlineAt) || typeof attempt.submissionId !== "string") {
      localStorage.removeItem(savedAttemptStorageKey());
      state.draftRecoveryMessage = "An unreadable saved attempt was cleared. You can start the assessment again.";
      return null;
    }
    return attempt;
  } catch (err) {
    state.draftSaveError = "Saved answers could not be read from this browser. Your attempt may not be recoverable.";
    return null;
  }
}
function saveCurrentAttempt() {
  if (!state.runtime || !state.currentUser?.rollNo) return;
  const rt = state.runtime;
  const question = rt.exam.questions[rt.currentIdx];
  try {
    localStorage.setItem(savedAttemptStorageKey(), JSON.stringify({
      version: 1,
      examId: rt.exam.id,
      answers: rt.answers,
      currentQuestionId: question?.id || "",
      deadlineAt: rt.deadlineAt,
      submissionId: rt.submissionId,
      focusDeadlineAt: rt.focusDeadlineAt || null,
      pendingSubmission: rt.pendingSubmission || null,
      activityLog: rt.activityLog || null,
      activityFocused: rt.activityFocused,
      activityHidden: rt.activityHidden,
      returnId: rt.returnId || null
    }));
    state.draftSaveError = "";
  } catch (err) {
    state.draftSaveError = "Your answers could not be saved on this device. Keep this page open; a power loss may erase them.";
  }
}
function clearSavedAttempt() {
  if (!state.currentUser?.rollNo) return;
  try {
    localStorage.removeItem(savedAttemptStorageKey());
  } catch (err) {
    state.draftSaveError = "The saved attempt could not be cleared from this browser.";
  }
}
function createSubmissionId() {
  return Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16).padStart(8, "0")).join("");
}
async function beginExam(examId) {
  const activity = state.exams.find(exam => exam.id === examId);
  if (state.myResults.some(result => result.examId === examId)) {
    showModal({
      title: activity?.activityType === "quiz" ? "Awaiting teacher return" : "Already attempted",
      message: activity?.activityType === "quiz"
        ? "Your quiz has been submitted. You can take it again after your teacher returns it."
        : "You have already attempted this exam."
    });
    return;
  }
  let exam;
  try { exam = await apiRequest("GET", `/api/exams/${examId}/take`); }
  catch (err) { showModal({ title: "Could not start exam", message: err.message }); return; }
  const validIds = new Set(exam.questions.map(question => question.id));
  const answers = Object.fromEntries(Object.entries(exam.returnedAttempt?.answers || {}).filter(([id]) => validIds.has(id)));
  state.runtime = { exam, answers, secondsLeft: exam.duration * 60, deadlineAt: Date.now() + exam.duration * 60 * 1000, submissionId: createSubmissionId(), currentIdx: 0, timerId: null, tabSwitchSubmitted: false };
  state.runtime.returnId = exam.returnedAttempt?.returnId || null;
  state.runtime.activityLog = {version: 1, complete: true, truncated: false, events: []};
  state.draftSaveError = "";
  saveCurrentAttempt();
  if (exam.activityType === "quiz") history.pushState({ aralHubQuiz: exam.id }, "", window.location.href);
  setView("takeExam");
  recordAssessmentActivity("attempt_started");
  state.runtime.timerId = setInterval(tickTimer, 1000);
}
async function resumeSavedAttempt(examId) {
  const saved = state.savedAttempt;
  if (!saved || saved.examId !== examId) return;
  let exam;
  try { exam = await apiRequest("GET", `/api/exams/${examId}/take`); }
  catch (err) { showModal({ title: "Could not resume assessment", message: err.message || "Reconnect to the system and try again. Your saved answers remain on this device." }); return; }
  if (exam.returnedAttempt && saved.returnId !== exam.returnedAttempt.returnId) {
    clearSavedAttempt();
    state.savedAttempt = null;
    return beginExam(examId);
  }
  const remaining = Math.max(0, Math.ceil((saved.deadlineAt - Date.now()) / 1000));
  const currentIdx = Math.max(0, exam.questions.findIndex(question => question.id === saved.currentQuestionId));
  const questionIds = new Set(exam.questions.map(question => question.id));
  const answers = Object.fromEntries(Object.entries(saved.answers).filter(([questionId]) => questionIds.has(questionId)));
  state.runtime = { exam, answers, secondsLeft: remaining, deadlineAt: saved.deadlineAt, submissionId: saved.submissionId, currentIdx, timerId: null, tabSwitchSubmitted: false, focusDeadlineAt: saved.focusDeadlineAt || null, pendingSubmission: saved.pendingSubmission || null };
  state.runtime.returnId = saved.returnId || null;
  state.runtime.activityLog = saved.activityLog || {version: 1, complete: false, truncated: false, events: []};
  state.runtime.activityFocused = saved.activityFocused;
  state.runtime.activityHidden = saved.activityHidden;
  state.draftSaveError = "";
  if (exam.activityType === "quiz") history.pushState({ aralHubQuiz: exam.id }, "", window.location.href);
  setView("takeExam");
  recordAssessmentActivity("attempt_resumed");
  state.runtime.timerId = setInterval(tickTimer, 1000);
  tickTimer();
}
function tickTimer() {
  if (!state.runtime) return;
  if (Date.now() >= (state.runtime.nextActivitySyncAt || 0)) syncAssessmentActivity();
  if (state.runtime.pendingSubmission) {
    if (!state.submitting && Date.now() >= (state.runtime.retryAt || 0)) submitExam(true, state.runtime.pendingSubmission);
    return;
  }
  if (state.runtime.focusDeadlineAt) {
    if (Date.now() >= state.runtime.focusDeadlineAt) { submitExam(true, "tab_switch"); return; }
    const countdown = document.getElementById("focusCountdown");
    if (countdown) countdown.textContent = Math.max(0, Math.ceil((state.runtime.focusDeadlineAt - Date.now()) / 1000));
  }
  state.runtime.secondsLeft = Math.max(0, Math.ceil((state.runtime.deadlineAt - Date.now()) / 1000));
  if (state.runtime.secondsLeft <= 0) {
    state.runtime.secondsLeft = 0;
    clearInterval(state.runtime.timerId);
    submitExam(true);
    return;
  }
  updateTimerDom();
}
function updateTimerDom() {
  const el = document.getElementById("timerDisplay");
  if (!el || !state.runtime) return;
  el.textContent = fmtTime(state.runtime.secondsLeft);
  el.classList.toggle("low", state.runtime.secondsLeft <= 60);
}
const FOCUS_WARNING_SECONDS = 10;
const MAX_ACTIVITY_EVENTS = 2000;
let assessmentActivitySyncTimer = null;
function queueAssessmentActivitySync() {
  clearTimeout(assessmentActivitySyncTimer);
  assessmentActivitySyncTimer = setTimeout(() => syncAssessmentActivity(), 150);
  updateAssessmentActivityStatus();
}
function updateAssessmentActivityStatus() {
  const element = document.getElementById("assessmentActivityStatus");
  const rt = state.runtime;
  if (!element || !rt?.activityLog) return;
  const losses = rt.activityLog.events.filter(event => event.type === "focus_lost").length;
  const hides = rt.activityLog.events.filter(event => event.type === "page_hidden").length;
  const status = rt.activitySyncError ? "Not synced; retrying" : rt.activitySyncedCount === rt.activityLog.events.length ? "Saved to server" : "Sending to server";
  element.textContent = `Browser activity: ${losses} focus losses · ${hides} page hides · ${status}`;
}
function syncAssessmentActivity({keepalive = false} = {}) {
  const rt = state.runtime;
  if (!rt?.activityLog || !rt.submissionId || state.view !== "takeExam" || state.submitting) return Promise.resolve();
  if (rt.activitySyncRequest) return rt.activitySyncRequest;
  if (rt.activitySyncError && Date.now() < (rt.nextActivitySyncAt || 0)) return Promise.resolve();
  clearTimeout(assessmentActivitySyncTimer);
  const payload = {submissionId: rt.submissionId, activityLog: JSON.parse(JSON.stringify(rt.activityLog)), pageHidden: document.hidden, windowFocused: document.hasFocus()};
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  rt.nextActivitySyncAt = Date.now() + 5000;
  const request = (async () => {
    try {
      const response = await apiRequest("POST", `/api/exams/${encodeURIComponent(rt.exam.id)}/activity`, payload, undefined, {keepalive: keepalive && JSON.stringify(payload).length < 60000, signal: controller.signal});
      if (!response?.ok) throw new Error("The server did not confirm activity recording.");
      rt.activitySyncedCount = payload.activityLog.events.length;
      rt.activitySyncError = "";
    } catch (error) {
      rt.activitySyncError = error.message || "Could not sync activity.";
    } finally {
      clearTimeout(timeout);
      rt.activitySyncRequest = null;
      if (state.runtime === rt) {
        updateAssessmentActivityStatus();
        if (!rt.activitySyncError && rt.activitySyncedCount < rt.activityLog.events.length) queueAssessmentActivitySync();
      }
    }
  })();
  rt.activitySyncRequest = request;
  return request;
}
function recordAssessmentActivity(type) {
  const rt = state.runtime;
  if (!rt || state.view !== "takeExam" || state.submitting || rt.pendingSubmission) return;
  const log = rt.activityLog ||= {version: 1, complete: false, truncated: false, events: []};
  if (log.events.length < MAX_ACTIVITY_EVENTS) {
    log.events.push({type, at: Date.now(), hidden: document.hidden, focused: document.hasFocus()});
  } else log.truncated = true;
  saveCurrentAttempt();
  queueAssessmentActivitySync();
}
function handleAssessmentBlur() {
  const rt = state.runtime;
  if (!rt || state.view !== "takeExam" || state.submitting || rt.pendingSubmission) return;
  if (rt.activityFocused !== false) {
    rt.activityFocused = false;
    recordAssessmentActivity("focus_lost");
  }
  warnAssessmentFocus();
}
function handleAssessmentFocus() {
  const rt = state.runtime;
  if (!rt || state.view !== "takeExam" || state.submitting || rt.pendingSubmission) return;
  if (rt.activityFocused === false) {
    rt.activityFocused = true;
    recordAssessmentActivity("focus_returned");
  }
  if (rt.focusDeadlineAt) tickTimer();
}
function warnAssessmentFocus() {
  const runtime = state.runtime;
  if (!runtime || state.view !== "takeExam" || state.submitting || runtime.pendingSubmission || runtime.focusDeadlineAt) return;
  runtime.focusDeadlineAt = Date.now() + FOCUS_WARNING_SECONDS * 1000;
  recordAssessmentActivity("warning_started");
  saveCurrentAttempt();
  render();
}
function handleVisibilityChange() {
  const rt = state.runtime;
  if (rt && state.view === "takeExam" && !state.submitting && !rt.pendingSubmission) {
    if (document.hidden && rt.activityHidden !== true) {
      rt.activityHidden = true;
      recordAssessmentActivity("page_hidden");
    } else if (!document.hidden && rt.activityHidden === true) {
      rt.activityHidden = false;
      recordAssessmentActivity("page_visible");
    }
  }
  if (document.hidden) warnAssessmentFocus();
  else if (state.runtime?.focusDeadlineAt) tickTimer();
  syncAssessmentActivity({keepalive: document.hidden});
}
function acknowledgeAssessmentFocus() {
  if (!state.runtime?.focusDeadlineAt || document.hidden || !document.hasFocus()) return;
  if (Date.now() >= state.runtime.focusDeadlineAt) { tickTimer(); return; }
  state.runtime.focusDeadlineAt = null;
  recordAssessmentActivity("warning_acknowledged");
  saveCurrentAttempt();
  render();
}
function renderFocusWarning() {
  const runtime = state.runtime;
  if (!runtime?.focusDeadlineAt || state.submitting || runtime.pendingSubmission) return "";
  return `<div class="assessment-warning-backdrop"><section class="assessment-warning" role="alertdialog" aria-modal="true" aria-labelledby="focusWarningTitle" aria-describedby="focusWarningMessage"><span class="activity-icon amber">${uiIcon("shield")}</span><h2 id="focusWarningTitle">Return to your assessment</h2><p id="focusWarningMessage">Leaving this tab, switching apps with Alt+Tab, or minimizing the window is restricted. Return and select Continue before the countdown ends, or your current answers will be submitted automatically.</p><div class="focus-countdown"><strong id="focusCountdown">${Math.max(0, Math.ceil((runtime.focusDeadlineAt - Date.now()) / 1000))}</strong><span>seconds remaining</span></div><button type="button" class="btn" onclick="acknowledgeAssessmentFocus()">Continue assessment</button></section></div>`;
}
function handleQuizBackNavigation() {
  const runtime = state.runtime;
  if (!runtime || runtime.exam.activityType !== "quiz") return;
  history.pushState({ aralHubQuiz: runtime.exam.id }, "", window.location.href);
  showModal({
    title: "Quiz in progress",
    message: "Browser Back is disabled while your quiz is active. Submit the quiz when you are finished."
  });
}
function renderTakeExam() {
  const rt = state.runtime;
  const exam = rt.exam;
  const q = exam.questions[rt.currentIdx];
  const total = exam.questions.length;
  const pointsPerQuestion = assessmentPoints(exam, q);
  const answeredCount = answeredQuestionCount(rt);
  const isQuiz = exam.activityType === "quiz";
  const partLabels = {
    1: "Part 1 - Multiple Choice",
    2: "Part 2 - Identification",
    3: "Part 3 - True or False",
    4: "Part 4 - Matching Type",
  };
  const typeParts = { multiple_choice: 1, identification: 2, true_false: 3, matching: 4 };
  const partFor = question => {
    const part = Number(question.part);
    return partLabels[part] ? part : typeParts[question.type] || 1;
  };
  const questionsByPart = new Map();
  exam.questions.forEach((question, index) => {
    const part = partFor(question);
    if (!questionsByPart.has(part)) questionsByPart.set(part, []);
    questionsByPart.get(part).push({ question, index });
  });
  const questionNumbers = new Map();
  for (const questions of questionsByPart.values()) {
    questions.forEach(({ index }, partIndex) => questionNumbers.set(index, partIndex + 1));
  }
  const navBtns = [...questionsByPart.entries()].map(([part, questions]) => `
    <section class="qnav-part" aria-label="${partLabels[part]}">
      <strong class="qnav-part-heading">${partLabels[part]}</strong>
      <div class="qnav-part-buttons">${questions.map(({ question, index }, partIndex) => {
        let cls = "";
        if (index === rt.currentIdx) cls = "current";
        const answered = rt.answers[question.id] !== undefined && String(rt.answers[question.id]).trim() !== "";
        if (answered) cls += " answered";
        const number = partIndex + 1;
        return `<button id="question-nav-${index}" class="${cls}" onclick="jumpTo(${index})" ${index === rt.currentIdx ? 'aria-current="step"' : ""} aria-label="${partLabels[part]}, question ${number}${answered ? ', answered' : ', not answered'}" title="${partLabels[part]} · Question ${number}"><span>${number}</span>${answered ? "<b>✓</b>" : ""}</button>`;
      }).join("")}</div>
    </section>`).join("");
  const opts = q.type === "identification" ? `
    <label for="identification-answer" class="answer-label">Your answer</label><input id="identification-answer" class="identification-input" type="text" autocomplete="off" style="text-transform:uppercase" placeholder="Type your answer here" value="${esc(rt.answers[q.id] || "")}" oninput="setIdentificationAnswer('${q.id}', this.value)" />` : q.options.map((o, oi) => `
    <label class="option ${rt.answers[q.id] === oi ? "selected" : ""}">
      <input id="answer-${q.id}-${oi}" type="radio" name="qopt" ${rt.answers[q.id] === oi ? "checked" : ""} onchange="selectAnswer('${q.id}', ${oi})" />
      <span class="otext">${q.type === "matching" ? `${String.fromCharCode(65 + oi)}. ` : ""}${esc(o)}</span>
    </label>`).join("");
  const currentPart = partFor(q);
  const partLabel = partLabels[currentPart];
  const questionsInPart = questionsByPart.get(currentPart).length;
  const submitLabel = isQuiz ? "Submit quiz" : "Submit exam";
  return `
  <div class="wrap exam-take-wrap"><div class="wrap-inner exam-shell">
    <div class="exam-topbar">
      <div class="exam-heading"><span class="eyebrow">${isQuiz ? "Quiz" : "Exam"} · ${esc(exam.subject || "Class activity")}</span><h2>${esc(exam.title)}</h2><div class="exam-context">${esc(exam.yearLevel || "All years")} · ${exam.sectionScope === "ALL" ? "All sections" : `Section ${esc(exam.sectionScope)}`} · <span data-answer-count>${answeredCount} of ${total} answered</span> · Leaving this window starts a 10-second submission warning · ${assessmentScoringLabel(exam)} · Answers saved on this device</div></div>
      <div class="timer-wrap"><span class="timer-caption">Time remaining</span><div id="timerDisplay" role="timer" aria-live="off" class="timer ${rt.secondsLeft <= 60 ? 'low' : ''}">${fmtTime(rt.secondsLeft)}</div></div>
    </div>
    ${state.draftSaveError ? `<div class="conn-banner" role="alert">${esc(state.draftSaveError)}</div>` : ""}
    <p id="assessmentActivityStatus" class="help-text" role="status" aria-live="polite">Browser activity is recorded for teacher monitoring.</p>
    <div class="progress-track" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${answeredCount}"><div class="progress-fill" style="width:${(answeredCount / total * 100) || 0}%"></div></div>
    <div class="exam-stage"><div class="question-block" data-active-question="${esc(q.id)}" role="region" aria-label="Current question" tabindex="0"><div class="question-kicker"><span class="part-label">${partLabel}</span><span class="question-count">Question ${questionNumbers.get(rt.currentIdx)} of ${questionsInPart} · ${pointsPerQuestion} ${pointsPerQuestion === 1 ? "point" : "points"}</span></div><div class="qtext">${esc(q.text)}</div>${q.type === "matching" ? '<p class="help-text">Choose the correct match for this item.</p>' : ""}${opts}</div>
    <nav class="question-navigator" aria-label="Question navigation"><div class="navigator-heading"><strong>Questions</strong><span>${total} total</span></div><div class="qnav">${navBtns}</div><div class="navigator-legend"><i class="legend-dot answered-dot"></i> Answered <i class="legend-dot"></i> Unanswered</div></nav></div>
    <div class="exam-nav-row">
      <div>
        <button id="examPrevious" class="btn secondary" ${rt.currentIdx === 0 ? "disabled" : ""} onclick="jumpTo(${rt.currentIdx - 1})">&larr; Previous</button>
        ${rt.currentIdx < total - 1 ? `<button id="examNext" class="btn" onclick="jumpTo(${rt.currentIdx + 1})">Next &rarr;</button>` : ``}
      </div>
      <button id="examSubmit" class="btn" ${state.submitting ? "disabled" : ""} onclick="confirmSubmit()">${state.submitting ? "Saving..." : submitLabel}</button>
    </div>
  </div></div>`;
}
function selectAnswer(qid, idx) { if (!state.runtime || state.submitting || state.runtime.pendingSubmission || state.runtime.focusDeadlineAt) return; state.runtime.answers[qid] = idx; saveCurrentAttempt(); render(); }
function setIdentificationAnswer(qid, value) {
  if (!state.runtime || state.submitting || state.runtime.pendingSubmission || state.runtime.focusDeadlineAt) return;
  value = value.toUpperCase();
  state.runtime.answers[qid] = value;
  saveCurrentAttempt();
  const questionIndex = state.runtime.exam.questions.findIndex(q => q.id === qid);
  const navButton = document.getElementById(`question-nav-${questionIndex}`);
  if (navButton) {
    const answered = value.trim() !== "";
    navButton.classList.toggle("answered", answered);
    navButton.setAttribute("aria-label", `Question ${questionIndex + 1}, ${answered ? "answered" : "not answered"}`);
    navButton.querySelector("b")?.remove();
    if (answered) navButton.insertAdjacentHTML("beforeend", "<b>✓</b>");
  }
  const answeredCount = answeredQuestionCount(state.runtime);
  const total = state.runtime.exam.questions.length;
  document.querySelectorAll("[data-answer-count]").forEach(label => { label.textContent = `${answeredCount} of ${total} answered`; });
  const progress = document.querySelector('[role="progressbar"]');
  progress?.setAttribute("aria-valuenow", answeredCount);
  const fill = progress?.querySelector(".progress-fill");
  if (fill) fill.style.width = `${answeredCount / total * 100}%`;
}
function jumpTo(idx) {
  if (idx < 0 || idx >= state.runtime.exam.questions.length) return;
  state.runtime.currentIdx = idx;
  saveCurrentAttempt();
  render();
}
function confirmSubmit() {
  if (!state.runtime || state.submitting || state.runtime.pendingSubmission || state.runtime.focusDeadlineAt) return;
  const total = state.runtime.exam.questions.length;
  const answered = answeredQuestionCount(state.runtime);
  const isQuiz = state.runtime.exam.activityType === "quiz";
  const activityName = isQuiz ? "quiz" : "exam";
  const msg = answered < total
    ? `You've answered ${answered} of ${total} questions. Submit this ${activityName} anyway?`
    : `Submit your ${activityName} now?`;
  showModal({
    title: `Submit ${activityName}`,
    message: msg,
    confirmLabel: `Submit ${activityName}`,
    cancelLabel: "Cancel",
    onConfirm: () => { clearInterval(state.runtime.timerId); submitExam(false); }
  });
}
async function submitExam(autoSubmitted, submitReason = autoSubmitted ? "time_limit" : "manual") {
  if (state.submitting || !state.runtime) return;
  recordAssessmentActivity(`submit_${submitReason}`);
  state.submitting = true;
  const rt = state.runtime;
  const exam = rt.exam;
  if (rt.timerId) clearInterval(rt.timerId);
  if (autoSubmitted) rt.pendingSubmission = submitReason;
  rt.focusDeadlineAt = null;
  saveCurrentAttempt();
  if (!rt.submissionId) rt.submissionId = Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16).padStart(8, "0")).join("");
  rt.secondsLeft = Math.max(0, Math.ceil((rt.deadlineAt - Date.now()) / 1000));
  const timeTakenSec = Math.max(0, exam.duration * 60 - rt.secondsLeft);
  const payload = { submissionId: rt.submissionId, examId: exam.id, name: state.currentUser.name, rollNo: state.currentUser.rollNo, answers: rt.answers, timeTakenSec, autoSubmitted: !!autoSubmitted, submitReason, activityLog: rt.activityLog || null };
  render();
  try {
    const result = await apiRequest("POST", "/api/results", payload);
    state.lastResult = result;
    state.myResults = state.myResults.concat([{ id: result.id, examId: result.examId, examTitle: result.examTitle, activityType: result.activityType || exam.activityType || "exam", score: result.score, total: result.total, percent: result.percent }]);
    state.studentReview = null;
    state.studentReviewError = "";
    clearSavedAttempt();
    state.savedAttempt = null;
    state.runtime = null;
    state.submitting = false;
    setView("studentResult");
    closeModal();
  } catch (err) {
    state.submitting = false;
    if (err.status === 409) {
      state.runtime = null;
      await goStudentHome();
      closeModal();
      return;
    }
    rt.retryAt = Date.now() + 5000;
    rt.timerId = setInterval(tickTimer, 1000);
    showModal({ title: "Submission failed", message: (err.message || "Check your connection.") + (autoSubmitted ? " Your answers are saved on this device. Automatic submission will retry when connected." : " Your answers are saved; the assessment timer is still running."), confirmLabel: "Retry submission", onConfirm: () => submitExam(autoSubmitted, submitReason) });
    render();
  }
}

/* ============================= RESULT PAGE ============================= */
function renderStudentResult() {
  const r = state.lastResult;
  if (!r) return `<div class="wrap"><div class="wrap-inner"><div class="empty">Submission not found.</div></div></div>`;
  const percent = resultPercent(r);
  const passed = percent >= PASSING_PERCENT;
  const review = state.studentReview ? state.studentReview.map((question, index) => {
    const choices = Array.isArray(question.options) ? question.options : [];
    const answer = question.chosen === null || question.chosen === undefined || question.chosen === ""
      ? "Not answered"
      : question.type === "identification" ? question.chosen : choices[question.chosen] || `Option ${Number(question.chosen) + 1}`;
    const correctAnswer = question.type === "identification"
      ? question.answer ?? "Not available"
      : Number.isInteger(question.correct) && question.correct >= 0
        ? choices[question.correct] ?? `Option ${question.correct + 1}`
        : "Not available";
    return `<article class="review-item"><div class="rhead"><div class="rqtext">${index + 1}. ${esc(question.text)}</div><span class="tag ${question.isCorrect ? "correct" : "wrong"}">${question.isCorrect ? "Correct" : "Incorrect"} · ${question.pointsAwarded} / ${question.pointsPossible} points</span></div><div class="aline">Your answer: <b>${esc(answer)}</b></div><div class="aline">Correct answer: <b>${esc(correctAnswer)}</b></div></article>`;
  }).join("") : "";
  return `<div class="wrap"><div class="wrap-inner"><button class="back-link" onclick="goStudentHome()">&larr; Back to assessments</button><div class="score-hero"><span class="eyebrow">SUBMISSION RECEIVED</span><h2>Your work is saved.</h2><div class="meta">${esc(r.examTitle || "Assessment")}</div><div class="big">${r.score}<span style="font-size:26px;color:var(--ink-faint);"> / ${r.total} points</span></div><div class="pct">${percent.toFixed(1)}% · <strong class="grade-status ${passed ? "passed" : "failed"}">${passed ? "Passed" : "Failed"}</strong></div><div class="pct">${assessmentScoringLabel(r)} · Time taken ${fmtTime(r.timeTakenSec)}</div></div><button type="button" class="btn secondary" onclick="openStudentResultReview()" ${state.studentReviewLoading ? "disabled" : ""}>${state.studentReviewLoading ? "Loading review..." : state.studentReview ? "Refresh my answer review" : "Review my answers"}</button>${state.studentReviewError ? `<div class="conn-banner" role="alert">${esc(state.studentReviewError)}</div>` : ""}${state.studentReview ? `<section aria-labelledby="studentReviewHeading"><h3 id="studentReviewHeading">Your answer review</h3><p class="help-text">Compare your answers with the correct answers and see your points earned.</p>${review || '<div class="empty">No question review is available.</div>'}</section>` : ""}<p class="help-text">You can review your submitted answers, correct answers, and points here.</p><button class="btn" onclick="goStudentHome()">Back to your workspace ${uiIcon("arrow")}</button></div></div>`;
}
async function openStudentResultReview() {
  const resultId = state.lastResult?.id;
  if (!resultId || state.studentReviewLoading) return;
  state.studentReviewLoading = true;
  state.studentReviewError = "";
  render();
  try {
    const result = await apiRequest("GET", `/api/results/${encodeURIComponent(resultId)}/review`);
    state.studentReview = result.review || [];
  } catch (err) {
    state.studentReviewError = err.message || "Could not load your answer review.";
  } finally {
    state.studentReviewLoading = false;
    render();
  }
}

/* ============================= ROUTER / RENDER ============================= */
function render() {
  const previous = captureInterfaceState();
  const previousQuestion = document.querySelector("[data-active-question]");
  const questionPosition = {id:previousQuestion?.dataset.activeQuestion, top:previousQuestion?.scrollTop || 0};
  const questionNavPosition = document.querySelector(".qnav")?.scrollTop || 0;
  let body = "";
  switch (state.view) {
    case "learningHome": body = renderLearningWorkspace(); break;
    case "landing": body = renderLanding(); break;
    case "studentSignup": body = renderStudentSignup(); break;
    case "studentLogin": body = renderStudentLogin(); break;
    case "studentHome": body = renderStudentHome(); break;
    case "takeExam": body = renderTakeExam(); break;
    case "studentResult": body = renderStudentResult(); break;
    default: body = renderLanding();
  }
  document.body.className = state.currentUser ? `app-page student-page ${state.view === "studentHome" ? "student-home-page" : ""} ${state.view === "takeExam" ? "exam-in-progress" : ""}` : state.view === "landing" ? "landing-page" : state.view === "studentSignup" ? "auth-page student-signup-page" : "auth-page";
  const content = state.currentUser ? renderWorkspace(body, "student") : state.view === "landing" ? body : renderAuthLayout(body);
  document.getElementById("app").innerHTML = content + renderModalHtml() + renderFocusWarning();
  enhanceInterface(previous);
  syncStudentLiveUpdates();
  const workspace = document.querySelector('.workspace');
  if (workspace) workspace.inert = !!state.runtime && (!!state.runtime.focusDeadlineAt || !!state.runtime.pendingSubmission || state.submitting);
  document.querySelector('.assessment-warning button')?.focus({preventScroll:true});
  updateAssessmentActivityStatus();
  if (state.view === "takeExam") {
    const question = document.querySelector("[data-active-question]");
    if (question && question.dataset.activeQuestion === questionPosition.id) question.scrollTop = questionPosition.top;
    const questionNav = document.querySelector(".qnav");
    if (questionNav) {
      questionNav.scrollTop = questionNavPosition;
      questionNav.querySelector('[aria-current="step"]')?.scrollIntoView({block:"nearest"});
    }
    window.scrollTo({top:0, left:0, behavior:"auto"});
  }
  if (state.view === "studentSignup") updateSignupSections(previous?.view === state.view ? previous.fields.find(field => field.id === "up_section")?.value || "" : "");
}
let studentLiveTimer = null;
let studentLiveRequest = null;
function studentLiveActive() {
  return !!document.getElementById("app") && !!state.currentUser && !state.studentLiveBlocked && ["studentHome", "studentResult"].includes(state.view) && !document.hidden && !document.querySelector('[role="dialog"]');
}
function syncStudentLiveUpdates() {
  clearTimeout(studentLiveTimer);
  if (!studentLiveActive()) { studentLiveRequest = null; return; }
  if (!studentLiveRequest) studentLiveTimer = setTimeout(refreshStudentWorkspace, state.connError ? 10000 : 5000);
}
async function refreshStudentWorkspace() {
  if (!studentLiveActive() || studentLiveRequest) return;
  const request = {user:state.currentUser, view:state.view};
  studentLiveRequest = request;
  try {
    const [exams, results] = await Promise.all([apiRequest("GET", "/api/exams?studentView=1"), apiRequest("GET", `/api/results?rollNo=${encodeURIComponent(request.user.rollNo)}`)]);
    if (studentLiveRequest !== request || state.currentUser !== request.user || state.view !== request.view || !studentLiveActive()) return;
    const changed = JSON.stringify(exams) !== JSON.stringify(state.exams) || JSON.stringify(results) !== JSON.stringify(state.myResults) || !!state.connError;
    state.exams = exams; state.myResults = results; state.connError = "";
    if (state.view === "studentResult" && state.lastResult && !results.some(result => result.id === state.lastResult.id)) {
      state.studentReview = null; state.lastResult = null;
      state.draftRecoveryMessage = "Your teacher returned your assessment. Open it to continue with your saved answers and a fresh time allowance.";
      setView("studentHome");
    } else if (changed && state.view === "studentHome") {
      const position = window.scrollY; render(); window.scrollTo({top:position, behavior:"auto"});
    }
  } catch (error) {
    if (studentLiveRequest === request && studentLiveActive()) {
      if (handleStudentSessionFailure(error)) return;
      state.studentLiveBlocked = !!error.status && error.status < 500;
      state.connError = error.status ? (error.message || "The server could not refresh your workspace. Try again.") : "Could not reach the server. Reconnecting automatically; your displayed work is kept.";
      if (state.view === "studentHome") render();
    }
  } finally {
    if (studentLiveRequest === request) studentLiveRequest = null;
    syncStudentLiveUpdates();
  }
}
function handleStudentSessionFailure(error) {
  if (error.status !== 401) return false;
  saveCurrentAttempt();
  if (state.runtime?.timerId) clearInterval(state.runtime.timerId);
  state.runtime = null; state.submitting = false;
  state.currentUser = null;
  state.exams = []; state.myResults = [];
  state.lastResult = null; state.studentReview = null;
  state.connError = "";
  state.studentLiveBlocked = true;
  setView("studentLogin");
  state.errorMsg = "Your student session has expired. Sign in to continue. Any saved answers remain on this device.";
  render();
  navigateToPortal("/login?expired=1");
  return true;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && studentLiveActive()) refreshStudentWorkspace(); else syncStudentLiveUpdates(); });
window.addEventListener("online", () => { if (studentLiveActive()) refreshStudentWorkspace(); if (state.runtime) { state.runtime.nextActivitySyncAt = 0; syncAssessmentActivity(); } });
window.addEventListener("pagehide", () => { clearTimeout(studentLiveTimer); studentLiveRequest = null; });
document.addEventListener("visibilitychange", handleVisibilityChange);
window.addEventListener("blur", handleAssessmentBlur);
window.addEventListener("focus", handleAssessmentFocus);
document.addEventListener("keydown", event => {
  if (!state.runtime?.focusDeadlineAt || !document.querySelector('.assessment-warning')) return;
  if (event.key === "Escape" || event.key === "Tab") { event.preventDefault(); document.querySelector('.assessment-warning button')?.focus(); }
});
window.addEventListener("pagehide", () => { saveCurrentAttempt(); syncAssessmentActivity({keepalive: true}); });
window.addEventListener("beforeunload", saveCurrentAttempt);
window.addEventListener("popstate", handleQuizBackNavigation);
if (window.ARALHUB_CURRENT_USER?.role === "student") {
  state.currentUser = window.ARALHUB_CURRENT_USER;
  goStudentHome();
} else render();
</script>
