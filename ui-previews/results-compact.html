function esc(str) {
   if (str === null || str === undefined) return "";
   return String(str).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
   }[ch]));
}

function fmtTime(totalSeconds) {
   const s = Math.max(0, Math.floor(totalSeconds || 0));
   const m = Math.floor(s / 60);
   const sec = s % 60;
   return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

function assessmentPoints(activity, question) {
   return activity?.activityType === "quiz" || ["true_false", "matching"].includes(question?.type) ? 1 : 2;
}

function assessmentPointLabel(activity, question) {
   const points = assessmentPoints(activity, question);
   return `${points} ${points === 1 ? "point" : "points"}`;
}

function assessmentScoringLabel(activity) {
   return activity?.activityType === "quiz" ? "1 point per question" : "Multiple Choice and Identification: 2 points each; True/False and Matching Type: 1 point each";
}

function userInitials(name) {
   return String(name || "A").trim().split(/\s+/).slice(0, 2).map(word => word[0]).join("").toUpperCase();
}

function answeredQuestionCount(runtime) {
   return runtime.exam.questions.filter(question => {
      const value = runtime.answers[question.id];
      return value !== undefined && value !== null && String(value).trim() !== "";
   }).length;
}

async function openWorkspaceSection(section) {
   if (section === "materials") { await openLearningWorkspace(); return; }
   const student = state.currentUser?.role === "student" || !state.currentUser?.role;
   if (state.currentUser?.role === "teacher" && section === "overview") section = "activities";
   if (state.currentUser?.role === "teacher" && section === "activities") state.selectedTeacherSubject = "";
   state.workspaceSection = section;
   if (student && state.view !== "studentHome") await goStudentHome();
   else if (!student && state.view !== "adminHome") await goAdminHome();
   else render();
   const target = document.getElementById(section);
   if (section === "students") target?.querySelector("details")?.setAttribute("open", "");
   target?.scrollIntoView({ behavior: "smooth", block: "start" });
}

function navigateToPortal(path) { window.location.assign(path); }

function renderPortalLogin(action = "doPortalLogin", usernameId = "li_username", passwordId = "li_password") {
   return `<div class="wrap auth-wrap"><div class="wrap-inner auth-inner auth-login-inner"><form class="sheet auth-card login-card" onsubmit="event.preventDefault(); submitAuthForm(this, ${action})"><div class="auth-brand"><span class="brand-logo-frame"><img src="images/wallpapercdk.png" alt="AbieksExamSys logo"></span><span>AbieksExamSys</span></div><div class="auth-heading"><span class="eyebrow">Student &amp; teacher sign in</span><h2>Welcome back</h2><div class="meta">Use your teacher username or student ID. Your account opens the right workspace.</div></div>${state.successMsg ? `<div class="banner success">${esc(state.successMsg)}</div>` : ""}${state.errorMsg ? `<div class="banner">${esc(state.errorMsg)}</div>` : ""}<div class="field"><label for="${usernameId}">Username or student ID</label><input id="${usernameId}" type="text" placeholder="Your username or student ID" autocomplete="username" required maxlength="255"></div><div class="field"><label for="${passwordId}">Password</label><input id="${passwordId}" type="password" placeholder="Your password" autocomplete="current-password" required></div><button type="submit" class="btn block auth-submit">Sign in</button><details class="forgot-password-help"><summary>Forgot password?</summary><p>Students can ask their teacher or the school administrator to reset their password after verifying their student ID. Teachers can contact the school administrator.</p></details></form><a class="back-link" href="/?signup=1">Create a student account</a><a class="back-link" href="/">&larr; Back to AbieksExamSys</a></div></div>`;

async function doPortalLogin(usernameId = "li_username", passwordId = "li_password") {
   const username = document.getElementById(usernameId).value.trim();
   const password = document.getElementById(passwordId).value;
   if (!username || !password) { state.errorMsg = "Enter your username or student ID and password."; render(); return; }
   try {
      const result = await apiRequest("POST", "/api/auth/login", {username, password});
      const destination = {student:"/student", teacher:"/teacher", admin:"/admin/"}[result.role];
      if (!destination) throw new Error("Your account could not be opened. Contact the school administrator.");
      navigateToPortal(destination);
   } catch (error) { state.errorMsg = error.message || "Could not sign in. Please try again."; render(); }
}

function setActivityFilter(type, button) {
   state.activityFilter = type;
   document.querySelectorAll(".activity-tabs button").forEach(item => { item.classList.toggle("active", item === button); item.setAttribute("aria-pressed", item === button ? "true" : "false"); });
   document.querySelector(".activity-toolbar").dataset.filter = type;
   filterActivityCards();
}

function filterActivityCards() {
   const query = (document.getElementById("activitySearch")?.value || "").trim().toLowerCase();
   state.activityQuery = document.getElementById("activitySearch")?.value || "";
   const type = document.querySelector(".activity-toolbar")?.dataset.filter || "all";
   let visible = 0;
   document.querySelectorAll(".exam-row[data-activity]").forEach(card => {
      const subjectMatches = state.currentUser?.role !== "teacher" || !state.selectedTeacherSubject || card.dataset.subject === state.selectedTeacherSubject;
      card.hidden = !(subjectMatches && card.dataset.search.includes(query) && (type === "all" || card.dataset.activity === type));
      if (!card.hidden) visible++;
   });
   const empty = document.getElementById("activityNoMatches");
   if (empty) empty.hidden = visible > 0;
   const count = document.getElementById("activitySearchCount");
   if (count) count.textContent = `${visible} ${visible === 1 ? "assessment" : "assessments"} shown`;
}

// Preserve entries when validation redraws the same authentication screen.
// Passwords remain only in the current page's memory, never in browser storage.
function captureInterfaceState() {
   const app = document.getElementById("app");
   return {
      view: app.dataset.view,
      focusId: document.activeElement?.id,
      fields: Array.from(app.querySelectorAll(".auth-form-area input[id], .auth-form-area select[id]"), field => ({
         id: field.id, value: field.value,
         selected: field.multiple ? Array.from(field.selectedOptions, option => option.value) : null,
      })),
   };
}

function refreshMultiSelect(select) {
   select.parentElement.querySelector(`[data-select-id="${select.id}"]`)?.remove();
   const label = select.closest(".field")?.querySelector("label");
   if (label && !label.id) label.id = `${select.id}-label`;
   const group = document.createElement("div");
   group.className = "choice-list";
   group.dataset.selectId = select.id;
   group.setAttribute("role", "group");
   if (label) group.setAttribute("aria-labelledby", label.id);
   const options = Array.from(select.options).filter(option => option.value);
   if (!options.length) {
      const message = document.createElement("p");
      message.className = "help-text";
      message.textContent = select.options[0]?.textContent || "No options available.";
      group.append(message);
   }
   for (const option of options) {
      const item = document.createElement("label");
      item.className = "choice-item";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = option.selected;
      checkbox.disabled = select.disabled || option.disabled;
      checkbox.addEventListener("change", () => {
         option.selected = checkbox.checked;
         select.dispatchEvent(new Event("change", { bubbles: true }));
      });
      const text = document.createElement("span");
      text.textContent = option.textContent;
      item.append(checkbox, text);
      group.append(item);
   }
   select.hidden = true;
   select.after(group);
}

function enhanceInterface(previous) {
   const app = document.getElementById("app");
   if (previous?.view === state.view) {
      for (const saved of previous.fields) {
         const field = document.getElementById(saved.id);
         if (!field) continue;
         if (saved.selected) Array.from(field.options).forEach(option => { option.selected = saved.selected.includes(option.value); });
         else field.value = saved.value;
      }
   }
   app.dataset.view = state.view;
   app.querySelectorAll(".field").forEach((field, index) => {
      const control = field.querySelector("input, select, textarea");
      const label = field.querySelector("label");
      if (control && label && !label.contains(control)) {
         if (!control.id) control.id = `field-${index}`;
         label.htmlFor = control.id;
         const hint = field.querySelector(".help-text");
         if (hint) { hint.id = `${control.id}-hint`; control.setAttribute("aria-describedby", hint.id); }
      }
   });
   app.querySelectorAll('input[type="password"]').forEach(input => {
      const wrapper = document.createElement("div");
      wrapper.className = "password-field";
      input.before(wrapper);
      wrapper.append(input);
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "password-toggle";
      toggle.textContent = "Show";
      toggle.setAttribute("aria-controls", input.id);
      toggle.setAttribute("aria-pressed", "false");
      toggle.setAttribute("aria-label", `Show ${input.closest(".field")?.querySelector("label")?.textContent.toLowerCase() || "password"}`);
      toggle.addEventListener("click", () => {
         const show = input.type === "password";
         input.type = show ? "text" : "password";
         toggle.textContent = show ? "Hide" : "Show";
         toggle.setAttribute("aria-pressed", String(show));
         toggle.setAttribute("aria-label", `${show ? "Hide" : "Show"} ${input.closest(".field")?.querySelector("label")?.textContent.toLowerCase() || "password"}`);
      });
      wrapper.append(toggle);
   });
   app.querySelectorAll("select[multiple]").forEach(refreshMultiSelect);
   app.querySelectorAll(".opt-row").forEach(row => {
      const letter = row.querySelector(".opt-label")?.textContent || "";
      row.querySelector('input[type="text"]')?.setAttribute("aria-label", `Option ${letter}`);
      row.querySelector('input[type="radio"]')?.setAttribute("aria-label", `Mark option ${letter} as correct`);
   });
   app.querySelectorAll(".banner, .conn-banner").forEach(banner => {
      banner.setAttribute("role", banner.classList.contains("success") ? "status" : "alert");
   });
   app.querySelectorAll("th").forEach(header => { header.scope = "col"; });
   app.querySelectorAll(".teacher-table-wrap, .table-scroll").forEach(wrapper => {
      wrapper.tabIndex = 0;
      wrapper.setAttribute("role", "region");
      wrapper.setAttribute("aria-label", "Directory table. Scroll horizontally to see all columns.");
   });
   if (document.getElementById("activitySearch")) filterActivityCards();
   const modal = app.querySelector('[role="dialog"]');
   document.body.classList.toggle("modal-open", !!modal);
   if (modal) modal.querySelector("button")?.focus();
   else if (state.errorMsg) {
      const alert = app.querySelector('[role="alert"]');
      if (alert) { alert.tabIndex = -1; alert.focus(); }
   } else if (previous?.view === state.view && previous.focusId) document.getElementById(previous.focusId)?.focus({ preventScroll: true });
}

function renderDirectoryTools(id, placeholder) {
   return `<div class="table-tools"><label class="activity-search">${uiIcon("search")}<span class="sr-only">${esc(placeholder)}</span><input type="search" placeholder="${esc(placeholder)}" oninput="filterDirectory(this, '${id}')"></label><p id="${id}-status" class="search-count" role="status"></p><p class="table-scroll-hint">Scroll sideways to see all columns.</p></div>`;
}

function filterDirectory(input, directoryId) {
   const directory = document.getElementById(directoryId);
   if (!directory) return;
   const query = input.value.trim().toLowerCase();
   let count = 0;
   directory.querySelectorAll("tbody tr").forEach(row => {
      row.hidden = !row.textContent.toLowerCase().includes(query);
      if (!row.hidden) count++;
   });
   const status = document.getElementById(`${directoryId}-status`);
   if (status) status.textContent = count ? `${count} ${count === 1 ? "record" : "records"} shown` : "No matching records. Try another name or ID.";
}

async function submitAuthForm(form, action) {
   if (form.getAttribute("aria-busy") === "true") return;
   form.setAttribute("aria-busy", "true");
   const button = form.querySelector('button[type="submit"]');
   const label = button.textContent;
   button.disabled = true;
   button.textContent = "Please wait...";
   try { await action(); }
   finally {
      form.removeAttribute("aria-busy");
      button.disabled = false;
      button.textContent = label;
   }
}

document.addEventListener("keydown", event => {
   const modal = document.querySelector('[role="dialog"]');
   if (!modal) return;
   if (event.key === "Escape") { event.preventDefault(); closeModal(); }
   if (event.key === "Tab") {
      const buttons = Array.from(modal.querySelectorAll("button:not(:disabled)"));
      const first = buttons[0], last = buttons[buttons.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
   }
});

let _csrfToken = null;
let _csrfLoading = null;

function portalRequestRole(path) {
   if (path === "/api/auth/login") return "public";
   if (window.ARALHUB_ROLE) return window.ARALHUB_ROLE;
   if (path.startsWith("/api/admin/") || path.startsWith("/api/teachers")) return "teacher";
   if (typeof state !== "undefined" && state.currentUser?.role === "teacher") return "teacher";
   return "student";
}

async function getCsrfToken() {
   if (_csrfToken) return _csrfToken;
   if (!_csrfLoading) {
      _csrfLoading = (async () => {
         try {
            const response = await fetch("/api/csrf", { credentials: "same-origin", cache: "no-store", headers:{"X-Portal-Role":portalRequestRole("/api/csrf")} });
            const data = await response.json();
            if (!response.ok || typeof data.csrfToken !== "string") throw new Error("Could not initialize a secure request. Refresh the page and try again.");
            _csrfToken = data.csrfToken;
            return _csrfToken;
         } catch (error) {
            if (error instanceof TypeError) throw new Error("Could not reach the server. Check your connection and try again.");
            throw error;
         } finally { _csrfLoading = null; }
      })();
   }
   return _csrfLoading;
}

async function apiRequest(method, path, body, extraHeaders) {
   const headers = Object.assign({ "Content-Type": "application/json", "X-Portal-Role":portalRequestRole(path) }, extraHeaders || {});
   const multipart = body instanceof FormData;
   if (multipart) delete headers["Content-Type"];
   if (!["GET", "HEAD", "OPTIONS"].includes(method)) headers["X-CSRFToken"] = await getCsrfToken();
   const opts = { method, headers, credentials: "same-origin", cache: "no-store" };
   if (body !== undefined) opts.body = multipart ? body : JSON.stringify(body);

   // Only keyed submissions are safe to resend after a lost response.
   const attempts = method === "POST" && path === "/api/results" && body?.submissionId ? 4 : 1;
   let csrfRetried = false;
   for (let attempt = 0; attempt < attempts; attempt++) {
      try {
         const res = await fetch(path, opts);
         let data = null;
         try { data = await res.json(); } catch (e) { data = null; }
         if (res.ok && data !== null) {
            if (path.endsWith("/login") || path === "/api/logout") _csrfToken = null;
            return data;
         }
         if (res.status === 403) _csrfToken = null;
         if (res.status === 403 && data?.code === "csrf_failed" && !csrfRetried && !["GET", "HEAD", "OPTIONS"].includes(method)) {
            // CSRF rejects the request before its handler runs, so this one
            // retry cannot duplicate a publish, submission, or teacher return.
            csrfRetried = true;
            headers["X-CSRFToken"] = await getCsrfToken();
            attempt--;
            continue;
         }
         const error = new Error((data && data.error) || `Request failed (${res.status}).`);
         error.status = res.status;
         error.code = data && data.code;
         error.retryable = [502, 503, 504].includes(res.status) || (res.ok && data === null);
         throw error;
      } catch (err) {
         const retryable = err instanceof TypeError || err.retryable;
         if (!retryable || attempt === attempts - 1) {
            if (err instanceof TypeError) throw new Error("Could not reach the server. Check your connection and try again.");
            throw err;
         }
         await new Promise(resolve => setTimeout(resolve, 1000 * (2 ** attempt) + Math.random() * 500));
      }
   }
}

let _modal = null;

function showModal(opts) {
   _modal = {
      title: opts.title || "",
      message: opts.message || "",
      confirmLabel: opts.confirmLabel || "OK",
      cancelLabel: opts.cancelLabel || null,
      onConfirm: typeof opts.onConfirm === "function" ? opts.onConfirm : null,
      inputLabel: opts.inputLabel || null,
      inputExpected: opts.inputExpected || null,
      inputRequiredMessage: opts.inputRequiredMessage || "Enter the student's ID number to continue.",
      inputValue: "",
      inputError: "",
   };
   if (typeof render === "function") render();
}

function closeModal() {
   _modal = null;
   if (typeof render === "function") render();
}

function _modalConfirm() {
   if (_modal?.inputLabel && (!_modal.inputValue.trim() || (_modal.inputExpected && _modal.inputValue.trim() !== _modal.inputExpected))) {
      _modal.inputError = _modal.inputRequiredMessage;
      if (typeof render === "function") render();
      document.getElementById("dialogInput")?.focus();
      return;
   }
   const cb = _modal && _modal.onConfirm;

/* TXT question format shared by the upload preview and question editor. */
const EXAM_PARTS = [
  { part: 1, type: "multiple_choice", label: "Multiple Choice" },
  { part: 2, type: "identification", label: "Identification" },
  { part: 3, type: "true_false", label: "True or False" },
  { part: 4, type: "matching", label: "Matching Type" },
];

function parseExamText(input) {
  if (typeof input !== "string" || !input.trim()) throw new Error("The TXT file is empty.");
  const questions = [];
  let part = 1;
  let current = null;
  let sharedChoices = [];
  let collectingChoices = false;
  const typeNames = {
    multiplechoice: 1, identification: 2, truefalse: 3, trueorfalse: 3,
    matching: 4, matchingtype: 4,
  };
  const fail = (line, message) => { throw new Error(`Line ${line}: ${message}`); };

  function finish() {
    if (!current) return;
    const q = current;
    if (!q.text.trim()) fail(q.line, "Question text is missing.");
    if (!q.answer) fail(q.line, "Add an Answer: line for this question.");
    const definition = EXAM_PARTS[part - 1];
    let options = q.options;
    let correct = 0;
    let answerText = "";
    if (definition.type === "identification") {
      if (options.length) fail(q.line, "Identification questions use Answer: text, without choices.");
      answerText = q.answer.toUpperCase();
    } else if (definition.type === "true_false") {
      if (options.length && (options.length !== 2 || options[0].toLowerCase() !== "true" || options[1].toLowerCase() !== "false")) {
        fail(q.line, "True or False choices must be A. True and B. False, or omit the choices.");
      }
      options = ["True", "False"];
      const answer = q.answer.toUpperCase();
      if (!["TRUE", "FALSE", "T", "F", "A", "B"].includes(answer)) fail(q.line, "Use Answer: True or Answer: False.");
      correct = ["TRUE", "T", "A"].includes(answer) ? 0 : 1;
    } else {
      if (definition.type === "multiple_choice" && options.length !== 4) fail(q.line, "Multiple choice needs four choices, A-D.");
      if (definition.type === "matching" && (options.length < 2 || options.length > 26)) fail(q.line, "Matching Type needs 2-26 choices, or a shared Choices: list.");
      const letter = q.answer.toUpperCase();
      correct = /^[A-Z]$/.test(letter) ? letter.charCodeAt(0) - 65 : -1;
      if (correct < 0 || correct >= options.length) fail(q.line, "Answer must be a letter from this question's choices.");
    }
    questions.push({
      part, type: definition.type, text: q.text.trim(), options, correct,
      answerText, alternatives: q.alternatives,
    });
    current = null;
  }

  function start(text, line) {
    current = { text, line, answer: "", alternatives: [], options: part === 4 ? sharedChoices.slice() : [], ownChoices: false };
  }

  input.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n").split("\n").forEach((raw, index) => {
    const line = raw.trim();
    const number = index + 1;
    if (!line) return;
    const heading = line.match(/^\[?\s*Part\s+(\d+|IV|III|II|I)\b.*?\]?$/i);
    const bareType = typeNames[line.replace(/[\s_\-\[\]:/]/g, "").toLowerCase()];
    if (heading || bareType) {
      finish();
      const roman = { I: 1, II: 2, III: 3, IV: 4 };
      const next = heading ? (roman[heading[1].toUpperCase()] || Number(heading[1])) : bareType;
      if (next < 1 || next > 4) fail(number, "Only Parts 1-4 are supported.");
      part = next;
      sharedChoices = [];
      collectingChoices = false;
      return;
    }
    const typeLine = line.match(/^Type\s*:\s*(.+)$/i);
    if (typeLine) {
      finish();
      const next = typeNames[typeLine[1].replace(/[\s_\-/]/g, "").toLowerCase()];
      if (!next) fail(number, "Unknown question type.");
      part = next;
      collectingChoices = false;
      return;
    }
    if (/^(Choices|Column\s+B)\s*:\s*$/i.test(line)) {
      finish();
      if (part !== 4) fail(number, "Shared Choices: lists belong in Part 4 - Matching Type.");
      sharedChoices = [];
      collectingChoices = true;
      return;
    }
    const question = line.match(/^(?:Question\s*:\s*|\d+\s*[.)-]\s*)(.+)$/i);
    if (question) {
      finish();
      start(question[1], number);
      collectingChoices = false;
      return;
    }
    const option = line.match(/^([A-Z])\s*[.)]\s*(.+)$/i);
    if (option) {
      const target = collectingChoices ? sharedChoices : current?.options;
      if (!target) fail(number, "Put choices after a Question: line or a shared Choices: heading.");
      if (current && !collectingChoices && !current.ownChoices) {
        current.options = [];
        current.ownChoices = true;
      }
      const choices = collectingChoices ? sharedChoices : current.options;
      if (option[1].toUpperCase().charCodeAt(0) - 65 !== choices.length) fail(number, "Label choices in order, starting with A.");
      choices.push(option[2].trim());
      return;
    }
    const answer = line.match(/^(?:Answer|Ans|Correct\s+Answer)\s*[:.)-]\s*(.+)$/i);
    if (answer) {
      if (!current) fail(number, "Put Answer: after a Question: line.");
      if (current.answer) fail(number, "This question already has an answer.");
      current.answer = answer[1].trim();
      return;
    }
    const alternatives = line.match(/^Alternatives?\s*:\s*(.*)$/i);
    if (alternatives) {
      if (!current || part !== 2) fail(number, "Alternatives: belongs after an identification question.");
      current.alternatives = alternatives[1].split(",").map(value => value.trim().toUpperCase()).filter(Boolean);
      return;
    }
    if (collectingChoices) fail(number, "Use lettered choices, then Question: for each matching item.");
    if (current && !current.answer) current.text += " " + line;
    else { finish(); start(line, number); }
  });
  finish();
  if (!questions.length) throw new Error("No questions found in the TXT file.");
  if (collectingChoices) throw new Error("The matching choices need at least one Question: and Answer: item.");
  return questions;
}

const SECTIONS = SCHOOL_OPTIONS.section?.length ? SCHOOL_OPTIONS.section : ["A", "B", "C", "D", "E", "F"];
const SECTIONS_BY_DEPARTMENT = SCHOOL_OPTIONS.sections_by_department || {};
const SECTIONS_BY_YEAR = SCHOOL_OPTIONS.sections_by_department_and_year || {};
const YEAR_LEVELS = ["1st Year", "2nd Year", "3rd Year", "4th Year"];
function sectionsForDepartment(department, year) {
  if (year && SECTIONS_BY_YEAR[department]) return SECTIONS_BY_YEAR[department][year] || [];
  return SECTIONS_BY_DEPARTMENT[department] || (DEPARTMENTS.includes(department) ? SECTIONS : []);
}
function resultPercent(result) {
  if (result.percent !== undefined && result.percent !== null && Number.isFinite(Number(result.percent))) return Number(result.percent);
  return result.total ? Number(result.score || 0) / Number(result.total) * 100 : 0;
}
function resultGradeLabel(result) {
  return resultPercent(result) < PASSING_PERCENT ? "Failed" : "Passed";
}

function dashboardLiveActive() {

function syncDashboardLiveUpdates() {
  clearTimeout(dashboardLiveTimer);

  if (!dashboardLiveRequest) dashboardLiveTimer = setTimeout(refreshTeacherDashboard, state.dashboardLiveError ? 6000 : 3000);

async function refreshTeacherDashboard() {
  if (!dashboardLiveActive() || dashboardLiveRequest) return;
  const request = {user:state.currentUser}; dashboardLiveRequest = request;
  try {
    const exams = await apiRequest("GET", "/api/exams", undefined, adminHeaders());
    if (dashboardLiveRequest !== request || state.currentUser !== request.user || !dashboardLiveActive()) return;
    if (!Array.isArray(exams)) throw new Error("Invalid dashboard response");
    const changed = JSON.stringify(exams) !== JSON.stringify(state.exams) || !!state.dashboardLiveError;
    state.exams = exams; state.dashboardLiveError = "";
    if (changed) { const position = window.scrollY; render(); window.scrollTo({top:position, behavior:"auto"}); }
  } catch (error) {
    if (dashboardLiveRequest === request && dashboardLiveActive()) {
      state.dashboardLiveError = error.message || "Connection interrupted";
      updateTeacherNetworkStatus();
    }
  } finally {
    if (dashboardLiveRequest === request) dashboardLiveRequest = null;
    syncDashboardLiveUpdates();
  }
}

  const confirmation = prompt("Enter the new password again to confirm:");
  if (confirmation === null) return;
  if (password !== confirmation) { alert("Passwords do not match."); return; }
  try {
    await apiRequest("POST", `/api/teachers/${id}/reset-password`, { password }, adminHeaders());

  } catch (err) { alert(err.message); }

let resultsLiveTimer = null;
let resultsRefreshRequest = null;
function resultsLiveActive() {
  return !!state.currentUser && state.view === "adminResults" && !!document.querySelector(".admin-results-page") && !document.hidden && !document.querySelector('[role="dialog"]');
}
function stopResultsLiveUpdates() {
  clearTimeout(resultsLiveTimer);
  resultsLiveTimer = null;
  resultsRefreshRequest = null;
}
function syncResultsLiveUpdates() {
  clearTimeout(resultsLiveTimer);
  resultsLiveTimer = null;
  if (!resultsLiveActive()) { resultsRefreshRequest = null; return; }
  if (!resultsRefreshRequest) resultsLiveTimer = setTimeout(() => refreshAdminResults({background:true}), state.resultsLiveError ? 6000 : 3000);
}
function updateResultsLiveStatus() {
  const label = document.getElementById("resultsLiveStatus");
  if (label) {
    label.textContent = state.resultsLiveError
      ? state.resultsLiveError.startsWith("Results updated") ? "Results updated · roster retrying" : "Refresh failed · retrying automatically"
      : "Live results · updates every 3 seconds";
    label.classList.toggle("reconnecting", !!state.resultsLiveError);
  }
  const checked = document.getElementById("resultsLastChecked");
  if (checked) checked.textContent = state.resultsLastUpdated ? `Last checked ${new Date(state.resultsLastUpdated).toLocaleTimeString()}` : "Waiting for submissions…";
  const error = document.getElementById("resultsLiveError");
  if (error) { error.hidden = !state.resultsLiveError; error.textContent = state.resultsLiveError || ""; }
  const button = document.getElementById("refreshResultsButton");
  if (button) { button.disabled = !!resultsRefreshRequest; button.textContent = resultsRefreshRequest ? "Checking…" : "Refresh now"; }
}
function renderLiveResultsChange() {
  const position = {x:window.scrollX, y:window.scrollY};
  const panels = [...document.querySelectorAll('.admin-results-page details[id]')].map(panel => ({id:panel.id, open:panel.open}));
  const tables = [...document.querySelectorAll('.admin-results-page .teacher-table-wrap, .admin-results-page .table-scroll')].map(table => table.scrollLeft);
  render();
  for (const panel of panels) { const current = document.getElementById(panel.id); if (current) current.open = panel.open; }
  document.querySelectorAll('.admin-results-page .teacher-table-wrap, .admin-results-page .table-scroll').forEach((table, index) => { table.scrollLeft = tables[index] || 0; });
  window.scrollTo({left:position.x, top:position.y, behavior:"auto"});
}
async function refreshAdminResults({background = false} = {}) {
  if (!resultsLiveActive()) return;
  const examId = state.adminResultsExamId;
  if (!examId || resultsRefreshRequest?.examId === examId) return;
  const request = {examId};
  resultsRefreshRequest = request;
  clearTimeout(resultsLiveTimer);
  updateResultsLiveStatus();
  try {
    const rows = await apiRequest("GET", `/api/results?examId=${encodeURIComponent(examId)}`, undefined, adminHeaders());
    if (resultsRefreshRequest !== request || state.adminResultsExamId !== examId || !resultsLiveActive()) return;
    if (!Array.isArray(rows)) throw new Error("The results service returned an invalid response.");
    const changed = JSON.stringify(rows) !== JSON.stringify(state.currentExamResults);
    state.currentExamResults = rows;
    state.resultsLastUpdated = Date.now();
    state.resultsLiveError = "";
    if (changed) renderLiveResultsChange();
  } catch (err) {
    if (resultsRefreshRequest === request && state.adminResultsExamId === examId && resultsLiveActive()) {
      const message = err instanceof Error && err.message ? err.message : "Unknown error.";
      state.resultsLiveError = `Could not refresh results: ${message}`;
    }
  } finally {
    if (resultsRefreshRequest === request) {
      resultsRefreshRequest = null;
      if (state.view === "adminResults") updateResultsLiveStatus();
      syncResultsLiveUpdates();
    }
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopResultsLiveUpdates();
  else if (resultsLiveActive()) refreshAdminResults({background:true});
});

function blankQuestion(type = "multiple_choice") {

  return { id: "tmp_" + Math.random().toString(36).slice(2, 9), part: definition.part, type: definition.type, text: "", options: definition.type === "identification" ? [] : definition.type === "true_false" ? ["True", "False"] : ["", "", "", ""], correct: 0, answerText: "", alternatives: [] };

function groupTargetClasses(targetClasses) {
  const groups = new Map();
  for (const target of targetClasses) {
    if (!groups.has(target.department)) groups.set(target.department, {department: target.department, yearLevels: [], sections: [], sectionsByYear: {}});
    const group = groups.get(target.department);
    if (!group.sectionsByYear[target.yearLevel]) {
      group.yearLevels.push(target.yearLevel);
      group.sectionsByYear[target.yearLevel] = [];
    }
    if (!group.sectionsByYear[target.yearLevel].includes(target.section)) group.sectionsByYear[target.yearLevel].push(target.section);
  }
  return [...groups.values()].map(group => {
    group.yearLevels.sort((a, b) => YEAR_LEVELS.indexOf(a) - YEAR_LEVELS.indexOf(b));
    Object.values(group.sectionsByYear).forEach(sections => sections.sort());
    return group;
  });
}

      <fieldset class="target-choice-group"><legend>Year levels</legend><div class="target-choice-options">${YEAR_LEVELS.map((value, optionIndex) => `<label><input type="checkbox" id="target-${index}-year-${optionIndex}" ${group.yearLevels.includes(value) ? "checked" : ""} onchange="setTargetGroupSelection(${index}, 'yearLevels', '${esc(value)}', this.checked)"><span>${esc(value)}</span></label>`).join("")}</div></fieldset>
      <div class="target-year-list">${group.department && group.yearLevels.length ? group.yearLevels.map(year => `<fieldset class="target-choice-group target-year-sections" data-target-year="${esc(year)}"><legend><strong>${esc(group.department)} · ${esc(year)}</strong><span>${sectionsForDepartment(group.department, year).length} sections available</span></legend><div class="target-choice-options">${sectionsForDepartment(group.department, year).map((value, optionIndex) => `<label><input type="checkbox" id="target-${index}-year-${YEAR_LEVELS.indexOf(year)}-section-${optionIndex}" ${targetGroupSections(group, year).includes(value) ? "checked" : ""} onchange="setTargetYearSection(${index}, '${esc(year)}', '${esc(value)}', this.checked)"><span>${esc(group.department)} ${YEAR_LEVELS.indexOf(year) + 1}-${esc(value)}</span></label>`).join("")}</div></fieldset>`).join("") : `<p class="help-text">Choose a department and year level to see its sections.</p>`}</div>
      <p class="target-group-caption">Select sections separately for each year. Only the checked classes will receive this activity.</p>
    </div>`).join("")}

function targetGroupSections(group, year) {
  return group.sectionsByYear?.[year] || group.sections || [];
}
function setTargetYearSection(index, year, section, checked) {
  const group = state.draft.targetGroups[index];
  if (!group.yearLevels.includes(year) || !sectionsForDepartment(group.department, year).includes(section)) return;
  if (!group.sectionsByYear) group.sectionsByYear = Object.fromEntries(group.yearLevels.map(value => [value, [...targetGroupSections(group, value)]]));
  const selected = group.sectionsByYear[year] || [];
  group.sectionsByYear[year] = checked ? [...new Set([...selected, section])] : selected.filter(value => value !== section);

function setTargetGroupSelection(index, key, value, checked) {

    ? [...new Set([...selections, value])]
    : selections.filter(item => item !== value);
  if (key === "yearLevels") {
    const group = state.draft.targetGroups[index];
    if (group.sectionsByYear && !checked) group.sectionsByYear[value] = [];

    document.getElementById(`target-${index}-year-${YEAR_LEVELS.indexOf(value)}`)?.focus({preventScroll:true});

async function importQuestions(file) {
  if (!file) return;
  state.errorMsg = ""; state.successMsg = "";
  const draft = state.draft;
  try {
    if (!/\.txt$/i.test(file.name)) throw new Error("Choose a .txt question file.");
    if (file.size > 1024 * 1024) throw new Error("The TXT file must be 1 MB or smaller.");
    const bytes = new Uint8Array(await file.arrayBuffer());
    const encoding = bytes[0] === 255 && bytes[1] === 254 ? "utf-16le" : bytes[0] === 254 && bytes[1] === 255 ? "utf-16be" : "utf-8";
    let content;
    try { content = new TextDecoder(encoding, { fatal: true }).decode(bytes); }
    catch (error) { throw new Error("Save the question file as UTF-8 text and upload it again."); }
    const imported = parseExamText(content).map(q => ({...q, id: "tmp_" + crypto.getRandomValues(new Uint32Array(4)).join("_")}));
    if (state.draft !== draft || state.view !== "createExam") return;
    draft.questions = imported;
    draft.expandedQuestionId = imported[0].id;
    draft.importFileName = file.name;
    state.successMsg = `${imported.length} items loaded from ${file.name}. Review the questions before publishing.`;
  } catch (error) {
    if (state.draft !== draft || state.view !== "createExam") return;
    state.errorMsg = error.message;
  }
  render();
}

async function signInForPublishing() {
  if (state.publishSigningIn) return;
  const username = (document.getElementById("publishTeacherUsername")?.value || "").trim();
  const password = document.getElementById("publishTeacherPassword")?.value || "";

    if (account.role !== "teacher") throw new Error("Use your teacher account here. Your questions are still saved in this page.");
    if (owner && account.username !== owner) throw new Error(`Sign in as ${owner} to publish this assessment. Your questions are still here.`);
    state.currentUser = {role:account.role, username:account.username, name:account.name, department:account.department || "ALL", departments:account.departments || []};
    state.publishAuthRequired = false;

    render();
    document.querySelector("[data-publish-activity]")?.focus();
  } catch (error) {
    state.errorMsg = error.message || "Teacher sign-in failed. Your questions are still here.";
    render();
  } finally { state.publishSigningIn = false; }
}
async function saveExam() {
  if (state.savingActivity) return;
  const d = state.draft;
  if (!d.title.trim()) { state.errorMsg = "Please enter an exam title."; render(); return; }
  if (!d.duration || d.duration < 1) { state.errorMsg = "Duration must be at least 1 minute."; render(); return; }
  if (!d.subject.trim()) { state.errorMsg = "Please enter the subject."; render(); return; }
  if (!Array.isArray(d.targetGroups) || !d.targetGroups.length) { state.errorMsg = "Add at least one department."; render(); return; }
  const targetClasses = [];
  const targetKeys = new Set();
  for (const group of d.targetGroups) {
    if (!DEPARTMENTS.includes(group.department) || !group.yearLevels.length || group.yearLevels.some(year => !targetGroupSections(group, year).length)) { state.errorMsg = "Choose a department and at least one year level and section for every department."; render(); return; }
    if (group.yearLevels.some(year => !YEAR_LEVELS.includes(year) || targetGroupSections(group, year).some(section => !sectionsForDepartment(group.department, year).includes(section)))) { state.errorMsg = "Choose sections available in the selected department and year level."; render(); return; }
    for (const yearLevel of group.yearLevels) {
      for (const section of targetGroupSections(group, yearLevel)) {
        const key = `${group.department}|${yearLevel}|${section}`;
        if (targetKeys.has(key)) { state.errorMsg = "The same department, year, and section is selected more than once."; render(); return; }
        targetKeys.add(key);
        targetClasses.push({department: group.department, yearLevel, section});
      }
    }
  }
  if (targetClasses.length > 120) { state.errorMsg = "This activity has more than 120 target classes. Remove some year or section selections."; render(); return; }
  if (d.questions.length === 0) { state.errorMsg = "Add at least one question."; render(); return; }
  for (let i = 0; i < d.questions.length; i++) {
    const q = d.questions[i];
    if (!q.text.trim()) { state.errorMsg = `Question ${i + 1} needs question text.`; render(); return; }
    if (q.type === "identification" && !(q.answerText || "").trim()) { state.errorMsg = `Question ${i + 1} needs a correct answer.`; render(); return; }
    if (["multiple_choice", "matching"].includes(q.type) && q.options.some(o => !o.trim())) { state.errorMsg = `Question ${i + 1} needs all choices filled in.`; render(); return; }
    if (q.type !== "identification" && (!Number.isInteger(q.correct) || q.correct < 0 || q.correct >= q.options.length)) { state.errorMsg = `Question ${i + 1} needs a correct option.`; render(); return; }
  }
  const payload = {
    title: d.title.trim(), activityType: d.activityType || "exam", duration: d.duration,
    expectedTeacherUsername: state.currentUser?.username,
    targetClasses,
    subject: d.subject.trim(),
    questions: d.questions.map(q => ({ part: q.part, type: q.type, text: q.text.trim(), options: q.options.map(o => o.trim()), correct: q.correct, answerText: q.answerText.trim(), alternatives: q.alternatives }))
  };
  state.savingActivity = true;
  document.querySelectorAll("[data-publish-activity]").forEach(button => { button.disabled = true; button.setAttribute("aria-busy", "true"); });
  try {
    if (state.editingExamId) {
      await apiRequest("PUT", `/api/exams/${state.editingExamId}`, payload, adminHeaders());
    } else {
      await apiRequest("POST", "/api/exams", payload, adminHeaders());
    }
    state.editingExamId = null;
    state.publishAuthRequired = false;
    await goAdminHome();
  } catch (err) {
    state.errorMsg = err.message;
    if (err.status === 401 || ["staff_session_expired", "teacher_required", "teacher_account_changed"].includes(err.code)) state.publishAuthRequired = true;
    render();
    if (state.publishAuthRequired) document.getElementById("publishTeacherUsername")?.focus();
  }
  finally {
    state.savingActivity = false;
    document.querySelectorAll("[data-publish-activity]").forEach(button => { button.disabled = false; button.removeAttribute("aria-busy"); });
  }
}

function compareStudentNames(first, second) {
  const splitName = value => {
    const parts = String(value || "").split(",");
    return {
      lastName: (parts[0] || "").trim(),
      givenName: parts.slice(1).join(",").trim()
    };
  };
  const firstName = splitName(first);
  const secondName = splitName(second);
  return firstName.lastName.localeCompare(secondName.lastName, undefined, { sensitivity: "base" }) ||
    firstName.givenName.localeCompare(secondName.givenName, undefined, { sensitivity: "base" });
}

  const exam = state.exams.find(item => item.id === state.adminResultsExamId);
  const classes = new Map();
  for (const target of [...(exam?.targetClasses || []), ...state.currentExamResults]) {
    const key = JSON.stringify([target.department, target.yearLevel, target.section]);
    if (!classes.has(key)) classes.set(key, {department: target.department, yearLevel: target.yearLevel, section: target.section});
  }
  return [...classes.values()];
}
function renderClassProgress() {
  const classes = examResultClasses();
  if (!classes.length) return "";
  const rows = classes.map(target => {
    const matches = item => item.department === target.department && (item.yearLevel || item.year_level || "") === target.yearLevel && item.section === target.section;
    const submitted = new Set(state.currentExamResults.filter(matches).map(item => item.rollNo));
    const roster = new Set(state.students.filter(matches).map(item => item.roll_no));
    const pending = [...roster].filter(id => !submitted.has(id)).length;
    const total = new Set([...roster, ...submitted]).size;
    return `<tr><td>${esc(target.department)} · ${esc(target.yearLevel || "Unknown year")} · Section ${esc(target.section)}</td><td>${total}</td><td>${submitted.size}</td><td>${pending}</td></tr>`;
  }).join("");
  return `<details id="classProgressPanel" class="teacher-panel class-progress" open><summary class="panel-heading"><h3>Class submissions</h3><span class="count-label">${classes.length} ${classes.length === 1 ? "class" : "classes"}</span></summary><div class="teacher-table-wrap"><table class="teacher-record-table"><thead><tr><th>Class</th><th>Students</th><th>Submitted</th><th>Awaiting submission</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}
function groupResultsBySection(results) {
  const grouped = new Map();
  results.forEach(result => {
    const department = result.department || "Unassigned department";
    const yearLevel = result.yearLevel || "All years";
    const section = result.section || "Unassigned";
    const key = JSON.stringify([department, yearLevel, section]);
    if (!grouped.has(key)) grouped.set(key, { department, yearLevel, section, results: [] });
    grouped.get(key).results.push(result);
  });
  const sectionOrder = new Map(SECTIONS.map((section, index) => [section, index]));
  return [...grouped.values()]
    .sort((first, second) =>
      first.department.localeCompare(second.department) ||
      first.yearLevel.localeCompare(second.yearLevel) ||
      (sectionOrder.get(first.section) ?? SECTIONS.length) - (sectionOrder.get(second.section) ?? SECTIONS.length) ||
      first.section.localeCompare(second.section)
    )
    .map(group => ({
      ...group,
      label: `${group.department} · ${group.yearLevel} · ${group.section === "Unassigned" ? "Unassigned section" : `Section ${group.section}`}`,
      results: group.results.sort((first, second) =>
        compareStudentNames(first.name, second.name) || String(first.rollNo).localeCompare(String(second.rollNo))
      )
    }));
}
function resultsExportScope(includeAll) {
  if (includeAll) return "All departments · All years · All sections";
  return `${state.resultsDeptFilter || "All departments"} · ${state.resultsYearFilter || "All years"} · ${state.resultsSectionFilter ? `Section ${state.resultsSectionFilter}` : "All sections"}`;
}
function downloadSelectedResults() {
  const format = document.getElementById("resultsExportFormat")?.value;
  const includeAll = document.getElementById("resultsExportScope")?.value === "all";
  const results = includeAll ? state.currentExamResults : filteredExamResults();
  const status = document.getElementById("resultsExportStatus");
  if (!results.length) {
    if (status) status.textContent = "No submitted results match the selected filters.";
    return;
  }
  try {
    const downloaded = format === "excel" ? downloadResultsExcel(includeAll) : downloadResultsPdf(includeAll);
    if (status) status.textContent = downloaded
      ? `Report downloaded: ${resultsExportScope(includeAll)} · ${format === "excel" ? "Excel" : "PDF"}.`
      : `Could not create the ${format === "excel" ? "Excel" : "PDF"} report. Check that the report library is available and try again.`;
  } catch (err) {
    if (status) status.textContent = `Report download failed: ${err instanceof Error ? err.message : "Unexpected error."}`;
  }
}
function resultsExportFilename(title, scope, extension) {
  const safePart = value => value.replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, "").slice(0, 40);
  return `${safePart(title) || "exam"}_${safePart(scope) || "all_results"}_results.${extension}`;
}
function downloadResultsExcel(includeAll = false) {
  const results = includeAll ? state.currentExamResults : filteredExamResults();
  if (!results.length || !window.XLSX?.utils || !window.XLSX.writeFile) return false;
  const title = results[0].examTitle || "exam";
  const workbook = XLSX.utils.book_new();
  const columnWidths = [{ wch: 6 }, { wch: 24 }, { wch: 20 }, { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 18 }, { wch: 8 }, { wch: 20 }, { wch: 14 }, { wch: 18 }, { wch: 14 }];
  const usedSheetNames = new Set();
  groupResultsBySection(results).forEach(group => {
    const rows = group.results.map((result, index) => ({
      "Rank": index + 1,
      "Student Name": result.name,
      "ID Number": result.rollNo,
      "Department": result.department || "",
      "Year Level": result.yearLevel || "",
      "Section": result.section ? `${result.department}-${result.section}` : "",
      "Score (points)": result.score,
      "Total points": result.total,
      "Percentage": `${resultPercent(result).toFixed(1)}%`,
      "Grade status": resultGradeLabel(result),
      "Scoring": assessmentScoringLabel(result),
      "Time Taken (mm:ss)": fmtTime(result.timeTakenSec),
      "Submitted At": new Date(result.submittedAt).toLocaleString(),
      "Auto-submitted": result.autoSubmitted ? "Yes" : "No"
    }));
    const worksheet = XLSX.utils.json_to_sheet(rows);
    worksheet["!cols"] = columnWidths;
    const range = { s: { r: 0, c: 0 }, e: { r: rows.length, c: columnWidths.length - 1 } };
    const border = {
      top: { style: "thin", color: { rgb: "D9E2EC" } },
      bottom: { style: "thin", color: { rgb: "D9E2EC" } },
      left: { style: "thin", color: { rgb: "D9E2EC" } },
      right: { style: "thin", color: { rgb: "D9E2EC" } }
    };
    for (let row = range.s.r; row <= range.e.r; row++) {
      for (let column = range.s.c; column <= range.e.c; column++) {
        const address = XLSX.utils.encode_cell({ r: row, c: column });
        const cell = worksheet[address];
        if (!cell) continue;
        cell.s = row === 0
          ? {
            fill: { fgColor: { rgb: "182B45" } },
            font: { bold: true, color: { rgb: "FFFFFF" } },
            alignment: { vertical: "center", horizontal: "center" },
            border: { ...border, bottom: { style: "medium", color: { rgb: "1F857E" } } }
          }
          : {
            fill: { fgColor: { rgb: row % 2 === 0 ? "EAF5F4" : "FFFFFF" } },
            alignment: { vertical: "center" },
            border
          };
      }
    }
    worksheet["!autofilter"] = { ref: XLSX.utils.encode_range(range) };
    worksheet["!rows"] = [{ hpt: 28 }];
    const baseSheetName = `${group.department}-${group.yearLevel}-${group.section}`
      .replace(/[\\/*?:\[\]]/g, "_")
      .replace(/[\u0000-\u001f]/g, "_")
      .replace(/^'+|'+$/g, "")
      .slice(0, 31) || "Results";
    let sheetName = baseSheetName;
    let suffix = 2;
    while (usedSheetNames.has(sheetName.toLowerCase())) {
      const suffixText = `_${suffix++}`;
      sheetName = `${baseSheetName.slice(0, 31 - suffixText.length)}${suffixText}`;
    }
    usedSheetNames.add(sheetName.toLowerCase());
    XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
  });
  XLSX.writeFile(workbook, resultsExportFilename(title, resultsExportScope(includeAll), "xlsx"));
  return true;
}
function downloadResultsPdf(includeAll = false) {
  const selectedResults = includeAll ? state.currentExamResults : filteredExamResults();
  if (!selectedResults.length || !window.jspdf || !window.jspdf.jsPDF) return false;
  const groups = groupResultsBySection(selectedResults);
  const sorted = groups.flatMap(group => group.results);
  const title = sorted[0].examTitle || "Exam Results";
  const scope = resultsExportScope(includeAll);
  const average = sorted.reduce((sum, result) => sum + Number(result.score || 0), 0) / sorted.length;
  const topScore = Math.max(...sorted.map(result => Number(result.score || 0)));
  const totalPoints = sorted[0].total || 0;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const pageWidth = doc.internal.pageSize.getWidth();
  const navy = [24, 43, 69];

  doc.setFillColor(...navy);
  doc.rect(0, 0, pageWidth, 30, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.text("EXAM RESULTS", 16, 11);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(12);
  doc.text(title, 16, 23, { maxWidth: pageWidth - 32 });
  doc.setTextColor(92, 109, 125);
  doc.setFontSize(12);
  doc.text(`Generated ${new Date().toLocaleString()}  |  ${scope}`, pageWidth - 16, 23, { align: "right", maxWidth: pageWidth - 100 });
  const statY = 41;
  const statWidth = (pageWidth - 32 - 8) / 3;
  [["ATTEMPTS", String(sorted.length)], ["AVERAGE SCORE", `${average.toFixed(1)} / ${totalPoints}`], ["TOP SCORE", `${topScore} / ${totalPoints}`]].forEach((stat, index) => {
    const x = 16 + index * (statWidth + 4);
    doc.setFillColor(244, 247, 249);
    doc.roundedRect(x, statY, statWidth, 15, 2, 2, "F");
    doc.setTextColor(...teal);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text(stat[0], x + 5, statY + 6);
    doc.setTextColor(...navy);
    doc.setFontSize(12);
    doc.text(stat[1], x + 5, statY + 12);
  });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(8);
  doc.text(assessmentScoringLabel(sorted[0]), 16, 62, { maxWidth: pageWidth - 32 });
  let cursorY = 70;
  groups.forEach(group => {
    if (cursorY > 160) {
      doc.addPage();
      cursorY = 18;
    }
    doc.setTextColor(...navy);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.text(group.label.toUpperCase(), 16, cursorY);
    doc.autoTable({
      startY: cursorY + 3,
      pageBreak: "avoid",
      margin: { left: 16, right: 16 },
      head: [["#", "Student", "ID Number", "Department", "Section", "Score (points)", "Percentage", "Grade status", "Time taken", "Submitted"]],
      body: group.results.map((result, index) => [
        index + 1, result.name, result.rollNo, result.department || "-", result.section ? `${result.department}-${result.section}` : "-", `${result.score} / ${result.total}`,
        `${resultPercent(result).toFixed(1)}%`, resultGradeLabel(result), fmtTime(result.timeTakenSec), new Date(result.submittedAt).toLocaleString()
      ]),
      theme: "grid",
      styles: { font: "helvetica", fontSize: 7.5, cellPadding: 2.2, textColor: [45, 58, 70], lineColor: [220, 226, 231], lineWidth: 0.15, valign: "middle" },
      headStyles: { fillColor: navy, textColor: [255, 255, 255], fontStyle: "bold", fontSize: 7.5, cellPadding: 2.5, halign: "left" },
      alternateRowStyles: { fillColor: [247, 250, 251] },
      columnStyles: { 0: { cellWidth: 10, halign: "center" }, 5: { halign: "center" }, 6: { halign: "center" }, 7: { halign: "center" }, 8: { halign: "center" } },
      didDrawPage: data => {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(130, 141, 151);
        doc.text("AbieksExamSys", 16, doc.internal.pageSize.getHeight() - 9);
        doc.text(`Page ${data.pageNumber}`, pageWidth - 16, doc.internal.pageSize.getHeight() - 9, { align: "right" });
      }
    });
    cursorY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : cursorY + 12) + 8;
  });
  doc.save(resultsExportFilename(title, scope, "pdf"));
  return true;
}
