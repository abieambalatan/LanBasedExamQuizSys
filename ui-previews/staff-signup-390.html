function esc(str) {
   if (str === null || str === undefined) return "";
   return String(str).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
   }[ch]));
}

function fmtTime(totalSeconds) {
   const s = Math.max(0, Math.floor(totalSeconds || 0));
   const m = Math.floor(s / 60);
   const sec = s % 60;
   return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

function userInitials(name) {
   return String(name || "A").trim().split(/\s+/).slice(0, 2).map(word => word[0]).join("").toUpperCase();
}

function answeredQuestionCount(runtime) {
   return runtime.exam.questions.filter(question => {
      const value = runtime.answers[question.id];
      return value !== undefined && value !== null && String(value).trim() !== "";
   }).length;
}

async function openWorkspaceSection(section) {
   const student = state.currentUser?.role === "student" || !state.currentUser?.role;
   state.workspaceSection = section;
   if (student && state.view !== "studentHome") await goStudentHome();
   else if (!student && state.view !== "adminHome") await goAdminHome();
   else render();
   const target = document.getElementById(section);
   if (section === "students") target?.querySelector("details")?.setAttribute("open", "");
   target?.scrollIntoView({ behavior: "smooth", block: "start" });
}

function setActivityFilter(type, button) {
   state.activityFilter = type;
   document.querySelectorAll(".activity-tabs button").forEach(item => { item.classList.toggle("active", item === button); item.setAttribute("aria-pressed", item === button ? "true" : "false"); });
   document.querySelector(".activity-toolbar").dataset.filter = type;
   filterActivityCards();
}

function filterActivityCards() {
   const query = (document.getElementById("activitySearch")?.value || "").trim().toLowerCase();
   state.activityQuery = document.getElementById("activitySearch")?.value || "";
   const type = document.querySelector(".activity-toolbar")?.dataset.filter || "all";
   let visible = 0;
   document.querySelectorAll(".exam-row[data-activity]").forEach(card => {
      card.hidden = !(card.dataset.search.includes(query) && (type === "all" || card.dataset.activity === type));
      if (!card.hidden) visible++;
   });
   const empty = document.getElementById("activityNoMatches");
   if (empty) empty.hidden = visible > 0;
   const count = document.getElementById("activitySearchCount");
   if (count) count.textContent = `${visible} ${visible === 1 ? "assessment" : "assessments"} shown`;
}

// Preserve entries when validation redraws the same authentication screen.
// Passwords remain only in the current page's memory, never in browser storage.
function captureInterfaceState() {
   const app = document.getElementById("app");
   return {
      view: app.dataset.view,
      focusId: document.activeElement?.id,
      fields: Array.from(app.querySelectorAll(".auth-form-area input[id], .auth-form-area select[id]"), field => ({
         id: field.id, value: field.value,
         selected: field.multiple ? Array.from(field.selectedOptions, option => option.value) : null,
      })),
   };
}

function refreshMultiSelect(select) {
   select.parentElement.querySelector(`[data-select-id="${select.id}"]`)?.remove();
   const label = select.closest(".field")?.querySelector("label");
   if (label && !label.id) label.id = `${select.id}-label`;
   const group = document.createElement("div");
   group.className = "choice-list";
   group.dataset.selectId = select.id;
   group.setAttribute("role", "group");
   if (label) group.setAttribute("aria-labelledby", label.id);
   const options = Array.from(select.options).filter(option => option.value);
   if (!options.length) {
      const message = document.createElement("p");
      message.className = "help-text";
      message.textContent = select.options[0]?.textContent || "No options available.";
      group.append(message);
   }
   for (const option of options) {
      const item = document.createElement("label");
      item.className = "choice-item";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = option.selected;
      checkbox.disabled = select.disabled || option.disabled;
      checkbox.addEventListener("change", () => {
         option.selected = checkbox.checked;
         select.dispatchEvent(new Event("change", { bubbles: true }));
      });
      const text = document.createElement("span");
      text.textContent = option.textContent;
      item.append(checkbox, text);
      group.append(item);
   }
   select.hidden = true;
   select.after(group);
}

function enhanceInterface(previous) {
   const app = document.getElementById("app");
   if (previous?.view === state.view) {
      for (const saved of previous.fields) {
         const field = document.getElementById(saved.id);
         if (!field) continue;
         if (saved.selected) Array.from(field.options).forEach(option => { option.selected = saved.selected.includes(option.value); });
         else field.value = saved.value;
      }
   }
   app.dataset.view = state.view;
   app.querySelectorAll(".field").forEach((field, index) => {
      const control = field.querySelector("input, select, textarea");
      const label = field.querySelector("label");
      if (control && label && !label.contains(control)) {
         if (!control.id) control.id = `field-${index}`;
         label.htmlFor = control.id;
         const hint = field.querySelector(".help-text");
         if (hint) { hint.id = `${control.id}-hint`; control.setAttribute("aria-describedby", hint.id); }
      }
   });
   app.querySelectorAll('input[type="password"]').forEach(input => {
      const wrapper = document.createElement("div");
      wrapper.className = "password-field";
      input.before(wrapper);
      wrapper.append(input);
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "password-toggle";
      toggle.textContent = "Show";
      toggle.setAttribute("aria-controls", input.id);
      toggle.setAttribute("aria-pressed", "false");
      toggle.setAttribute("aria-label", `Show ${input.closest(".field")?.querySelector("label")?.textContent.toLowerCase() || "password"}`);
      toggle.addEventListener("click", () => {
         const show = input.type === "password";
         input.type = show ? "text" : "password";
         toggle.textContent = show ? "Hide" : "Show";
         toggle.setAttribute("aria-pressed", String(show));
         toggle.setAttribute("aria-label", `${show ? "Hide" : "Show"} ${input.closest(".field")?.querySelector("label")?.textContent.toLowerCase() || "password"}`);
      });
      wrapper.append(toggle);
   });
   app.querySelectorAll("select[multiple]").forEach(refreshMultiSelect);
   app.querySelectorAll(".opt-row").forEach(row => {
      const letter = row.querySelector(".opt-label")?.textContent || "";
      row.querySelector('input[type="text"]')?.setAttribute("aria-label", `Option ${letter}`);
      row.querySelector('input[type="radio"]')?.setAttribute("aria-label", `Mark option ${letter} as correct`);
   });
   app.querySelectorAll(".banner, .conn-banner").forEach(banner => {
      banner.setAttribute("role", banner.classList.contains("success") ? "status" : "alert");
   });
   app.querySelectorAll("th").forEach(header => { header.scope = "col"; });
   app.querySelectorAll(".teacher-table-wrap, .table-scroll").forEach(wrapper => {
      wrapper.tabIndex = 0;
      wrapper.setAttribute("role", "region");
      wrapper.setAttribute("aria-label", "Directory table. Scroll horizontally to see all columns.");
   });
   if (document.getElementById("activitySearch")) filterActivityCards();
   const modal = app.querySelector('[role="dialog"]');
   document.body.classList.toggle("modal-open", !!modal);
   if (modal) modal.querySelector("button")?.focus();
   else if (state.errorMsg) {
      const alert = app.querySelector('[role="alert"]');
      if (alert) { alert.tabIndex = -1; alert.focus(); }
   } else if (previous?.view === state.view && previous.focusId) document.getElementById(previous.focusId)?.focus({ preventScroll: true });
}

function renderDirectoryTools(id, placeholder) {
   return `<div class="table-tools"><label class="activity-search">${uiIcon("search")}<span class="sr-only">${esc(placeholder)}</span><input type="search" placeholder="${esc(placeholder)}" oninput="filterDirectory(this, '${id}')"></label><p id="${id}-status" class="search-count" role="status"></p><p class="table-scroll-hint">Scroll sideways to see all columns.</p></div>`;
}

function filterDirectory(input, directoryId) {
   const directory = document.getElementById(directoryId);
   if (!directory) return;
   const query = input.value.trim().toLowerCase();
   let count = 0;
   directory.querySelectorAll("tbody tr").forEach(row => {
      row.hidden = !row.textContent.toLowerCase().includes(query);
      if (!row.hidden) count++;
   });
   const status = document.getElementById(`${directoryId}-status`);
   if (status) status.textContent = count ? `${count} ${count === 1 ? "record" : "records"} shown` : "No matching records. Try another name or ID.";
}

async function submitAuthForm(form, action) {
   if (form.getAttribute("aria-busy") === "true") return;
   form.setAttribute("aria-busy", "true");
   const button = form.querySelector('button[type="submit"]');
   const label = button.textContent;
   button.disabled = true;
   button.textContent = "Please wait...";
   try { await action(); }
   finally {
      form.removeAttribute("aria-busy");
      button.disabled = false;
      button.textContent = label;
   }
}

document.addEventListener("keydown", event => {
   const modal = document.querySelector('[role="dialog"]');
   if (!modal) return;
   if (event.key === "Escape") { event.preventDefault(); closeModal(); }
   if (event.key === "Tab") {
      const buttons = Array.from(modal.querySelectorAll("button:not(:disabled)"));
      const first = buttons[0], last = buttons[buttons.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
   }
});

let _csrfToken = null;
let _csrfLoading = null;

async function getCsrfToken() {
   if (_csrfToken) return _csrfToken;
   if (!_csrfLoading) {
      _csrfLoading = (async () => {
         try {
            const response = await fetch("/api/csrf", { credentials: "same-origin", cache: "no-store" });
            const data = await response.json();
            if (!response.ok || typeof data.csrfToken !== "string") throw new Error("Could not initialize a secure request. Refresh the page and try again.");
            _csrfToken = data.csrfToken;
            return _csrfToken;
         } catch (error) {
            if (error instanceof TypeError) throw new Error("Could not reach the server. Check your connection and try again.");
            throw error;
         } finally { _csrfLoading = null; }
      })();
   }
   return _csrfLoading;
}

async function apiRequest(method, path, body, extraHeaders) {
   const headers = Object.assign({ "Content-Type": "application/json" }, extraHeaders || {});
   if (!["GET", "HEAD", "OPTIONS"].includes(method)) headers["X-CSRFToken"] = await getCsrfToken();
   const opts = { method, headers, credentials: "same-origin" };
   if (body !== undefined) opts.body = JSON.stringify(body);

   // Only keyed submissions are safe to resend after a lost response.
   const attempts = method === "POST" && path === "/api/results" && body?.submissionId ? 4 : 1;
   for (let attempt = 0; attempt < attempts; attempt++) {
      try {
         const res = await fetch(path, opts);
         let data = null;
         try { data = await res.json(); } catch (e) { data = null; }
         if (res.ok && data !== null) {
            if (path.endsWith("/login") || path === "/api/logout") _csrfToken = null;
            return data;
         }
         if (res.status === 403) _csrfToken = null;
         const error = new Error((data && data.error) || `Request failed (${res.status}).`);
         error.retryable = [502, 503, 504].includes(res.status) || (res.ok && data === null);
         throw error;
      } catch (err) {
         const retryable = err instanceof TypeError || err.retryable;
         if (!retryable || attempt === attempts - 1) {
            if (err instanceof TypeError) throw new Error("Could not reach the server. Check your connection and try again.");
            throw err;
         }
         await new Promise(resolve => setTimeout(resolve, 1000 * (2 ** attempt) + Math.random() * 500));
      }
   }
}

let _modal = null;

function showModal(opts) {
   _modal = {
      title: opts.title || "",
      message: opts.message || "",
      confirmLabel: opts.confirmLabel || "OK",
      cancelLabel: opts.cancelLabel || null,
      onConfirm: typeof opts.onConfirm === "function" ? opts.onConfirm : null,
   };
   if (typeof render === "function") render();
}

function closeModal() {
   _modal = null;
   if (typeof render === "function") render();
}

function _modalConfirm() {
   const cb = _modal && _modal.onConfirm;
   _modal = null;
   if (cb) cb();
   else if (typeof render === "function") render();
}

function renderModalHtml() {
   if (!_modal) return "";
   return `
   <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal-box" role="dialog" aria-modal="true" ${_modal.title ? 'aria-labelledby="dialogTitle"' : 'aria-label="Notification"'}>
         ${_modal.title ? `<h3 id="dialogTitle">${esc(_modal.title)}</h3>` : ""}
         ${_modal.message ? `<p>${esc(_modal.message)}</p>` : ""}
         <div class="modal-actions">
            ${_modal.cancelLabel ? `<button class="btn secondary" onclick="closeModal()">${esc(_modal.cancelLabel)}</button>` : ""}
            <button class="btn" onclick="_modalConfirm()">${esc(_modal.confirmLabel)}</button>
         </div>
      </div>
   </div>`;
}

/* TXT question format shared by the upload preview and question editor. */
const EXAM_PARTS = [
  { part: 1, type: "multiple_choice", label: "Multiple Choice" },
  { part: 2, type: "identification", label: "Identification" },
  { part: 3, type: "true_false", label: "True or False" },
  { part: 4, type: "matching", label: "Matching Type" },
];

function parseExamText(input) {
  if (typeof input !== "string" || !input.trim()) throw new Error("The TXT file is empty.");
  const questions = [];
  let part = 1;
  let current = null;
  let sharedChoices = [];
  let collectingChoices = false;
  const typeNames = {
    multiplechoice: 1, identification: 2, truefalse: 3, trueorfalse: 3,
    matching: 4, matchingtype: 4,
  };
  const fail = (line, message) => { throw new Error(`Line ${line}: ${message}`); };

  function finish() {
    if (!current) return;
    const q = current;
    if (!q.text.trim()) fail(q.line, "Question text is missing.");
    if (!q.answer) fail(q.line, "Add an Answer: line for this question.");
    const definition = EXAM_PARTS[part - 1];
    let options = q.options;
    let correct = 0;
    let answerText = "";
    if (definition.type === "identification") {
      if (options.length) fail(q.line, "Identification questions use Answer: text, without choices.");
      answerText = q.answer.toUpperCase();
    } else if (definition.type === "true_false") {
      if (options.length && (options.length !== 2 || options[0].toLowerCase() !== "true" || options[1].toLowerCase() !== "false")) {
        fail(q.line, "True or False choices must be A. True and B. False, or omit the choices.");
      }
      options = ["True", "False"];
      const answer = q.answer.toUpperCase();
      if (!["TRUE", "FALSE", "T", "F", "A", "B"].includes(answer)) fail(q.line, "Use Answer: True or Answer: False.");
      correct = ["TRUE", "T", "A"].includes(answer) ? 0 : 1;
    } else {
      if (definition.type === "multiple_choice" && options.length !== 4) fail(q.line, "Multiple choice needs four choices, A-D.");
      if (definition.type === "matching" && (options.length < 2 || options.length > 26)) fail(q.line, "Matching Type needs 2-26 choices, or a shared Choices: list.");
      const letter = q.answer.toUpperCase();
      correct = /^[A-Z]$/.test(letter) ? letter.charCodeAt(0) - 65 : -1;
      if (correct < 0 || correct >= options.length) fail(q.line, "Answer must be a letter from this question's choices.");
    }
    questions.push({
      part, type: definition.type, text: q.text.trim(), options, correct,
      answerText, alternatives: q.alternatives,
    });
    current = null;
  }

  function start(text, line) {
    current = { text, line, answer: "", alternatives: [], options: part === 4 ? sharedChoices.slice() : [], ownChoices: false };
  }

  input.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n").split("\n").forEach((raw, index) => {
    const line = raw.trim();
    const number = index + 1;
    if (!line) return;
    const heading = line.match(/^\[?\s*Part\s+(\d+|IV|III|II|I)\b.*?\]?$/i);
    const bareType = typeNames[line.replace(/[\s_\-\[\]:/]/g, "").toLowerCase()];
    if (heading || bareType) {
      finish();
      const roman = { I: 1, II: 2, III: 3, IV: 4 };
      const next = heading ? (roman[heading[1].toUpperCase()] || Number(heading[1])) : bareType;
      if (next < 1 || next > 4) fail(number, "Only Parts 1-4 are supported.");
      part = next;
      sharedChoices = [];
      collectingChoices = false;
      return;
    }
    const typeLine = line.match(/^Type\s*:\s*(.+)$/i);
    if (typeLine) {
      finish();
      const next = typeNames[typeLine[1].replace(/[\s_\-/]/g, "").toLowerCase()];
      if (!next) fail(number, "Unknown question type.");
      part = next;
      collectingChoices = false;
      return;
    }
    if (/^(Choices|Column\s+B)\s*:\s*$/i.test(line)) {
      finish();
      if (part !== 4) fail(number, "Shared Choices: lists belong in Part 4 - Matching Type.");
      sharedChoices = [];
      collectingChoices = true;
      return;
    }
    const question = line.match(/^(?:Question\s*:\s*|\d+\s*[.)-]\s*)(.+)$/i);
    if (question) {
      finish();
      start(question[1], number);
      collectingChoices = false;
      return;
    }
    const option = line.match(/^([A-Z])\s*[.)]\s*(.+)$/i);
    if (option) {
      const target = collectingChoices ? sharedChoices : current?.options;
      if (!target) fail(number, "Put choices after a Question: line or a shared Choices: heading.");
      if (current && !collectingChoices && !current.ownChoices) {
        current.options = [];
        current.ownChoices = true;
      }
      const choices = collectingChoices ? sharedChoices : current.options;
      if (option[1].toUpperCase().charCodeAt(0) - 65 !== choices.length) fail(number, "Label choices in order, starting with A.");
      choices.push(option[2].trim());
      return;
    }
    const answer = line.match(/^(?:Answer|Ans|Correct\s+Answer)\s*[:.)-]\s*(.+)$/i);
    if (answer) {
      if (!current) fail(number, "Put Answer: after a Question: line.");
      if (current.answer) fail(number, "This question already has an answer.");
      current.answer = answer[1].trim();
      return;
    }
    const alternatives = line.match(/^Alternatives?\s*:\s*(.*)$/i);
    if (alternatives) {
      if (!current || part !== 2) fail(number, "Alternatives: belongs after an identification question.");
      current.alternatives = alternatives[1].split(",").map(value => value.trim().toUpperCase()).filter(Boolean);
      return;
    }
    if (collectingChoices) fail(number, "Use lettered choices, then Question: for each matching item.");
    if (current && !current.answer) current.text += " " + line;
    else { finish(); start(line, number); }
  });
  finish();
  if (!questions.length) throw new Error("No questions found in the TXT file.");
  if (collectingChoices) throw new Error("The matching choices need at least one Question: and Answer: item.");
  return questions;
}

async function resetTeacherPassword(id, name) {
  const password = prompt(`Set a new password for ${name}:`);
  if (password === null) return;
  if (password.length < 4) { alert("Password must be at least 4 characters."); return; }
  const confirmation = prompt("Enter the new password again to confirm:");
  if (confirmation === null) return;
  if (password !== confirmation) { alert("Passwords do not match."); return; }
  try {
    await apiRequest("POST", `/api/teachers/${id}/reset-password`, { password }, adminHeaders());
    alert(`Password reset successfully for ${name}. Please provide the new password to the teacher securely.`);
  } catch (err) { alert(err.message); }
}
async function resetStudentPassword(studentId) {
  const student = state.students.find(item => item.id === studentId);
  if (!student) return;
  const password = prompt(`Set a new password for ${student.name} (${student.roll_no}):`);
  if (password === null) return;
  if (password.length < 4) { alert("Password must be at least 4 characters."); return; }
  const confirmation = prompt("Enter the new password again to confirm:");
  if (confirmation === null) return;
  if (password !== confirmation) { alert("Passwords do not match."); return; }
  try {
    await apiRequest("POST", `/api/students/${encodeURIComponent(studentId)}/reset-password`, { password }, adminHeaders());

/* ---- EDIT EXAM ---- */
async function startEditExam(id) {
  state.errorMsg = "";
  try {
    const exam = await apiRequest("GET", `/api/exams/${id}`, undefined, adminHeaders());
    state.draft = {
      title: exam.title || "",
      activityType: exam.activityType || "exam",
      duration: exam.duration || 30,
      departments: Array.isArray(exam.departments) && exam.departments.length ? exam.departments.slice() : [exam.department || "BSIT"],
      yearLevel: exam.yearLevel || "1st Year",
      subject: exam.subject || "",
      sectionScope: exam.sectionScope || "ALL",
      questions: (exam.questions || []).map(q => ({
        id: "tmp_" + Math.random().toString(36).slice(2, 9),
        part: q.part || (q.type === "identification" ? 2 : 1),
        type: q.type || "multiple_choice",
        text: q.text || "",
        options: Array.isArray(q.options) ? q.options.slice() : ["", "", "", ""],
        correct: typeof q.correct === "number" ? q.correct : 0,
        answerText: q.answerText || "",
        alternatives: Array.isArray(q.alternatives) ? q.alternatives.slice() : []
      })),
      expandedQuestionId: null
    };
    if (state.draft.questions.length === 0) state.draft.questions = [blankQuestion()];
    state.draft.expandedQuestionId = state.draft.questions[0].id;
    state.editingExamId = id;
    setView("createExam");
  } catch (err) {
    showModal({ title: "Could not load exam", message: err.message });
  }
}

function blankQuestion() { return { id: "tmp_" + Math.random().toString(36).slice(2, 9), part: 1, type: "multiple_choice", text: "", options: ["", "", "", ""], correct: 0, answerText: "", alternatives: [] }; }

/* ============================= CREATE / EDIT EXAM ============================= */
function renderCreateExam() {
  const isEdit = !!state.editingExamId;
  const expandedQuestionId = state.draft.expandedQuestionId || (state.draft.questions[0] && state.draft.questions[0].id);

function setQuestionExpanded(qid, expanded) {
  if (expanded) {
    state.draft.expandedQuestionId = qid;
    document.querySelectorAll(".qcard[open]").forEach(card => {
      if (card.dataset.questionId !== qid) card.open = false;
    });
  } else if (state.draft.expandedQuestionId === qid) {
    state.draft.expandedQuestionId = null;
  }
}
function setQText(qid, val) {
  const q = state.draft.questions.find(question => question.id === qid);
  if (q) q.text = val;
  const summary = document.querySelector(`[data-question-summary="${qid}"]`);
  if (summary) summary.textContent = val || "New question";
}
function setOption(qid, idx, val) { const q = state.draft.questions.find(q => q.id === qid); if (q) q.options[idx] = val; }
function setCorrect(qid, idx) { const q = state.draft.questions.find(q => q.id === qid); if (q) q.correct = idx; }
function setPart(qid, val) { setQuestionType(qid, EXAM_PARTS.find(item => item.part === Number(val))?.type); }
function setQuestionType(qid, val) {
  const q = state.draft.questions.find(q => q.id === qid);
  const definition = EXAM_PARTS.find(item => item.type === val);
  if (!q || !definition) return;
  q.type = val; q.part = definition.part; q.correct = 0;
  q.options = val === "true_false" ? ["True", "False"] : val === "identification" ? [] : ["", "", "", ""];
  q.answerText = ""; q.alternatives = [];
  render();
}
function addMatchingChoice(qid) {
  const q = state.draft.questions.find(q => q.id === qid);
  if (q?.type === "matching" && q.options.length < 26) q.options.push("");
  render();
}
function removeMatchingChoice(qid, index) {
  const q = state.draft.questions.find(q => q.id === qid);
  if (q?.type !== "matching" || q.options.length <= 2) return;
  q.options.splice(index, 1);
  if (q.correct === index) q.correct = 0;
  else if (q.correct > index) q.correct--;
  render();
}
function setAnswerText(qid, val) { const q = state.draft.questions.find(q => q.id === qid); if (q) q.answerText = val.toUpperCase(); }
function setAlternatives(qid, val) { const q = state.draft.questions.find(q => q.id === qid); if (q) q.alternatives = val.toUpperCase().split(",").map(answer => answer.trim()).filter(Boolean); }
function addQuestion() {
  const question = blankQuestion();
  state.draft.questions.push(question);
  state.draft.expandedQuestionId = question.id;
  render();
}
function removeQuestion(qid) {
  state.draft.questions = state.draft.questions.filter(question => question.id !== qid);
  if (state.draft.expandedQuestionId === qid) {
    state.draft.expandedQuestionId = state.draft.questions.length ? state.draft.questions[state.draft.questions.length - 1].id : null;
  }
  render();
}
function cancelCreateExam() { state.editingExamId = null; goAdminHome(); }

async function importQuestions(file) {
  if (!file) return;
  state.errorMsg = ""; state.successMsg = "";
  const draft = state.draft;
  try {
    if (!/\.txt$/i.test(file.name)) throw new Error("Choose a .txt question file.");
    if (file.size > 1024 * 1024) throw new Error("The TXT file must be 1 MB or smaller.");
    const bytes = new Uint8Array(await file.arrayBuffer());
    const encoding = bytes[0] === 255 && bytes[1] === 254 ? "utf-16le" : bytes[0] === 254 && bytes[1] === 255 ? "utf-16be" : "utf-8";
    let content;
    try { content = new TextDecoder(encoding, { fatal: true }).decode(bytes); }
    catch (error) { throw new Error("Save the question file as UTF-8 text and upload it again."); }
    const imported = parseExamText(content).map(q => ({...q, id: "tmp_" + crypto.getRandomValues(new Uint32Array(4)).join("_")}));
    if (state.draft !== draft || state.view !== "createExam") return;
    draft.questions = imported;
    draft.expandedQuestionId = imported[0].id;
    draft.importFileName = file.name;
    state.successMsg = `${imported.length} items loaded from ${file.name}. Review the questions before publishing.`;
  } catch (error) {
    if (state.draft !== draft || state.view !== "createExam") return;
    state.errorMsg = error.message;
  }
  render();
}

async function saveExam() {
  const d = state.draft;
  if (!d.title.trim()) { state.errorMsg = "Please enter an exam title."; render(); return; }
  if (!d.duration || d.duration < 1) { state.errorMsg = "Duration must be at least 1 minute."; render(); return; }
  if (!Array.isArray(d.departments) || !d.departments.length) { state.errorMsg = "Select at least one department for this exam."; render(); return; }
  if (!d.yearLevel || !d.subject.trim()) { state.errorMsg = "Please select a year level and enter the subject."; render(); return; }
  if (d.questions.length === 0) { state.errorMsg = "Add at least one question."; render(); return; }
  for (let i = 0; i < d.questions.length; i++) {
    const q = d.questions[i];
    if (!q.text.trim()) { state.errorMsg = `Question ${i + 1} needs question text.`; render(); return; }
    if (q.type === "identification" && !(q.answerText || "").trim()) { state.errorMsg = `Question ${i + 1} needs a correct answer.`; render(); return; }
    if (["multiple_choice", "matching"].includes(q.type) && q.options.some(o => !o.trim())) { state.errorMsg = `Question ${i + 1} needs all choices filled in.`; render(); return; }
    if (q.type !== "identification" && (!Number.isInteger(q.correct) || q.correct < 0 || q.correct >= q.options.length)) { state.errorMsg = `Question ${i + 1} needs a correct option.`; render(); return; }
  }
  const payload = {
    title: d.title.trim(), activityType: d.activityType || "exam", duration: d.duration,
    departments: d.departments,
    yearLevel: d.yearLevel,
    subject: d.subject.trim(),
    sectionScope: d.sectionScope || "ALL",
    questions: d.questions.map(q => ({ part: q.part, type: q.type, text: q.text.trim(), options: q.options.map(o => o.trim()), correct: q.correct, answerText: q.answerText.trim(), alternatives: q.alternatives }))
  };
  try {
    if (state.editingExamId) {
      await apiRequest("PUT", `/api/exams/${state.editingExamId}`, payload, adminHeaders());
    } else {
      await apiRequest("POST", "/api/exams", payload, adminHeaders());
    }
    state.editingExamId = null;
    await goAdminHome();
  } catch (err) { state.errorMsg = err.message; render(); }
}

function compareStudentNames(first, second) {
  const splitName = value => {
    const parts = String(value || "").split(",");
    return {
      lastName: (parts[0] || "").trim(),
      givenName: parts.slice(1).join(",").trim()
    };
  };
  const firstName = splitName(first);
  const secondName = splitName(second);
  return firstName.lastName.localeCompare(secondName.lastName, undefined, { sensitivity: "base" }) ||
    firstName.givenName.localeCompare(secondName.givenName, undefined, { sensitivity: "base" });
}

function groupResultsBySection(results) {
  const grouped = new Map();
  results.forEach(result => {
    const department = result.department || "Unassigned department";
    const yearLevel = result.yearLevel || "All years";
    const section = result.section || "Unassigned";
    const key = `${department}|${yearLevel}|${section}`;
    if (!grouped.has(key)) grouped.set(key, { department, yearLevel, section, results: [] });
    grouped.get(key).results.push(result);
  });
  const sectionOrder = new Map(SECTIONS.map((section, index) => [section, index]));
  return [...grouped.values()]
    .sort((first, second) =>
      first.department.localeCompare(second.department) ||
      first.yearLevel.localeCompare(second.yearLevel) ||
      (sectionOrder.get(first.section) ?? SECTIONS.length) - (sectionOrder.get(second.section) ?? SECTIONS.length) ||
      first.section.localeCompare(second.section)
    )
    .map(group => ({
      ...group,
      label: `${group.department} · ${group.yearLevel} · ${group.section === "Unassigned" ? "Unassigned section" : `Section ${group.section}`}`,
      results: group.results.sort((first, second) =>
        compareStudentNames(first.name, second.name) || String(first.rollNo).localeCompare(String(second.rollNo))
      )
    }));
}

      "Score": result.score,
      "Total": result.total,
      "Time Taken (mm:ss)": fmtTime(result.timeTakenSec),
      "Submitted At": new Date(result.submittedAt).toLocaleString(),
      "Auto-submitted": result.autoSubmitted ? "Yes" : "No"
    }));
    const worksheet = XLSX.utils.json_to_sheet(rows);
    worksheet["!cols"] = columnWidths;
    const sheetName = `${group.department}-${group.yearLevel}-${group.section}`.slice(0, 31);
    XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
  });
  const safeTitle = title.replace(/[^a-z0-9]+/gi, "_").slice(0, 40) || "exam";
  XLSX.writeFile(workbook, `${safeTitle}_results.xlsx`);
}
function downloadResultsPdf() {
  const filtered = state.currentExamResults.filter(result =>
    (!state.resultsDeptFilter || result.department === state.resultsDeptFilter) &&
    (!state.resultsSectionFilter || result.section === state.resultsSectionFilter)
  );
  if (!filtered.length || !window.jspdf || !window.jspdf.jsPDF) return;
  const groups = groupResultsBySection(filtered);
  const sorted = groups.flatMap(group => group.results);
  const title = sorted[0].examTitle || "Exam Results";
  const safeTitle = title.replace(/[^a-z0-9]+/gi, "_").slice(0, 40) || "exam";
  const average = sorted.reduce((sum, result) => sum + Number(result.score || 0), 0) / sorted.length;
  const topScore = Math.max(...sorted.map(result => Number(result.score || 0)));
  const totalQuestions = sorted[0].total || 0;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const pageWidth = doc.internal.pageSize.getWidth();
  const navy = [24, 43, 69];
  const teal = [31, 133, 126];
  doc.setFillColor(...navy);
  doc.rect(0, 0, pageWidth, 30, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.text("EXAM RESULTS", 16, 11);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(12);
  doc.text(title, 16, 23, { maxWidth: pageWidth - 32 });
  doc.setTextColor(92, 109, 125);
  doc.setFontSize(12);
  doc.text(`Generated ${new Date().toLocaleString()}${state.resultsDeptFilter ? `  |  ${state.resultsDeptFilter}` : ""}`, pageWidth - 16, 23, { align: "right" });
  const statY = 41;
  const statWidth = (pageWidth - 32 - 8) / 3;
  [["ATTEMPTS", String(sorted.length)], ["AVERAGE SCORE", `${average.toFixed(1)} / ${totalQuestions}`], ["TOP SCORE", `${topScore} / ${totalQuestions}`]].forEach((stat, index) => {
    const x = 16 + index * (statWidth + 4);
    doc.setFillColor(244, 247, 249);
    doc.roundedRect(x, statY, statWidth, 15, 2, 2, "F");
    doc.setTextColor(...teal);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text(stat[0], x + 5, statY + 6);
    doc.setTextColor(...navy);
    doc.setFontSize(12);
    doc.text(stat[1], x + 5, statY + 12);
  });
  let cursorY = 63;
  groups.forEach(group => {
    if (cursorY > 160) {
      doc.addPage();
      cursorY = 18;
    }
    doc.setTextColor(...navy);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.text(group.label.toUpperCase(), 16, cursorY);
    doc.autoTable({
      startY: cursorY + 3,
      pageBreak: "avoid",
      margin: { left: 16, right: 16 },
      head: [["#", "Student", "ID Number", "Department", "Section", "Score", "Time taken", "Submitted"]],
      body: group.results.map((result, index) => [
        index + 1, result.name, result.rollNo, result.department || "-", result.section ? `${result.department}-${result.section}` : "-", `${result.score} / ${result.total}`,
        fmtTime(result.timeTakenSec), new Date(result.submittedAt).toLocaleString()
      ]),
      theme: "grid",
      styles: { font: "helvetica", fontSize: 7.5, cellPadding: 2.2, textColor: [45, 58, 70], lineColor: [220, 226, 231], lineWidth: 0.15, valign: "middle" },
      headStyles: { fillColor: navy, textColor: [255, 255, 255], fontStyle: "bold", fontSize: 7.5, cellPadding: 2.5, halign: "left" },
      alternateRowStyles: { fillColor: [247, 250, 251] },
      columnStyles: { 0: { cellWidth: 10, halign: "center" }, 5: { halign: "center" }, 6: { halign: "center" }, 7: { halign: "center" } },
      didDrawPage: data => {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(130, 141, 151);
        doc.text("AbieksExamSys", 16, doc.internal.pageSize.getHeight() - 9);
        doc.text(`Page ${data.pageNumber}`, pageWidth - 16, doc.internal.pageSize.getHeight() - 9, { align: "right" });
      }
    });
    cursorY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : cursorY + 12) + 8;
  });
  doc.save(`${safeTitle}_results.pdf`);
}

/* ============================= ROUTER / RENDER ============================= */
function render() {
  const previous = captureInterfaceState();
  let body = "";
  switch (state.view) {
    case "adminLogin": body = renderAdminLogin(); break;
    case "teacherSignup": body = renderTeacherSignup(); break;
    case "adminHome": body = renderAdminHome(); break;
    case "createExam": body = renderCreateExam(); break;
    case "adminResults": body = renderAdminResults(); break;
    case "adminResultReview": body = renderAdminResultReview(); break;
    default: body = renderAdminLogin();
  }
  document.body.className = state.currentUser ? "app-page admin-page" : "auth-page";
  document.getElementById("app").innerHTML = (state.currentUser ? renderWorkspace(body, state.currentUser.role) : renderAuthLayout(body, true)) + renderModalHtml();
  enhanceInterface(previous);
}
