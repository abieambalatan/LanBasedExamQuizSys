function esc(str) {
   if (str === null || str === undefined) return "";
   return String(str).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
   }[ch]));
}

function fmtTime(totalSeconds) {
   const s = Math.max(0, Math.floor(totalSeconds || 0));
   const m = Math.floor(s / 60);
   const sec = s % 60;
   return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

function assessmentPoints(activity, question) {
   return activity?.activityType === "quiz" || ["true_false", "matching"].includes(question?.type) ? 1 : 2;
}

function assessmentPointLabel(activity, question) {
   const points = assessmentPoints(activity, question);
   return `${points} ${points === 1 ? "point" : "points"}`;
}

function assessmentScoringLabel(activity) {
   return activity?.activityType === "quiz" ? "1 point per question" : "Multiple Choice and Identification: 2 points each; True/False and Matching Type: 1 point each";
}

function userInitials(name) {
   return String(name || "A").trim().split(/\s+/).slice(0, 2).map(word => word[0]).join("").toUpperCase();
}

function answeredQuestionCount(runtime) {
   return runtime.exam.questions.filter(question => {
      const value = runtime.answers[question.id];
      return value !== undefined && value !== null && String(value).trim() !== "";
   }).length;
}

async function openWorkspaceSection(section) {
   if (section === "notifications" && state.currentUser?.role === "teacher") { await openSubmissionNotifications(); return; }
   if (section === "materials") { await openLearningWorkspace(); return; }
   const student = state.currentUser?.role === "student" || !state.currentUser?.role;
   if (state.currentUser?.role === "teacher" && section === "overview") section = "activities";
   if (state.currentUser?.role === "teacher" && section === "activities") state.selectedTeacherSubject = "";
   state.workspaceSection = section;
   if (student && state.view !== "studentHome") await goStudentHome();
   else if (!student && state.view !== "adminHome") await goAdminHome();
   else render();
   const target = document.getElementById(section);
   if (section === "students") target?.querySelector("details")?.setAttribute("open", "");
   target?.scrollIntoView({ behavior: "smooth", block: "start" });
}

function navigateToPortal(path) { window.location.assign(path); }

function renderPortalLogin(action = "doPortalLogin", usernameId = "li_username", passwordId = "li_password") {
   return `<div class="wrap auth-wrap"><div class="wrap-inner auth-inner auth-login-inner"><form class="sheet auth-card login-card" onsubmit="event.preventDefault(); submitAuthForm(this, ${action})"><div class="auth-brand"><span class="brand-logo-frame"><img src="images/wallpapercdk.png" alt="AbieksExamSys logo"></span><span>AbieksExamSys</span></div><div class="auth-heading"><span class="eyebrow">Student &amp; teacher sign in</span><h2>Welcome back</h2><div class="meta">Use your teacher username or student ID. Your account opens the right workspace.</div></div>${state.successMsg ? `<div class="banner success">${esc(state.successMsg)}</div>` : ""}${state.errorMsg ? `<div class="banner">${esc(state.errorMsg)}</div>` : ""}<div class="field"><label for="${usernameId}">Username or student ID</label><input id="${usernameId}" type="text" placeholder="Your username or student ID" autocomplete="username" required maxlength="255"></div><div class="field"><label for="${passwordId}">Password</label><input id="${passwordId}" type="password" placeholder="Your password" autocomplete="current-password" required></div><button type="submit" class="btn block auth-submit">Sign in</button><details class="forgot-password-help"><summary>Forgot password?</summary><p>Students can ask their teacher or the school administrator to reset their password after verifying their student ID. Teachers can contact the school administrator.</p></details></form><a class="back-link" href="/?signup=1">Create a student account</a><p class="help-text" style="text-align:center">Teacher accounts are created by the school administrator.</p><a class="back-link" href="/">&larr; Back to AbieksExamSys</a></div></div>`;

async function doPortalLogin(usernameId = "li_username", passwordId = "li_password") {
   const username = document.getElementById(usernameId).value.trim();
   const password = document.getElementById(passwordId).value;
   if (!username || !password) { state.errorMsg = "Enter your username or student ID and password."; render(); return; }
   try {
      const result = await apiRequest("POST", "/api/auth/login", {username, password});
      const destination = {student:"/student", teacher:"/teacher", admin:"/admin/"}[result.role];
      if (!destination) throw new Error("Your account could not be opened. Contact the school administrator.");
      navigateToPortal(destination);
   } catch (error) { state.errorMsg = error.message || "Could not sign in. Please try again."; render(); }
}

function setActivityFilter(type, button) {
   state.activityFilter = type;
   document.querySelectorAll(".activity-tabs button").forEach(item => { item.classList.toggle("active", item === button); item.setAttribute("aria-pressed", item === button ? "true" : "false"); });
   document.querySelector(".activity-toolbar").dataset.filter = type;
   filterActivityCards();
}

function filterActivityCards() {
   const query = (document.getElementById("activitySearch")?.value || "").trim().toLowerCase();
   state.activityQuery = document.getElementById("activitySearch")?.value || "";
   const type = document.querySelector(".activity-toolbar")?.dataset.filter || "all";
   let visible = 0;
   document.querySelectorAll(".exam-row[data-activity]").forEach(card => {
      const subjectMatches = state.currentUser?.role !== "teacher" || !state.selectedTeacherSubject || card.dataset.subject === state.selectedTeacherSubject;
      card.hidden = !(subjectMatches && card.dataset.search.includes(query) && (type === "all" || card.dataset.activity === type));
      if (!card.hidden) visible++;
   });
   const empty = document.getElementById("activityNoMatches");
   if (empty) empty.hidden = visible > 0;
   const count = document.getElementById("activitySearchCount");
   if (count) count.textContent = `${visible} ${visible === 1 ? "assessment" : "assessments"} shown`;
}

// Preserve entries when validation redraws the same authentication screen.
// Passwords remain only in the current page's memory, never in browser storage.
function captureInterfaceState() {
   const app = document.getElementById("app");
   return {
      view: app.dataset.view,
      focusId: document.activeElement?.id,
      fields: Array.from(app.querySelectorAll(".auth-form-area input[id], .auth-form-area select[id]"), field => ({
         id: field.id, value: field.value,
         selected: field.multiple ? Array.from(field.selectedOptions, option => option.value) : null,
      })),
   };
}

function refreshMultiSelect(select) {
   select.parentElement.querySelector(`[data-select-id="${select.id}"]`)?.remove();
   const label = select.closest(".field")?.querySelector("label");
   if (label && !label.id) label.id = `${select.id}-label`;
   const group = document.createElement("div");
   group.className = "choice-list";
   group.dataset.selectId = select.id;
   group.setAttribute("role", "group");
   if (label) group.setAttribute("aria-labelledby", label.id);
   const options = Array.from(select.options).filter(option => option.value);
   if (!options.length) {
      const message = document.createElement("p");
      message.className = "help-text";
      message.textContent = select.options[0]?.textContent || "No options available.";
      group.append(message);
   }
   for (const option of options) {
      const item = document.createElement("label");
      item.className = "choice-item";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = option.selected;
      checkbox.disabled = select.disabled || option.disabled;
      checkbox.addEventListener("change", () => {
         option.selected = checkbox.checked;
         select.dispatchEvent(new Event("change", { bubbles: true }));
      });
      const text = document.createElement("span");
      text.textContent = option.textContent;
      item.append(checkbox, text);
      group.append(item);
   }
   select.hidden = true;
   select.after(group);
}

function enhanceInterface(previous) {
   const app = document.getElementById("app");
   if (previous?.view === state.view) {
      for (const saved of previous.fields) {
         const field = document.getElementById(saved.id);
         if (!field) continue;
         if (saved.selected) Array.from(field.options).forEach(option => { option.selected = saved.selected.includes(option.value); });
         else field.value = saved.value;
      }
   }
   app.dataset.view = state.view;
   app.querySelectorAll(".field").forEach((field, index) => {
      const control = field.querySelector("input, select, textarea");
      const label = field.querySelector("label");
      if (control && label && !label.contains(control)) {
         if (!control.id) control.id = `field-${index}`;
         label.htmlFor = control.id;
         const hint = field.querySelector(".help-text");
         if (hint) { hint.id = `${control.id}-hint`; control.setAttribute("aria-describedby", hint.id); }
      }
   });
   app.querySelectorAll('input[type="password"]').forEach(input => {
      const wrapper = document.createElement("div");
      wrapper.className = "password-field";
      input.before(wrapper);
      wrapper.append(input);
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "password-toggle";
      toggle.textContent = "Show";
      toggle.setAttribute("aria-controls", input.id);
      toggle.setAttribute("aria-pressed", "false");
      toggle.setAttribute("aria-label", `Show ${input.closest(".field")?.querySelector("label")?.textContent.toLowerCase() || "password"}`);
      toggle.addEventListener("click", () => {
         const show = input.type === "password";
         input.type = show ? "text" : "password";
         toggle.textContent = show ? "Hide" : "Show";
         toggle.setAttribute("aria-pressed", String(show));
         toggle.setAttribute("aria-label", `${show ? "Hide" : "Show"} ${input.closest(".field")?.querySelector("label")?.textContent.toLowerCase() || "password"}`);
      });
      wrapper.append(toggle);
   });
   app.querySelectorAll("select[multiple]").forEach(refreshMultiSelect);
   app.querySelectorAll(".opt-row").forEach(row => {
      const letter = row.querySelector(".opt-label")?.textContent || "";
      row.querySelector('input[type="text"]')?.setAttribute("aria-label", `Option ${letter}`);
      row.querySelector('input[type="radio"]')?.setAttribute("aria-label", `Mark option ${letter} as correct`);
   });
   app.querySelectorAll(".banner, .conn-banner").forEach(banner => {
      banner.setAttribute("role", banner.classList.contains("success") ? "status" : "alert");
   });
   app.querySelectorAll("th").forEach(header => { header.scope = "col"; });
   app.querySelectorAll(".teacher-table-wrap, .table-scroll").forEach(wrapper => {
      wrapper.tabIndex = 0;
      wrapper.setAttribute("role", "region");
      wrapper.setAttribute("aria-label", "Directory table. Scroll horizontally to see all columns.");
   });
   if (document.getElementById("activitySearch")) filterActivityCards();
   const modal = app.querySelector('[role="dialog"]');
   document.body.classList.toggle("modal-open", !!modal);
   if (modal) modal.querySelector("button")?.focus();
   else if (state.errorMsg) {
      const alert = app.querySelector('[role="alert"]');
      if (alert) { alert.tabIndex = -1; alert.focus(); }
   } else if (previous?.view === state.view && previous.focusId) document.getElementById(previous.focusId)?.focus({ preventScroll: true });
}

function renderDirectoryTools(id, placeholder) {
   return `<div class="table-tools"><label class="activity-search">${uiIcon("search")}<span class="sr-only">${esc(placeholder)}</span><input type="search" placeholder="${esc(placeholder)}" oninput="filterDirectory(this, '${id}')"></label><p id="${id}-status" class="search-count" role="status"></p><p class="table-scroll-hint">Scroll sideways to see all columns.</p></div>`;
}

function filterDirectory(input, directoryId) {
   const directory = document.getElementById(directoryId);
   if (!directory) return;
   const query = input.value.trim().toLowerCase();
   let count = 0;
   directory.querySelectorAll("tbody tr").forEach(row => {
      row.hidden = !row.textContent.toLowerCase().includes(query);
      if (!row.hidden) count++;
   });
   const status = document.getElementById(`${directoryId}-status`);
   if (status) status.textContent = count ? `${count} ${count === 1 ? "record" : "records"} shown` : "No matching records. Try another name or ID.";
}

async function submitAuthForm(form, action) {
   if (form.getAttribute("aria-busy") === "true") return;
   form.setAttribute("aria-busy", "true");
   const button = form.querySelector('button[type="submit"]');
   const label = button.textContent;
   button.disabled = true;
   button.textContent = "Please wait...";
   try { await action(); }
   finally {
      form.removeAttribute("aria-busy");
      button.disabled = false;
      button.textContent = label;
   }
}

document.addEventListener("keydown", event => {
   const modal = document.querySelector('[role="dialog"]');
   if (!modal) return;
   if (event.key === "Escape") { event.preventDefault(); closeModal(); }
   if (event.key === "Tab") {
      const buttons = Array.from(modal.querySelectorAll("button:not(:disabled)"));
      const first = buttons[0], last = buttons[buttons.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
   }
});

let _csrfToken = null;
let _csrfLoading = null;

function portalRequestRole(path) {
   if (path === "/api/auth/login") return "public";
   if (window.ARALHUB_ROLE) return window.ARALHUB_ROLE;
   if (path.startsWith("/api/admin/") || path.startsWith("/api/teachers")) return "teacher";
   if (typeof state !== "undefined" && state.currentUser?.role === "teacher") return "teacher";
   return "student";
}

async function getCsrfToken() {
   if (_csrfToken) return _csrfToken;
   if (!_csrfLoading) {
      _csrfLoading = (async () => {
         try {
            const response = await fetch("/api/csrf", { credentials: "same-origin", cache: "no-store", headers:{"X-Portal-Role":portalRequestRole("/api/csrf")} });
            const data = await response.json();
            if (!response.ok || typeof data.csrfToken !== "string") throw new Error("Could not initialize a secure request. Refresh the page and try again.");
            _csrfToken = data.csrfToken;
            return _csrfToken;
         } catch (error) {
            if (error instanceof TypeError) throw new Error("Could not reach the server. Check your connection and try again.");
            throw error;
         } finally { _csrfLoading = null; }
      })();
   }
   return _csrfLoading;
}

async function apiRequest(method, path, body, extraHeaders) {
   const headers = Object.assign({ "Content-Type": "application/json", "X-Portal-Role":portalRequestRole(path) }, extraHeaders || {});
   const multipart = body instanceof FormData;
   if (multipart) delete headers["Content-Type"];
   if (!["GET", "HEAD", "OPTIONS"].includes(method)) headers["X-CSRFToken"] = await getCsrfToken();
   const opts = { method, headers, credentials: "same-origin", cache: "no-store" };
   if (body !== undefined) opts.body = multipart ? body : JSON.stringify(body);

   // Only keyed submissions are safe to resend after a lost response.
   const attempts = method === "POST" && path === "/api/results" && body?.submissionId ? 4 : 1;
   let csrfRetried = false;
   for (let attempt = 0; attempt < attempts; attempt++) {
      try {
         const res = await fetch(path, opts);
         let data = null;
         try { data = await res.json(); } catch (e) { data = null; }
         if (res.ok && data !== null) {
            if (path.endsWith("/login") || path === "/api/logout") _csrfToken = null;
            return data;
         }
         if (res.status === 403) _csrfToken = null;
         if (res.status === 403 && data?.code === "csrf_failed" && !csrfRetried && !["GET", "HEAD", "OPTIONS"].includes(method)) {
            // CSRF rejects the request before its handler runs, so this one
            // retry cannot duplicate a publish, submission, or teacher return.
            csrfRetried = true;
            headers["X-CSRFToken"] = await getCsrfToken();
            attempt--;
            continue;
         }
         const error = new Error((data && data.error) || `Request failed (${res.status}).`);
         error.status = res.status;
         error.code = data && data.code;
         error.retryable = [502, 503, 504].includes(res.status) || (res.ok && data === null);
         throw error;
      } catch (err) {
         const retryable = err instanceof TypeError || err.retryable;
         if (!retryable || attempt === attempts - 1) {
            if (err instanceof TypeError) throw new Error("Could not reach the server. Check your connection and try again.");
            throw err;
         }
         await new Promise(resolve => setTimeout(resolve, 1000 * (2 ** attempt) + Math.random() * 500));
      }
   }
}

let _modal = null;

function showModal(opts) {
   _modal = {
      title: opts.title || "",
      message: opts.message || "",
      confirmLabel: opts.confirmLabel || "OK",
      cancelLabel: opts.cancelLabel || null,
      onConfirm: typeof opts.onConfirm === "function" ? opts.onConfirm : null,
      inputLabel: opts.inputLabel || null,
      inputExpected: opts.inputExpected || null,
      inputRequiredMessage: opts.inputRequiredMessage || "Enter the student's ID number to continue.",
      inputValue: "",
      inputError: "",
   };
   if (typeof render === "function") render();
}

function closeModal() {
   _modal = null;
   if (typeof render === "function") render();
}

function _modalConfirm() {
   if (_modal?.inputLabel && (!_modal.inputValue.trim() || (_modal.inputExpected && _modal.inputValue.trim() !== _modal.inputExpected))) {
      _modal.inputError = _modal.inputRequiredMessage;
      if (typeof render === "function") render();
      document.getElementById("dialogInput")?.focus();
      return;
   }
   const cb = _modal && _modal.onConfirm;
   const value = _modal?.inputLabel ? _modal.inputValue.trim() : undefined;
   _modal = null;
   if (cb) cb(value);
   else if (typeof render === "function") render();
}

function renderModalHtml() {
   if (!_modal) return "";
   return `
   <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal-box" role="dialog" aria-modal="true" ${_modal.title ? 'aria-labelledby="dialogTitle"' : 'aria-label="Notification"'}>
         ${_modal.title ? `<h3 id="dialogTitle">${esc(_modal.title)}</h3>` : ""}
         ${_modal.message ? `<p>${esc(_modal.message)}</p>` : ""}
         ${_modal.inputLabel ? `<label for="dialogInput">${esc(_modal.inputLabel)}</label><input id="dialogInput" type="text" value="${esc(_modal.inputValue)}" autocomplete="off" required aria-invalid="${!!_modal.inputError}" ${_modal.inputError ? 'aria-describedby="dialogInputError"' : ''} oninput="_modal.inputValue=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();_modalConfirm();}">${_modal.inputError ? `<p id="dialogInputError" role="alert">${esc(_modal.inputError)}</p>` : ""}` : ""}
         <div class="modal-actions">
            ${_modal.cancelLabel ? `<button class="btn secondary" onclick="closeModal()">${esc(_modal.cancelLabel)}</button>` : ""}
            <button class="btn" onclick="_modalConfirm()">${esc(_modal.confirmLabel)}</button>
         </div>
      </div>
   </div>`;
}

/* Lecture materials and activity file submissions, shared by both workspaces. */
const LEARNING_FILE_ACCEPT = ".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx";
function learningFileSize(size) {
   return size >= 1024 * 1024 ? `${(size / (1024 * 1024)).toFixed(1)} MB` : `${Math.max(1, Math.ceil(size / 1024))} KB`;
}
function learningFileLinks(file) {
   return `<div class="learning-file"><span class="activity-icon violet">${uiIcon("file")}</span><div><strong>${esc(file.filename)}</strong><small>${learningFileSize(file.size)}</small></div><div class="learning-file-actions"><a class="btn secondary" href="${esc(file.openUrl)}" target="_blank" rel="noopener">Open</a><a class="linklike" href="${esc(file.downloadUrl)}">Download</a></div></div>`;
}
async function openLearningWorkspace() {
   state.workspaceSection = "materials";
   state.learningError = ""; state.learningNotice = "";
   state.learningSubmissions = null; state.learningSelectedMaterial = null;
   const user = state.currentUser;
   try {
      const materials = await apiRequest("GET", "/api/learning/materials");
      if (state.currentUser !== user) return;
      state.learningMaterials = materials;
   } catch (error) {
      if (state.currentUser !== user) return;
      state.learningMaterials = [];
      state.learningError = error.message;
   }
   state.view = "learningHome";
   render();
}
function learningTargetClasses(form) {
   return Array.from(form.querySelectorAll('[name="lectureClass"]:checked'), checkbox => checkbox.matches(":disabled") ? null : ({department:checkbox.dataset.department, yearLevel:checkbox.dataset.year, section:checkbox.value})).filter(Boolean);
}
function updateLearningClassCount() {
   const form = document.querySelector(".learning-upload form");
   if (!form) return;
   const count = learningTargetClasses(form).length;
   form.querySelector(".learning-class-count").textContent = `${count} ${count === 1 ? "class selected" : "classes selected"}`;
}
function toggleLearningDepartment(index, selected) {
   const group = document.getElementById(`lecture-department-${index}`);
   if (!group) return;
   group.hidden = !selected;
   group.disabled = !selected;
   updateLearningClassCount();
}
function toggleLearningYear(departmentIndex, yearIndex, selected) {
   const group = document.getElementById(`lecture-year-${departmentIndex}-${yearIndex}`);
   if (!group) return;
   group.hidden = !selected;
   group.disabled = !selected;
   updateLearningClassCount();
}
function selectLearningYearSections(departmentIndex, yearIndex, selected) {
   const group = document.getElementById(`lecture-year-${departmentIndex}-${yearIndex}`);
   group?.querySelectorAll('[name="lectureClass"]').forEach(checkbox => { checkbox.checked = selected; });
   updateLearningClassCount();
}
function renderLearningClassPicker() {
   return `<fieldset class="learning-targets"><legend>Share with these classes</legend><p class="help-text">Select every department represented in your class, then choose its year levels and sections. Students in any selected class can view the same material.</p><div class="learning-department-options">${DEPARTMENTS.map((department, index) => `<label class="learning-check"><input type="checkbox" name="lectureDepartment" value="${esc(department)}" onchange="toggleLearningDepartment(${index}, this.checked)"> ${esc(department)}</label>`).join("")}</div><div class="learning-class-groups">${DEPARTMENTS.map((department, departmentIndex) => `<fieldset class="learning-department-group" id="lecture-department-${departmentIndex}" hidden disabled><legend>${esc(department)}</legend><div class="learning-year-options">${YEAR_LEVELS.map((year, yearIndex) => `<label class="learning-check"><input type="checkbox" name="lectureYear" value="${esc(year)}" onchange="toggleLearningYear(${departmentIndex}, ${yearIndex}, this.checked)"> ${esc(year)}</label>`).join("")}</div>${YEAR_LEVELS.map((year, yearIndex) => `<fieldset class="learning-year-sections" id="lecture-year-${departmentIndex}-${yearIndex}" hidden disabled><legend>${esc(department)} &middot; ${esc(year)}</legend><div class="learning-section-actions"><button type="button" class="linklike" onclick="selectLearningYearSections(${departmentIndex}, ${yearIndex}, true)">Select all sections</button><button type="button" class="linklike" onclick="selectLearningYearSections(${departmentIndex}, ${yearIndex}, false)">Clear sections</button></div><div class="learning-section-options">${sectionsForDepartment(department, year).map(section => `<label class="learning-check"><input type="checkbox" name="lectureClass" data-department="${esc(department)}" data-year="${esc(year)}" value="${esc(section)}" onchange="updateLearningClassCount()"> ${esc(department)} ${yearIndex + 1}-${esc(section)}</label>`).join("") || '<span class="help-text">No sections available.</span>'}</div></fieldset>`).join("")}</fieldset>`).join("")}</div><p class="learning-class-count help-text" role="status">0 classes selected</p></fieldset>`;
}
function renderLectureUploadForm() {
   return `<details class="sheet learning-upload"><summary>${uiIcon("plus")} Share lecture material or an activity</summary><form onsubmit="event.preventDefault(); publishLectureMaterial(this)"><fieldset><div class="learning-form-grid"><div class="field"><label for="lectureTitle">Lecture / activity title</label><input id="lectureTitle" name="title" maxlength="200" required></div><div class="field"><label for="lectureSubject">Subject</label><input id="lectureSubject" name="subject" maxlength="200" required></div></div><div class="field"><label for="lectureInstructions">Lecture notes / activity instructions</label><textarea id="lectureInstructions" name="instructions" rows="4" maxlength="10000" placeholder="Describe what students should read or submit."></textarea></div>${renderLearningClassPicker()}<label class="learning-check learning-accept"><input type="checkbox" name="requiresSubmission"> Request a student file submission for this activity</label><div class="field"><label for="lectureFile">Lecture material / activity file</label><input id="lectureFile" name="file" type="file" accept="${LEARNING_FILE_ACCEPT}" required><small class="help-text">PDF, Word, PowerPoint, or Excel. Maximum 25 MB per file. Share additional files as separate materials.</small></div><p class="learning-form-status" role="status"></p><button class="btn" type="submit">${uiIcon("plus")} Share with students</button></fieldset></form></details>`;
}
function renderLearningWorkspace() {
   const teacher = state.currentUser?.role === "teacher";
   const materials = state.learningMaterials || [];
   const cards = materials.map(material => `<article class="sheet learning-card"><div class="section-title-row"><div><span class="eyebrow">${esc(material.subject)}</span><h2>${esc(material.title)}</h2><p class="meta">${esc(material.teacherName)} &middot; ${esc(new Date(material.createdAt).toLocaleString())}</p></div><span class="badge ${material.mySubmission ? "done" : "open"}">${material.requiresSubmission ? material.mySubmission ? "Submitted" : "Activity submission" : "Lecture material"}</span></div>${material.instructions ? `<p class="learning-instructions">${esc(material.instructions)}</p>` : ""}${learningFileLinks(material)}${teacher ? `<p class="help-text">Shared with ${(material.targetClasses || []).map(item => esc(`${item.department} ${item.yearLevel}, Section ${item.section}`)).join("; ")}</p><div class="learning-card-actions">${material.requiresSubmission ? `<button class="btn secondary" onclick="openLearningSubmissions('${material.id}')">${uiIcon("people")} View submissions (${material.submissionCount || 0})</button>` : ""}<button class="linklike danger-link" onclick="deleteLectureMaterial('${material.id}')">Delete material</button></div>` : material.requiresSubmission ? `<div class="learning-submission"><h3>Your activity submission</h3>${material.mySubmission ? `<p class="meta">Submitted ${esc(new Date(material.mySubmission.submittedAt).toLocaleString())}</p>${learningFileLinks(material.mySubmission)}<p class="help-text">Uploading again replaces your previous submission.</p>` : '<p class="help-text">Choose your completed activity file and submit it to your teacher.</p>'}<form onsubmit="event.preventDefault(); submitLearningFile(this, '${material.id}')"><fieldset><label class="sr-only" for="submission-${material.id}">Activity file for ${esc(material.title)}</label><input id="submission-${material.id}" name="file" type="file" accept="${LEARNING_FILE_ACCEPT}" required><small class="help-text">PDF, Word, PowerPoint, or Excel. Maximum 25 MB.</small><p class="learning-form-status" role="status"></p><button class="btn" type="submit">${material.mySubmission ? "Replace submission" : "Submit activity file"}</button></fieldset></form></div>` : ""}</article>`).join("");
   const selected = materials.find(item => item.id === state.learningSelectedMaterial);
   return `<div class="wrap"><div class="wrap-inner wide"><section id="materials"><div class="section-title-row"><div><span class="eyebrow">YOUR CLASSROOM FILES</span><h1>Lecture materials</h1><p>${teacher ? "Share lecture files and collect completed activities from your classes." : "Read your class materials and submit your completed activities here."}</p></div><button class="btn secondary" onclick="openLearningWorkspace()">Refresh</button></div><p class="help-text">PDFs open in your browser. Word, PowerPoint, and Excel files download to open in an installed app.</p>${state.learningError ? `<div class="banner" role="alert">${esc(state.learningError)}</div>` : ""}${state.learningNotice ? `<div class="conn-banner" role="status">${esc(state.learningNotice)}</div>` : ""}${teacher ? renderLectureUploadForm() : ""}${selected && Array.isArray(state.learningSubmissions) ? `<section class="sheet learning-received" aria-label="Activity submissions"><div class="section-title-row"><div><span class="eyebrow">STUDENT SUBMISSIONS</span><h2>${esc(selected.title)}</h2></div><button class="btn secondary" onclick="state.learningSelectedMaterial=null; state.learningSubmissions=null; render()">Close</button></div>${state.learningSubmissions.length ? state.learningSubmissions.map(item => `<article class="learning-received-row" data-submission-id="${esc(item.id)}" tabindex="-1"><h3>${esc(item.name || "Student")} &middot; ${esc(item.rollNo)}</h3><p class="meta">${esc(item.department)} &middot; ${esc(item.yearLevel)}, Section ${esc(item.section)} &middot; ${esc(new Date(item.submittedAt).toLocaleString())}</p>${learningFileLinks(item)}</article>`).join("") : '<div class="empty">No files submitted yet.</div>'}</section>` : ""}<div class="learning-list">${cards || `<div class="empty">${uiIcon("file")}<h2>No lecture materials yet</h2><p>${teacher ? "Share a file above to make it available to your students." : "Materials shared with your class will appear here."}</p></div>`}</div></section></div></div>`;
}
function checkLearningFile(form) {
   const file = form.querySelector('input[type="file"]').files[0];
   if (!file) throw new Error("Choose a file first.");
   if (!file.size || file.size > 25 * 1024 * 1024) throw new Error("Choose a non-empty file of 25 MB or smaller.");
   if (!LEARNING_FILE_ACCEPT.split(",").some(extension => file.name.toLowerCase().endsWith(extension))) throw new Error("Choose a PDF, Word, PowerPoint, or Excel file.");
}
async function sendLearningForm(form, path, data, notice) {
   const status = form.querySelector(".learning-form-status");
   const fieldset = form.querySelector("fieldset");
   const user = state.currentUser;
   let uploaded = false;
   try {
      checkLearningFile(form);
      fieldset.disabled = true; status.textContent = "Uploading file. Please keep this page open…";
      await apiRequest("POST", path, data);
      uploaded = true;
      if (state.currentUser !== user) return;
      const materials = await apiRequest("GET", "/api/learning/materials");
      if (state.currentUser !== user) return;
      state.learningMaterials = materials; state.learningNotice = notice; state.learningError = "";
      state.learningSelectedMaterial = null; state.learningSubmissions = null;
      render();
   } catch (error) { status.textContent = uploaded ? `${notice} Use Refresh to load the latest files. ${error.message}` : error.message; status.setAttribute("role", "alert"); }
   finally { fieldset.disabled = false; }
}
async function publishLectureMaterial(form) {
   const data = new FormData(form);
   const targetClasses = learningTargetClasses(form);
   if (!targetClasses.length || targetClasses.length > 120) { const status = form.querySelector(".learning-form-status"); status.textContent = "Select between 1 and 120 classes, using the department, year level, and section checkboxes."; status.setAttribute("role", "alert"); return; }
   data.set("targetClasses", JSON.stringify(targetClasses));
   data.set("requiresSubmission", String(form.elements.requiresSubmission.checked));
   await sendLearningForm(form, "/api/learning/materials", data, "Material shared with your students.");
}
async function submitLearningFile(form, materialId) {
   await sendLearningForm(form, `/api/learning/materials/${encodeURIComponent(materialId)}/submissions`, new FormData(form), "Your activity file was submitted successfully.");
}
async function openLearningSubmissions(materialId) {
   const user = state.currentUser;
   try {
      const submissions = await apiRequest("GET", `/api/learning/materials/${encodeURIComponent(materialId)}/submissions`);
      if (state.currentUser !== user || state.view !== "learningHome") return;
      state.learningSubmissions = submissions;
      state.learningSelectedMaterial = materialId; state.learningError = "";
      render(); document.querySelector(".learning-received")?.scrollIntoView({behavior:"smooth"});
   } catch (error) { state.learningError = error.message; render(); }
}
function deleteLectureMaterial(materialId) {
   showModal({title:"Delete lecture material?", message:"This removes the shared file and all activity submissions for this material.", confirmLabel:"Delete material", cancelLabel:"Cancel", onConfirm:async () => {
      try { await apiRequest("DELETE", `/api/learning/materials/${encodeURIComponent(materialId)}`); await openLearningWorkspace(); }
      catch (error) { state.learningError = error.message; render(); }
   }});
}
