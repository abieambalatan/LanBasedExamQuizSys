function esc(str) {
   if (str === null || str === undefined) return "";
   return String(str).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
   }[ch]));
}

function fmtTime(totalSeconds) {
   const s = Math.max(0, Math.floor(totalSeconds || 0));
   const m = Math.floor(s / 60);
   const sec = s % 60;
   return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

function assessmentPoints(activity) {
   return activity?.activityType === "quiz" ? 1 : 2;
}

function assessmentPointLabel(activity) {
   const points = assessmentPoints(activity);
   return `${points} ${points === 1 ? "point" : "points"}`;
}

function answeredQuestionCount(runtime) {
   return runtime.exam.questions.filter(question => {
      const value = runtime.answers[question.id];
      return value !== undefined && value !== null && String(value).trim() !== "";
   }).length;
}

async function openWorkspaceSection(section) {
   const student = state.currentUser?.role === "student" || !state.currentUser?.role;
   if (state.currentUser?.role === "teacher" && section === "overview") section = "activities";
   if (state.currentUser?.role === "teacher" && section === "activities") state.selectedTeacherSubject = "";
   state.workspaceSection = section;
   if (student && state.view !== "studentHome") await goStudentHome();
   else if (!student && state.view !== "adminHome") await goAdminHome();
   else render();
   const target = document.getElementById(section);
   if (section === "students") target?.querySelector("details")?.setAttribute("open", "");
   target?.scrollIntoView({ behavior: "smooth", block: "start" });
}

function setActivityFilter(type, button) {
   state.activityFilter = type;
   document.querySelectorAll(".activity-tabs button").forEach(item => { item.classList.toggle("active", item === button); item.setAttribute("aria-pressed", item === button ? "true" : "false"); });

function filterActivityCards() {
   const query = (document.getElementById("activitySearch")?.value || "").trim().toLowerCase();
   state.activityQuery = document.getElementById("activitySearch")?.value || "";
   const type = document.querySelector(".activity-toolbar")?.dataset.filter || "all";

// Preserve entries when validation redraws the same authentication screen.
// Passwords remain only in the current page's memory, never in browser storage.
function captureInterfaceState() {
   const app = document.getElementById("app");
   return {
      view: app.dataset.view,
      focusId: document.activeElement?.id,
      fields: Array.from(app.querySelectorAll(".auth-form-area input[id], .auth-form-area select[id]"), field => ({
         id: field.id, value: field.value,
         selected: field.multiple ? Array.from(field.selectedOptions, option => option.value) : null,
      })),
   };
}

function refreshMultiSelect(select) {
   select.parentElement.querySelector(`[data-select-id="${select.id}"]`)?.remove();
   const label = select.closest(".field")?.querySelector("label");
   if (label && !label.id) label.id = `${select.id}-label`;
   const group = document.createElement("div");
   group.className = "choice-list";
   group.dataset.selectId = select.id;
   group.setAttribute("role", "group");
   if (label) group.setAttribute("aria-labelledby", label.id);
   const options = Array.from(select.options).filter(option => option.value);
   if (!options.length) {
      const message = document.createElement("p");
      message.className = "help-text";
      message.textContent = select.options[0]?.textContent || "No options available.";
      group.append(message);
   }
   for (const option of options) {
      const item = document.createElement("label");
      item.className = "choice-item";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = option.selected;
      checkbox.disabled = select.disabled || option.disabled;
      checkbox.addEventListener("change", () => {
         option.selected = checkbox.checked;
         select.dispatchEvent(new Event("change", { bubbles: true }));
      });
      const text = document.createElement("span");
      text.textContent = option.textContent;
      item.append(checkbox, text);
      group.append(item);
   }
   select.hidden = true;
   select.after(group);
}

function enhanceInterface(previous) {
   const app = document.getElementById("app");
   if (previous?.view === state.view) {
      for (const saved of previous.fields) {
         const field = document.getElementById(saved.id);
         if (!field) continue;
         if (saved.selected) Array.from(field.options).forEach(option => { option.selected = saved.selected.includes(option.value); });
         else field.value = saved.value;
      }
   }
   app.dataset.view = state.view;
   app.querySelectorAll(".field").forEach((field, index) => {
      const control = field.querySelector("input, select, textarea");
      const label = field.querySelector("label");
      if (control && label && !label.contains(control)) {
         if (!control.id) control.id = `field-${index}`;
         label.htmlFor = control.id;
         const hint = field.querySelector(".help-text");
         if (hint) { hint.id = `${control.id}-hint`; control.setAttribute("aria-describedby", hint.id); }
      }
   });
   app.querySelectorAll('input[type="password"]').forEach(input => {
      const wrapper = document.createElement("div");
      wrapper.className = "password-field";
      input.before(wrapper);
      wrapper.append(input);
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "password-toggle";
      toggle.textContent = "Show";
      toggle.setAttribute("aria-controls", input.id);
      toggle.setAttribute("aria-pressed", "false");
      toggle.setAttribute("aria-label", `Show ${input.closest(".field")?.querySelector("label")?.textContent.toLowerCase() || "password"}`);
      toggle.addEventListener("click", () => {
         const show = input.type === "password";
         input.type = show ? "text" : "password";
         toggle.textContent = show ? "Hide" : "Show";
         toggle.setAttribute("aria-pressed", String(show));
         toggle.setAttribute("aria-label", `${show ? "Hide" : "Show"} ${input.closest(".field")?.querySelector("label")?.textContent.toLowerCase() || "password"}`);
      });
      wrapper.append(toggle);
   });
   app.querySelectorAll("select[multiple]").forEach(refreshMultiSelect);
   app.querySelectorAll(".opt-row").forEach(row => {
      const letter = row.querySelector(".opt-label")?.textContent || "";
      row.querySelector('input[type="text"]')?.setAttribute("aria-label", `Option ${letter}`);
      row.querySelector('input[type="radio"]')?.setAttribute("aria-label", `Mark option ${letter} as correct`);
   });
   app.querySelectorAll(".banner, .conn-banner").forEach(banner => {
      banner.setAttribute("role", banner.classList.contains("success") ? "status" : "alert");
   });
   app.querySelectorAll("th").forEach(header => { header.scope = "col"; });
   app.querySelectorAll(".teacher-table-wrap, .table-scroll").forEach(wrapper => {
      wrapper.tabIndex = 0;
      wrapper.setAttribute("role", "region");
      wrapper.setAttribute("aria-label", "Directory table. Scroll horizontally to see all columns.");
   });
   if (document.getElementById("activitySearch")) filterActivityCards();
   const modal = app.querySelector('[role="dialog"]');
   document.body.classList.toggle("modal-open", !!modal);
   if (modal) modal.querySelector("button")?.focus();
   else if (state.errorMsg) {
      const alert = app.querySelector('[role="alert"]');
      if (alert) { alert.tabIndex = -1; alert.focus(); }
   } else if (previous?.view === state.view && previous.focusId) document.getElementById(previous.focusId)?.focus({ preventScroll: true });
}

function filterDirectory(input, directoryId) {
   const directory = document.getElementById(directoryId);
   if (!directory) return;
   const query = input.value.trim().toLowerCase();
   let count = 0;
   directory.querySelectorAll("tbody tr").forEach(row => {
      row.hidden = !row.textContent.toLowerCase().includes(query);
      if (!row.hidden) count++;
   });
   const status = document.getElementById(`${directoryId}-status`);
   if (status) status.textContent = count ? `${count} ${count === 1 ? "record" : "records"} shown` : "No matching records. Try another name or ID.";
}

async function submitAuthForm(form, action) {
   if (form.getAttribute("aria-busy") === "true") return;
   form.setAttribute("aria-busy", "true");
   const button = form.querySelector('button[type="submit"]');
   const label = button.textContent;
   button.disabled = true;
   button.textContent = "Please wait...";
   try { await action(); }
   finally {
      form.removeAttribute("aria-busy");
      button.disabled = false;
      button.textContent = label;
   }
}

document.addEventListener("keydown", event => {
   const modal = document.querySelector('[role="dialog"]');
   if (!modal) return;
   if (event.key === "Escape") { event.preventDefault(); closeModal(); }
   if (event.key === "Tab") {
      const buttons = Array.from(modal.querySelectorAll("button:not(:disabled)"));
      const first = buttons[0], last = buttons[buttons.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
   }
});

let _csrfToken = null;
let _csrfLoading = null;

async function getCsrfToken() {
   if (_csrfToken) return _csrfToken;
   if (!_csrfLoading) {
      _csrfLoading = (async () => {
         try {
            const response = await fetch("/api/csrf", { credentials: "same-origin", cache: "no-store" });
            const data = await response.json();
            if (!response.ok || typeof data.csrfToken !== "string") throw new Error("Could not initialize a secure request. Refresh the page and try again.");
            _csrfToken = data.csrfToken;
            return _csrfToken;
         } catch (error) {
            if (error instanceof TypeError) throw new Error("Could not reach the server. Check your connection and try again.");
            throw error;
         } finally { _csrfLoading = null; }
      })();
   }
   return _csrfLoading;
}

async function apiRequest(method, path, body, extraHeaders) {
   const headers = Object.assign({ "Content-Type": "application/json" }, extraHeaders || {});
   if (!["GET", "HEAD", "OPTIONS"].includes(method)) headers["X-CSRFToken"] = await getCsrfToken();
   const opts = { method, headers, credentials: "same-origin", cache: "no-store" };
   if (body !== undefined) opts.body = JSON.stringify(body);

   // Only keyed submissions are safe to resend after a lost response.
   const attempts = method === "POST" && path === "/api/results" && body?.submissionId ? 4 : 1;
   for (let attempt = 0; attempt < attempts; attempt++) {
      try {
         const res = await fetch(path, opts);
         let data = null;
         try { data = await res.json(); } catch (e) { data = null; }
         if (res.ok && data !== null) {
            if (path.endsWith("/login") || path === "/api/logout") _csrfToken = null;
            return data;
         }
         if (res.status === 403) _csrfToken = null;
         const error = new Error((data && data.error) || `Request failed (${res.status}).`);
         error.status = res.status;
         error.retryable = [502, 503, 504].includes(res.status) || (res.ok && data === null);
         throw error;
      } catch (err) {
         const retryable = err instanceof TypeError || err.retryable;
         if (!retryable || attempt === attempts - 1) {
            if (err instanceof TypeError) throw new Error("Could not reach the server. Check your connection and try again.");
            throw err;
         }
         await new Promise(resolve => setTimeout(resolve, 1000 * (2 ** attempt) + Math.random() * 500));
      }
   }
}

let _modal = null;

function showModal(opts) {
   _modal = {
      title: opts.title || "",
      message: opts.message || "",
      confirmLabel: opts.confirmLabel || "OK",
      cancelLabel: opts.cancelLabel || null,
      onConfirm: typeof opts.onConfirm === "function" ? opts.onConfirm : null,
   };
   if (typeof render === "function") render();
}

function closeModal() {
   _modal = null;
   if (typeof render === "function") render();
}

function _modalConfirm() {
   const cb = _modal && _modal.onConfirm;
   _modal = null;
   if (cb) cb();
   else if (typeof render === "function") render();
}

function renderModalHtml() {
   if (!_modal) return "";
   return `
   <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal-box" role="dialog" aria-modal="true" ${_modal.title ? 'aria-labelledby="dialogTitle"' : 'aria-label="Notification"'}>
         ${_modal.title ? `<h3 id="dialogTitle">${esc(_modal.title)}</h3>` : ""}
         ${_modal.message ? `<p>${esc(_modal.message)}</p>` : ""}
         <div class="modal-actions">
            ${_modal.cancelLabel ? `<button class="btn secondary" onclick="closeModal()">${esc(_modal.cancelLabel)}</button>` : ""}
            <button class="btn" onclick="_modalConfirm()">${esc(_modal.confirmLabel)}</button>
         </div>
      </div>
   </div>`;
}

const SCHOOL_OPTIONS = window.ARALHUB_SCHOOL_OPTIONS || {};
const PASSING_PERCENT = 50;
const DEPARTMENTS = SCHOOL_OPTIONS.departments?.length ? SCHOOL_OPTIONS.departments : ["BSIT", "BSCRIM", "BEED", "BSHM", "BSN"];
const YEAR_LEVELS = ["1st Year", "2nd Year", "3rd Year", "4th Year"];
const SECTIONS_BY_DEPARTMENT = SCHOOL_OPTIONS.sections_by_department || {};
const SECTIONS_BY_YEAR = SCHOOL_OPTIONS.sections_by_department_and_year || {};
const SECTIONS = SCHOOL_OPTIONS.section?.length ? SCHOOL_OPTIONS.section : ["A", "B", "C", "D", "E", "F"];
function sectionsForDepartment(department, year) {
  if (year && SECTIONS_BY_YEAR[department]) return SECTIONS_BY_YEAR[department][year] || [];
  return SECTIONS_BY_DEPARTMENT[department] || (DEPARTMENTS.includes(department) ? SECTIONS : []);
}
function resultPercent(result) {
  if (result.percent !== undefined && result.percent !== null && Number.isFinite(Number(result.percent))) return Number(result.percent);
  return result.total ? Number(result.score || 0) / Number(result.total) * 100 : 0;
}
function resultGradeLabel(result) {
  return resultPercent(result) < PASSING_PERCENT ? "Failed" : "Passed";
}

function setView(v, extra) { state.errorMsg = ""; state.successMsg = ""; state.view = v; if (extra) Object.assign(state, extra); render(); }

/* ============================= TAKE EXAM ============================= */
function savedAttemptStorageKey() {
  return `aralhub:student-attempt:${encodeURIComponent(state.currentUser.rollNo)}`;
}
function readSavedAttempt() {
  if (!state.currentUser?.rollNo) return null;
  try {
    const raw = localStorage.getItem(savedAttemptStorageKey());
    if (!raw) return null;
    const attempt = JSON.parse(raw);
    if (!attempt || attempt.version !== 1 || typeof attempt.examId !== "string" || !attempt.answers || typeof attempt.answers !== "object" || Array.isArray(attempt.answers) || !Number.isFinite(attempt.deadlineAt) || typeof attempt.submissionId !== "string") {
      localStorage.removeItem(savedAttemptStorageKey());
      state.draftRecoveryMessage = "An unreadable saved attempt was cleared. You can start the assessment again.";
      return null;
    }
    return attempt;
  } catch (err) {
    state.draftSaveError = "Saved answers could not be read from this browser. Your attempt may not be recoverable.";
    return null;
  }
}
function saveCurrentAttempt() {
  if (!state.runtime || !state.currentUser?.rollNo) return;
  const rt = state.runtime;
  const question = rt.exam.questions[rt.currentIdx];
  try {
    localStorage.setItem(savedAttemptStorageKey(), JSON.stringify({
      version: 1,
      examId: rt.exam.id,
      answers: rt.answers,
      currentQuestionId: question?.id || "",
      deadlineAt: rt.deadlineAt,
      submissionId: rt.submissionId,
      focusDeadlineAt: rt.focusDeadlineAt || null,
      pendingSubmission: rt.pendingSubmission || null,
      returnId: rt.returnId || null
    }));
    state.draftSaveError = "";
  } catch (err) {
    state.draftSaveError = "Your answers could not be saved on this device. Keep this page open; a power loss may erase them.";
  }
}
function clearSavedAttempt() {
  if (!state.currentUser?.rollNo) return;
  try {
    localStorage.removeItem(savedAttemptStorageKey());
  } catch (err) {
    state.draftSaveError = "The saved attempt could not be cleared from this browser.";
  }
}
function createSubmissionId() {
  return Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16).padStart(8, "0")).join("");
}
async function beginExam(examId) {
  const activity = state.exams.find(exam => exam.id === examId);
  if (state.myResults.some(result => result.examId === examId)) {
    showModal({
      title: activity?.activityType === "quiz" ? "Awaiting teacher return" : "Already attempted",
      message: activity?.activityType === "quiz"
        ? "Your quiz has been submitted. You can take it again after your teacher returns it."
        : "You have already attempted this exam."
    });
    return;
  }
  let exam;
  try { exam = await apiRequest("GET", `/api/exams/${examId}/take`); }
  catch (err) { showModal({ title: "Could not start exam", message: err.message }); return; }
  const validIds = new Set(exam.questions.map(question => question.id));
  const answers = Object.fromEntries(Object.entries(exam.returnedAttempt?.answers || {}).filter(([id]) => validIds.has(id)));
  state.runtime = { exam, answers, secondsLeft: exam.duration * 60, deadlineAt: Date.now() + exam.duration * 60 * 1000, submissionId: createSubmissionId(), currentIdx: 0, timerId: null, tabSwitchSubmitted: false };
  state.runtime.returnId = exam.returnedAttempt?.returnId || null;
  state.draftSaveError = "";
  saveCurrentAttempt();
  if (exam.activityType === "quiz") history.pushState({ aralHubQuiz: exam.id }, "", window.location.href);
  setView("takeExam");
  state.runtime.timerId = setInterval(tickTimer, 1000);
}
async function resumeSavedAttempt(examId) {
  const saved = state.savedAttempt;
  if (!saved || saved.examId !== examId) return;
  let exam;
  try { exam = await apiRequest("GET", `/api/exams/${examId}/take`); }
  catch (err) { showModal({ title: "Could not resume assessment", message: err.message || "Reconnect to the system and try again. Your saved answers remain on this device." }); return; }
  if (exam.returnedAttempt && saved.returnId !== exam.returnedAttempt.returnId) {
    clearSavedAttempt();
    state.savedAttempt = null;
    return beginExam(examId);
  }
  const remaining = Math.max(0, Math.ceil((saved.deadlineAt - Date.now()) / 1000));
  const currentIdx = Math.max(0, exam.questions.findIndex(question => question.id === saved.currentQuestionId));
  const questionIds = new Set(exam.questions.map(question => question.id));
  const answers = Object.fromEntries(Object.entries(saved.answers).filter(([questionId]) => questionIds.has(questionId)));
  state.runtime = { exam, answers, secondsLeft: remaining, deadlineAt: saved.deadlineAt, submissionId: saved.submissionId, currentIdx, timerId: null, tabSwitchSubmitted: false, focusDeadlineAt: saved.focusDeadlineAt || null, pendingSubmission: saved.pendingSubmission || null };
  state.runtime.returnId = saved.returnId || null;
  state.draftSaveError = "";
  if (exam.activityType === "quiz") history.pushState({ aralHubQuiz: exam.id }, "", window.location.href);
  setView("takeExam");
  state.runtime.timerId = setInterval(tickTimer, 1000);
  tickTimer();
}
function tickTimer() {
  if (!state.runtime) return;
  if (state.runtime.pendingSubmission) {
    if (!state.submitting && Date.now() >= (state.runtime.retryAt || 0)) submitExam(true, state.runtime.pendingSubmission);
    return;
  }
  if (state.runtime.focusDeadlineAt) {
    if (Date.now() >= state.runtime.focusDeadlineAt) { submitExam(true, "tab_switch"); return; }
    const countdown = document.getElementById("focusCountdown");
    if (countdown) countdown.textContent = Math.max(0, Math.ceil((state.runtime.focusDeadlineAt - Date.now()) / 1000));
  }
  state.runtime.secondsLeft = Math.max(0, Math.ceil((state.runtime.deadlineAt - Date.now()) / 1000));
  if (state.runtime.secondsLeft <= 0) {
    state.runtime.secondsLeft = 0;
    clearInterval(state.runtime.timerId);
    submitExam(true);
    return;
  }
  updateTimerDom();
}
function updateTimerDom() {
  const el = document.getElementById("timerDisplay");
  if (!el || !state.runtime) return;
  el.textContent = fmtTime(state.runtime.secondsLeft);
  el.classList.toggle("low", state.runtime.secondsLeft <= 60);
}
const FOCUS_WARNING_SECONDS = 10;
function warnAssessmentFocus() {
  const runtime = state.runtime;
  if (!runtime || state.view !== "takeExam" || state.submitting || runtime.pendingSubmission || runtime.focusDeadlineAt) return;
  runtime.focusDeadlineAt = Date.now() + FOCUS_WARNING_SECONDS * 1000;
  saveCurrentAttempt();
  render();
}
function handleVisibilityChange() {
  if (document.hidden) warnAssessmentFocus();
  else if (state.runtime?.focusDeadlineAt) tickTimer();
}
function acknowledgeAssessmentFocus() {
  if (!state.runtime?.focusDeadlineAt || document.hidden || !document.hasFocus()) return;
  if (Date.now() >= state.runtime.focusDeadlineAt) { tickTimer(); return; }
  state.runtime.focusDeadlineAt = null;
  saveCurrentAttempt();
  render();
}
function renderFocusWarning() {
  const runtime = state.runtime;
  if (!runtime?.focusDeadlineAt || state.submitting || runtime.pendingSubmission) return "";
  return `<div class="assessment-warning-backdrop"><section class="assessment-warning" role="alertdialog" aria-modal="true" aria-labelledby="focusWarningTitle" aria-describedby="focusWarningMessage"><span class="activity-icon amber">${uiIcon("shield")}</span><h2 id="focusWarningTitle">Return to your assessment</h2><p id="focusWarningMessage">Leaving this tab, switching apps with Alt+Tab, or minimizing the window is restricted. Return and select Continue before the countdown ends, or your current answers will be submitted automatically.</p><div class="focus-countdown"><strong id="focusCountdown">${Math.max(0, Math.ceil((runtime.focusDeadlineAt - Date.now()) / 1000))}</strong><span>seconds remaining</span></div><button type="button" class="btn" onclick="acknowledgeAssessmentFocus()">Continue assessment</button></section></div>`;
}
function handleQuizBackNavigation() {
  const runtime = state.runtime;
  if (!runtime || runtime.exam.activityType !== "quiz") return;
  history.pushState({ aralHubQuiz: runtime.exam.id }, "", window.location.href);
  showModal({
    title: "Quiz in progress",

function renderTakeExam() {
  const rt = state.runtime;
  const exam = rt.exam;
  const q = exam.questions[rt.currentIdx];

    </label>`).join("");
  const partLabel = ({ identification: "Part 2 - Identification", true_false: "Part 3 - True or False", matching: "Part 4 - Matching Type" })[q.type] || "Part 1 - Multiple Choice";
  const submitLabel = isQuiz ? "Submit quiz" : "Submit exam";
  return `

      <div class="exam-heading"><span class="eyebrow">${isQuiz ? "Quiz" : "Exam"} · ${esc(exam.subject || "Class activity")}</span><h2>${esc(exam.title)}</h2><div class="exam-context">${esc(exam.yearLevel || "All years")} · ${exam.sectionScope === "ALL" ? "All sections" : `Section ${esc(exam.sectionScope)}`} · <span data-answer-count>${answeredCount} of ${total} answered</span> · Leaving this window starts a 10-second submission warning · ${pointsPerQuestion} ${pointsPerQuestion === 1 ? "point" : "points"} per question · Answers saved on this device</div></div>
      <div class="timer-wrap"><span class="timer-caption">Time remaining</span><div id="timerDisplay" role="timer" aria-live="off" class="timer ${rt.secondsLeft <= 60 ? 'low' : ''}">${fmtTime(rt.secondsLeft)}</div></div>
    </div>
    ${state.draftSaveError ? `<div class="conn-banner" role="alert">${esc(state.draftSaveError)}</div>` : ""}
    <div class="progress-track" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${answeredCount}"><div class="progress-fill" style="width:${(answeredCount / total * 100) || 0}%"></div></div>
    <div class="exam-stage"><div class="question-block" data-active-question="${esc(q.id)}" role="region" aria-label="Current question" tabindex="0"><div class="question-kicker"><span class="part-label">${partLabel}</span><span class="question-count">Question ${rt.currentIdx + 1} of ${total} · ${pointsPerQuestion} ${pointsPerQuestion === 1 ? "point" : "points"}</span></div><div class="qtext">${esc(q.text)}</div>${q.type === "matching" ? '<p class="help-text">Choose the correct match for this item.</p>' : ""}${opts}</div>
    <nav class="question-navigator" aria-label="Question navigation"><div class="navigator-heading"><strong>Questions</strong><span>${total} total</span></div><div class="qnav">${navBtns}</div><div class="navigator-legend"><i class="legend-dot answered-dot"></i> Answered <i class="legend-dot"></i> Unanswered</div></nav></div>
    <div class="exam-nav-row">
      <div>
        <button id="examPrevious" class="btn secondary" ${rt.currentIdx === 0 ? "disabled" : ""} onclick="jumpTo(${rt.currentIdx - 1})">&larr; Previous</button>
        ${rt.currentIdx < total - 1 ? `<button id="examNext" class="btn" onclick="jumpTo(${rt.currentIdx + 1})">Next &rarr;</button>` : ``}
      </div>
      <button id="examSubmit" class="btn" ${state.submitting ? "disabled" : ""} onclick="confirmSubmit()">${state.submitting ? "Saving..." : submitLabel}</button>
    </div>
  </div></div>`;
}
function selectAnswer(qid, idx) { if (!state.runtime || state.submitting || state.runtime.pendingSubmission || state.runtime.focusDeadlineAt) return; state.runtime.answers[qid] = idx; saveCurrentAttempt(); render(); }
function setIdentificationAnswer(qid, value) {
  if (!state.runtime || state.submitting || state.runtime.pendingSubmission || state.runtime.focusDeadlineAt) return;
  value = value.toUpperCase();
  state.runtime.answers[qid] = value;
  saveCurrentAttempt();
  const questionIndex = state.runtime.exam.questions.findIndex(q => q.id === qid);
  const navButton = document.getElementById(`question-nav-${questionIndex}`);
  if (navButton) {
    const answered = value.trim() !== "";
    navButton.classList.toggle("answered", answered);
    navButton.setAttribute("aria-label", `Question ${questionIndex + 1}, ${answered ? "answered" : "not answered"}`);
    navButton.querySelector("b")?.remove();
    if (answered) navButton.insertAdjacentHTML("beforeend", "<b>✓</b>");
  }
  const answeredCount = answeredQuestionCount(state.runtime);
  const total = state.runtime.exam.questions.length;
  document.querySelectorAll("[data-answer-count]").forEach(label => { label.textContent = `${answeredCount} of ${total} answered`; });
  const progress = document.querySelector('[role="progressbar"]');
  progress?.setAttribute("aria-valuenow", answeredCount);
  const fill = progress?.querySelector(".progress-fill");
  if (fill) fill.style.width = `${answeredCount / total * 100}%`;
}
function jumpTo(idx) {
  if (idx < 0 || idx >= state.runtime.exam.questions.length) return;
  state.runtime.currentIdx = idx;
  saveCurrentAttempt();
  render();
}
function confirmSubmit() {
  if (!state.runtime || state.submitting || state.runtime.pendingSubmission || state.runtime.focusDeadlineAt) return;
  const total = state.runtime.exam.questions.length;
  const answered = answeredQuestionCount(state.runtime);
  const isQuiz = state.runtime.exam.activityType === "quiz";
  const activityName = isQuiz ? "quiz" : "exam";
  const msg = answered < total
    ? `You've answered ${answered} of ${total} questions. Submit this ${activityName} anyway?`
    : `Submit your ${activityName} now?`;
  showModal({
    title: `Submit ${activityName}`,
    message: msg,
    confirmLabel: `Submit ${activityName}`,
    cancelLabel: "Cancel",
    onConfirm: () => { clearInterval(state.runtime.timerId); submitExam(false); }
  });
}
async function submitExam(autoSubmitted, submitReason = autoSubmitted ? "time_limit" : "manual") {
  if (state.submitting || !state.runtime) return;
  state.submitting = true;
  const rt = state.runtime;
  const exam = rt.exam;
  if (rt.timerId) clearInterval(rt.timerId);
  if (autoSubmitted) rt.pendingSubmission = submitReason;
  rt.focusDeadlineAt = null;
  saveCurrentAttempt();
  if (!rt.submissionId) rt.submissionId = Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16).padStart(8, "0")).join("");
  rt.secondsLeft = Math.max(0, Math.ceil((rt.deadlineAt - Date.now()) / 1000));
  const timeTakenSec = Math.max(0, exam.duration * 60 - rt.secondsLeft);
  const payload = { submissionId: rt.submissionId, examId: exam.id, name: state.currentUser.name, rollNo: state.currentUser.rollNo, answers: rt.answers, timeTakenSec, autoSubmitted: !!autoSubmitted, submitReason };
  render();
  try {
    const result = await apiRequest("POST", "/api/results", payload);
    state.lastResult = result;
    state.myResults = state.myResults.concat([{ id: result.id, examId: result.examId, examTitle: result.examTitle, activityType: result.activityType || exam.activityType || "exam", score: result.score, total: result.total, percent: result.percent }]);
    state.studentReview = null;
    state.studentReviewError = "";
    clearSavedAttempt();
    state.savedAttempt = null;
    state.runtime = null;
    state.submitting = false;
    setView("studentResult");
    closeModal();
  } catch (err) {
    state.submitting = false;
    if (err.status === 409) {
      state.runtime = null;
      await goStudentHome();
      closeModal();
      return;
    }
    rt.retryAt = Date.now() + 5000;
    rt.timerId = setInterval(tickTimer, 1000);
    showModal({ title: "Submission failed", message: (err.message || "Check your connection.") + (autoSubmitted ? " Your answers are saved on this device. Automatic submission will retry when connected." : " Your answers are saved; the assessment timer is still running."), confirmLabel: "Retry submission", onConfirm: () => submitExam(autoSubmitted, submitReason) });
    render();
  }
}

/* ============================= RESULT PAGE ============================= */
function renderStudentResult() {
  const r = state.lastResult;
  if (!r) return `<div class="wrap"><div class="wrap-inner"><div class="empty">Submission not found.</div></div></div>`;
  const percent = resultPercent(r);
  const passed = percent >= PASSING_PERCENT;
  const review = state.studentReview ? state.studentReview.map((question, index) => {
    const choices = Array.isArray(question.options) ? question.options : [];
    const answer = question.chosen === null || question.chosen === undefined || question.chosen === ""
      ? "Not answered"
      : question.type === "identification" ? question.chosen : choices[question.chosen] || `Option ${Number(question.chosen) + 1}`;
    return `<article class="review-item"><div class="rhead"><div class="rqtext">${index + 1}. ${esc(question.text)}</div><span class="tag ${question.isCorrect ? "correct" : "wrong"}">${question.isCorrect ? "Correct" : "Incorrect"} · ${question.pointsAwarded} / ${question.pointsPossible} points</span></div><div class="aline">Your answer: <b>${esc(answer)}</b></div></article>`;
  }).join("") : "";
  return `<div class="wrap"><div class="wrap-inner"><button class="back-link" onclick="goStudentHome()">&larr; Back to assessments</button><div class="score-hero"><span class="eyebrow">SUBMISSION RECEIVED</span><h2>Your work is saved.</h2><div class="meta">${esc(r.examTitle || "Assessment")}</div><div class="big">${r.score}<span style="font-size:26px;color:var(--ink-faint);"> / ${r.total} points</span></div><div class="pct">${percent.toFixed(1)}% · <strong class="grade-status ${passed ? "passed" : "failed"}">${passed ? "Passed" : "Failed"}</strong></div><div class="pct">${assessmentPointLabel(r)} per question · Time taken ${fmtTime(r.timeTakenSec)}</div></div><button type="button" class="btn secondary" onclick="openStudentResultReview()" ${state.studentReviewLoading ? "disabled" : ""}>${state.studentReviewLoading ? "Loading review..." : state.studentReview ? "Refresh my answer review" : "Review my answers"}</button>${state.studentReviewError ? `<div class="conn-banner" role="alert">${esc(state.studentReviewError)}</div>` : ""}${state.studentReview ? `<section aria-labelledby="studentReviewHeading"><h3 id="studentReviewHeading">Your answer review</h3><p class="help-text">This review shows your answers and points earned. Correct answers are not displayed.</p>${review || '<div class="empty">No question review is available.</div>'}</section>` : ""}<p class="help-text">You can review your submitted answers and points here. Correct answers are available to your teacher only.</p><button class="btn" onclick="goStudentHome()">Back to your workspace ${uiIcon("arrow")}</button></div></div>`;
}
async function openStudentResultReview() {
  const resultId = state.lastResult?.id;
  if (!resultId || state.studentReviewLoading) return;
  state.studentReviewLoading = true;
  state.studentReviewError = "";
  render();
  try {
    const result = await apiRequest("GET", `/api/results/${encodeURIComponent(resultId)}/review`);
    state.studentReview = result.review || [];
  } catch (err) {
    state.studentReviewError = err.message || "Could not load your answer review.";
  } finally {
    state.studentReviewLoading = false;
    render();
  }
}

/* ============================= ROUTER / RENDER ============================= */
function render() {
  const previous = captureInterfaceState();
  const previousQuestion = document.querySelector("[data-active-question]");
  const questionPosition = {id:previousQuestion?.dataset.activeQuestion, top:previousQuestion?.scrollTop || 0};
  const questionNavPosition = document.querySelector(".qnav")?.scrollTop || 0;
  let body = "";
  switch (state.view) {
    case "landing": body = renderLanding(); break;
    case "studentSignup": body = renderStudentSignup(); break;
    case "studentLogin": body = renderStudentLogin(); break;
    case "studentHome": body = renderStudentHome(); break;
    case "takeExam": body = renderTakeExam(); break;
    case "studentResult": body = renderStudentResult(); break;
    default: body = renderLanding();
  }
  document.body.className = state.currentUser ? `app-page student-page ${state.view === "studentHome" ? "student-home-page" : ""} ${state.view === "takeExam" ? "exam-in-progress" : ""}` : state.view === "landing" ? "landing-page" : state.view === "studentSignup" ? "auth-page student-signup-page" : "auth-page";
  const content = state.currentUser ? renderWorkspace(body, "student") : state.view === "landing" ? body : renderAuthLayout(body);
  document.getElementById("app").innerHTML = content + renderModalHtml() + renderFocusWarning();
  enhanceInterface(previous);
  syncStudentLiveUpdates();
  const workspace = document.querySelector('.workspace');
  if (workspace) workspace.inert = !!state.runtime && (!!state.runtime.focusDeadlineAt || !!state.runtime.pendingSubmission || state.submitting);
  document.querySelector('.assessment-warning button')?.focus({preventScroll:true});
  if (state.view === "takeExam") {
    const question = document.querySelector("[data-active-question]");
    if (question && question.dataset.activeQuestion === questionPosition.id) question.scrollTop = questionPosition.top;
    const questionNav = document.querySelector(".qnav");
    if (questionNav) {
      questionNav.scrollTop = questionNavPosition;
      questionNav.querySelector('[aria-current="step"]')?.scrollIntoView({block:"nearest"});
    }
    window.scrollTo({top:0, left:0, behavior:"auto"});
  }
  if (state.view === "studentSignup") updateSignupSections(previous?.view === state.view ? previous.fields.find(field => field.id === "up_section")?.value || "" : "");
}
let studentLiveTimer = null;
let studentLiveRequest = null;
function studentLiveActive() {
  return !!document.getElementById("app") && !!state.currentUser && ["studentHome", "studentResult"].includes(state.view) && !document.hidden && !document.querySelector('[role="dialog"]');
}
function syncStudentLiveUpdates() {
  clearTimeout(studentLiveTimer);
  if (!studentLiveActive()) { studentLiveRequest = null; return; }
  if (!studentLiveRequest) studentLiveTimer = setTimeout(refreshStudentWorkspace, 5000);
}
async function refreshStudentWorkspace() {
  if (!studentLiveActive() || studentLiveRequest) return;
  const request = {user:state.currentUser, view:state.view};
  studentLiveRequest = request;
  try {
    const [exams, results] = await Promise.all([apiRequest("GET", "/api/exams?studentView=1"), apiRequest("GET", `/api/results?rollNo=${encodeURIComponent(request.user.rollNo)}`)]);
    if (studentLiveRequest !== request || state.currentUser !== request.user || state.view !== request.view || !studentLiveActive()) return;
    const changed = JSON.stringify(exams) !== JSON.stringify(state.exams) || JSON.stringify(results) !== JSON.stringify(state.myResults) || !!state.connError;
    state.exams = exams; state.myResults = results; state.connError = "";
    if (state.view === "studentResult" && state.lastResult && !results.some(result => result.id === state.lastResult.id)) {
      state.studentReview = null; state.lastResult = null;
      state.draftRecoveryMessage = "Your teacher returned your assessment. Open it to continue with your saved answers and a fresh time allowance.";
      setView("studentHome");
    } else if (changed && state.view === "studentHome") {
      const position = window.scrollY; render(); window.scrollTo({top:position, behavior:"auto"});
    }
  } catch (error) {
    if (studentLiveRequest === request && studentLiveActive()) {
      state.connError = "Live updates paused. Reconnecting automatically; your displayed work is kept.";
      if (state.view === "studentHome") render();
    }
  } finally {
    if (studentLiveRequest === request) studentLiveRequest = null;
    syncStudentLiveUpdates();
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && studentLiveActive()) refreshStudentWorkspace(); else syncStudentLiveUpdates(); });
window.addEventListener("online", () => { if (studentLiveActive()) refreshStudentWorkspace(); });
window.addEventListener("pagehide", () => { clearTimeout(studentLiveTimer); studentLiveRequest = null; });
document.addEventListener("visibilitychange", handleVisibilityChange);
window.addEventListener("blur", warnAssessmentFocus);
window.addEventListener("focus", () => { if (state.runtime?.focusDeadlineAt) tickTimer(); });
document.addEventListener("keydown", event => {
  if (!state.runtime?.focusDeadlineAt || !document.querySelector('.assessment-warning')) return;
  if (event.key === "Escape" || event.key === "Tab") { event.preventDefault(); document.querySelector('.assessment-warning button')?.focus(); }
});
window.addEventListener("pagehide", saveCurrentAttempt);
window.addEventListener("beforeunload", saveCurrentAttempt);
window.addEventListener("popstate", handleQuizBackNavigation);
render();



setTimeout(() => {
  const check = document.createElement('meta'); check.id='uiLayoutCheck';
  check.content=JSON.stringify({width:innerWidth,documentWidth:document.documentElement.scrollWidth,view:state.view,overflow:document.documentElement.scrollWidth>innerWidth+1});
  document.head.append(check);
}, 100);
</script></body></html>
